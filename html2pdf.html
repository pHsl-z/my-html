<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HTML 转 PDF 工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #0a0a0a; color: #e6e6e6; }

        .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

        .toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #161616; border-bottom: 1px solid #2a2a2a; flex-shrink: 0; flex-wrap: wrap; }
        .toolbar h1 { font-size: 16px; font-weight: 600; color: #fff; margin-right: 8px; white-space: nowrap; }

        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 8px 16px; border: none; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; white-space: nowrap; font-family: inherit; }
        .btn-primary { background: #0066ff; color: #fff; }
        .btn-primary:hover { background: #0052cc; }
        .btn-success { background: #00a86b; color: #fff; }
        .btn-success:hover { background: #008c5a; }
        .btn-secondary { background: #2a2a2a; color: #e6e6e6; border: 1px solid #3a3a3a; }
        .btn-secondary:hover { background: #333; }

        .settings-row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #aaa; }
        .settings-row select, .settings-row input { padding: 4px 8px; background: #1a1a1a; border: 1px solid #3a3a3a; border-radius: 4px; color: #e6e6e6; font-size: 12px; outline: none; font-family: inherit; }
        .settings-row select:focus, .settings-row input:focus { border-color: #0066ff; }

        .main { display: flex; flex: 1; overflow: hidden; }

        .editor-panel { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #2a2a2a; min-width: 0; }
        .editor-header { display: flex; align-items: center; justify-content: space-between; padding: 6px 12px; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; font-size: 12px; color: #888; }
        .editor-wrap { flex: 1; position: relative; overflow: hidden; }
        textarea { width: 100%; height: 100%; background: #0d0d0d; color: #e6e6e6; border: none; padding: 12px; font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size: 13px; line-height: 1.6; resize: none; outline: none; tab-size: 4; -webkit-user-select: text; user-select: text; }

        .preview-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .preview-header { display: flex; align-items: center; justify-content: space-between; padding: 6px 12px; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; font-size: 12px; color: #888; }
        .preview-wrap { flex: 1; overflow: hidden; background: #fff; }
        iframe { width: 100%; height: 100%; border: none; }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 500; z-index: 10000; transition: transform 0.3s ease; pointer-events: none; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast-success { background: #00a86b; color: #fff; }
        .toast-error { background: #dc3545; color: #fff; }
        .toast-info { background: #0066ff; color: #fff; }

        @media print {
            .app, .toolbar, .editor-panel, .preview-header { display: none !important; }
            .preview-panel { flex: none !important; }
            .preview-wrap { overflow: visible !important; }
            iframe { display: none !important; }
            .print-content { display: block !important; }
        }

        @media (max-width: 768px) {
            .main { flex-direction: column; }
            .editor-panel { border-right: none; border-bottom: 1px solid #2a2a2a; flex: 1; }
            .preview-panel { flex: 1; }
            .toolbar { gap: 4px; padding: 6px 8px; }
            .toolbar h1 { font-size: 14px; }
            .btn { padding: 6px 10px; font-size: 12px; }
            .settings-row { font-size: 11px; }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="toolbar">
            <h1>📄 HTML 转 PDF</h1>
            <div class="settings-row">
                <label>纸张</label>
                <select id="pageSize">
                    <option value="a4">A4</option>
                    <option value="a3">A3</option>
                    <option value="a5">A5</option>
                    <option value="letter">Letter</option>
                    <option value="legal">Legal</option>
                </select>
            </div>
            <div class="settings-row">
                <label>方向</label>
                <select id="orientation">
                    <option value="portrait">纵向</option>
                    <option value="landscape">横向</option>
                </select>
            </div>
            <div class="settings-row">
                <label>边距</label>
                <input type="number" id="marginMm" min="0" max="50" value="10" style="width:50px;">
                <span>mm</span>
            </div>
            <button class="btn btn-primary" onclick="exportPdf()">导出 PDF</button>
            <button class="btn btn-success" onclick="printPdf()">打印/另存PDF</button>
            <button class="btn btn-secondary" onclick="clearEditor()">清空</button>
            <button class="btn btn-secondary" onclick="loadSample()">示例</button>
        </div>
        <div class="main">
            <div class="editor-panel">
                <div class="editor-header">
                    <span>HTML 代码</span>
                    <span id="charCount">0 字符</span>
                </div>
                <div class="editor-wrap">
                    <textarea id="htmlEditor" spellcheck="false" placeholder="在此输入 HTML 代码..."></textarea>
                </div>
            </div>
            <div class="preview-panel">
                <div class="preview-header">
                    <span>预览</span>
                </div>
                <div class="preview-wrap">
                    <iframe id="previewFrame"></iframe>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        var htmlEditor = document.getElementById('htmlEditor');
        var previewFrame = document.getElementById('previewFrame');
        var charCount = document.getElementById('charCount');
        var toastEl = document.getElementById('toast');

        var PDF_SIZES = {
            a4: { w: 210, h: 297 },
            a3: { w: 297, h: 420 },
            a5: { w: 148, h: 210 },
            letter: { w: 215.9, h: 279.4 },
            legal: { w: 215.9, h: 355.6 }
        };

        var savedContent = localStorage.getItem('html2pdf_content');
        if (savedContent) htmlEditor.value = savedContent;

        htmlEditor.addEventListener('input', function() {
            updatePreview();
            updateCharCount();
            localStorage.setItem('html2pdf_content', htmlEditor.value);
        });

        htmlEditor.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                var start = this.selectionStart;
                var end = this.selectionEnd;
                this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 4;
                updatePreview();
            }
        });

        function updatePreview() {
            var code = htmlEditor.value;
            var doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            try {
                if ('srcdoc' in previewFrame) {
                    previewFrame.srcdoc = code;
                } else {
                    doc.open(); doc.write(code); doc.close();
                }
            } catch(e) {
                try { previewFrame.src = 'data:text/html;charset=utf-8,' + encodeURIComponent(code); } catch(e2) {}
            }
        }

        function updateCharCount() {
            charCount.textContent = htmlEditor.value.length + ' 字符';
        }

        function showToast(msg, type) {
            toastEl.textContent = msg;
            toastEl.className = 'toast toast-' + (type || 'info') + ' show';
            setTimeout(function() { toastEl.classList.remove('show'); }, 2500);
        }

        function clearEditor() {
            if (!htmlEditor.value.trim()) { showToast('编辑器已经是空的', 'info'); return; }
            htmlEditor.value = '';
            updatePreview();
            updateCharCount();
            localStorage.removeItem('html2pdf_content');
            showToast('已清空', 'success');
        }

        function loadSample() {
            htmlEditor.value = '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n<style>\n  body {\n    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;\n    max-width: 800px;\n    margin: 0 auto;\n    padding: 40px 20px;\n    color: #333;\n    line-height: 1.8;\n  }\n  h1 {\n    color: #1a1a2e;\n    border-bottom: 3px solid #0066ff;\n    padding-bottom: 10px;\n    margin-bottom: 20px;\n  }\n  h2 {\n    color: #16213e;\n    margin-top: 30px;\n  }\n  .card {\n    background: #f8f9fa;\n    border-radius: 8px;\n    padding: 20px;\n    margin: 16px 0;\n    border-left: 4px solid #0066ff;\n  }\n  .highlight {\n    background: #fff3cd;\n    padding: 2px 6px;\n    border-radius: 3px;\n  }\n  table {\n    width: 100%;\n    border-collapse: collapse;\n    margin: 16px 0;\n  }\n  th, td {\n    border: 1px solid #ddd;\n    padding: 10px 14px;\n    text-align: left;\n  }\n  th {\n    background: #0066ff;\n    color: #fff;\n  }\n  tr:nth-child(even) {\n    background: #f2f2f2;\n  }\n</style>\n</head>\n<body>\n  <h1>📄 HTML 转 PDF 示例文档</h1>\n  <p>这是一个示例文档，展示 HTML 转 PDF 工具的渲染效果。</p>\n  \n  <h2>功能特点</h2>\n  <div class="card">\n    <ul>\n      <li>✅ 支持多种纸张大小（A3/A4/A5/Letter/Legal）</li>\n      <li>✅ 支持纵向和横向布局</li>\n      <li>✅ 自定义页边距</li>\n      <li>✅ 白色背景输出，适合打印</li>\n      <li>✅ 保留原始 HTML 样式</li>\n    </ul>\n  </div>\n  \n  <h2>数据表格</h2>\n  <table>\n    <tr><th>项目</th><th>状态</th><th>备注</th></tr>\n    <tr><td>PDF 导出</td><td><span class="highlight">已完成</span></td><td>支持多种格式</td></tr>\n    <tr><td>打印功能</td><td><span class="highlight">已完成</span></td><td>浏览器原生打印</td></tr>\n    <tr><td>实时预览</td><td><span class="highlight">已完成</span></td><td>即时渲染</td></tr>\n  </table>\n  \n  <h2>代码示例</h2>\n  <div class="card">\n    <code>exportPdf() - 直接生成 PDF 文件下载</code><br>\n    <code>printPdf() - 使用浏览器打印功能</code>\n  </div>\n</body>\n</html>';
            updatePreview();
            updateCharCount();
            localStorage.setItem('html2pdf_content', htmlEditor.value);
            showToast('已加载示例', 'success');
        }

        function exportPdf() {
            var content = htmlEditor.value.trim();
            if (!content) { showToast('请先输入 HTML 内容', 'error'); return; }

            var previewDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            if (!previewDoc || !previewDoc.body || !previewDoc.body.innerHTML.trim()) {
                showToast('预览内容为空', 'error'); return;
            }

            if (typeof window.jspdf === 'undefined' || typeof html2canvas === 'undefined') {
                showToast('PDF 库加载中，请稍后重试', 'error'); return;
            }

            showToast('正在生成 PDF...', 'info');

            var sizeName = document.getElementById('pageSize').value;
            var orient = document.getElementById('orientation').value;
            var marginVal = parseInt(document.getElementById('marginMm').value) || 10;
            var ps = PDF_SIZES[sizeName] || PDF_SIZES.a4;
            var pwMm = orient === 'landscape' ? ps.h : ps.w;
            var phMm = orient === 'landscape' ? ps.w : ps.h;
            var cwMm = pwMm - marginVal * 2;
            var chMm = phMm - marginVal * 2;
            var cwPx = Math.round(cwMm * 3.7795275591);

            var container = document.createElement('div');
            container.setAttribute('data-pdf-container', 'true');
            container.style.cssText = 'position:fixed;left:-9999px;top:0;width:' + cwPx + 'px;background:#fff;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#000;line-height:1.6;z-index:-1;';

            var pStyles = previewDoc.querySelectorAll('style');
            var sHtml = Array.from(pStyles).map(function(s) { return s.outerHTML; }).join('');
            container.innerHTML = sHtml + previewDoc.body.innerHTML;
            document.body.appendChild(container);

            var title = (content.match(/<title[^>]*>([\s\S]*?)<\/title>/i) || [])[1];
            title = (title || '').trim() || 'export';
            var filename = title.replace(/[^a-zA-Z0-9\u4e00-\u9fa5_-]/g, '_') + '.pdf';

            html2canvas(container, {
                scale: 2,
                useCORS: true,
                logging: false,
                backgroundColor: '#ffffff',
                width: cwPx,
                windowWidth: cwPx,
                onclone: function(clonedDoc) {
                    var headStyles = clonedDoc.querySelectorAll('head style, head link[rel="stylesheet"]');
                    headStyles.forEach(function(s) { s.remove(); });

                    var cc = clonedDoc.querySelector('[data-pdf-container]');
                    if (cc) {
                        cc.style.setProperty('background', '#ffffff', 'important');
                        cc.style.setProperty('background-color', '#ffffff', 'important');
                        cc.querySelectorAll('*').forEach(function(el) {
                            el.style.setProperty('background', '#ffffff', 'important');
                            el.style.setProperty('background-color', '#ffffff', 'important');
                            el.style.setProperty('background-image', 'none', 'important');
                            var ic = el.style.color;
                            if (ic) {
                                var cr2 = -1, cg2 = -1, cb2 = -1;
                                var rm = ic.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
                                if (rm) { cr2 = parseInt(rm[1]); cg2 = parseInt(rm[2]); cb2 = parseInt(rm[3]); }
                                else {
                                    var hm = ic.match(/^#([0-9a-f]{3,6})$/i);
                                    if (hm) { var hx = hm[1]; if (hx.length===3) hx=hx[0]+hx[0]+hx[1]+hx[1]+hx[2]+hx[2]; cr2=parseInt(hx.substring(0,2),16); cg2=parseInt(hx.substring(2,4),16); cb2=parseInt(hx.substring(4,6),16); }
                                }
                                if (cr2 >= 0) { var cl = (0.299*cr2+0.587*cg2+0.114*cb2)/255; if (cl>0.8) el.style.setProperty('color','#333333','important'); }
                            }
                        });
                    }
                }
            }).then(function(canvas) {
                var jsPDF = window.jspdf.jsPDF;
                var imgWMm = cwMm;
                var imgHMm = (canvas.height * imgWMm) / canvas.width;
                var pdf = new jsPDF(orient === 'landscape' ? 'l' : 'p', 'mm', sizeName);
                var posMm = 0;
                var remMm = imgHMm;

                while (remMm > 0) {
                    var srcY = posMm * (canvas.width / imgWMm);
                    var srcH = chMm * (canvas.width / imgWMm);
                    var pc = document.createElement('canvas');
                    pc.width = canvas.width;
                    pc.height = Math.min(Math.round(srcH), canvas.height - Math.round(srcY));
                    if (pc.height <= 0) break;
                    var ctx = pc.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, pc.width, pc.height);
                    ctx.drawImage(canvas, 0, Math.round(srcY), pc.width, pc.height, 0, 0, pc.width, pc.height);
                    var imgData = pc.toDataURL('image/jpeg', 0.95);
                    if (posMm > 0) pdf.addPage();
                    var pihMm = (pc.height * imgWMm) / canvas.width;
                    pdf.addImage(imgData, 'JPEG', marginVal, marginVal, imgWMm, pihMm);
                    remMm -= chMm;
                    posMm += chMm;
                }

                var blob = pdf.output('blob');
                if (navigator.share && navigator.canShare && navigator.canShare({ files: [new File([blob], filename, { type: 'application/pdf' })] })) {
                    var file = new File([blob], filename, { type: 'application/pdf' });
                    navigator.share({ files: [file], title: title }).then(function() {
                        showToast('PDF 导出成功', 'success');
                    }).catch(function(err) {
                        if (err.name !== 'AbortError') pdf.save(filename);
                    });
                } else {
                    pdf.save(filename);
                    showToast('PDF 导出成功', 'success');
                }
                try { document.body.removeChild(container); } catch(e) {}
            }).catch(function(err) {
                showToast('PDF 生成失败', 'error');
                try { document.body.removeChild(container); } catch(e) {}
            });
        }

        function printPdf() {
            var content = htmlEditor.value.trim();
            if (!content) { showToast('请先输入 HTML 内容', 'error'); return; }

            var sizeName = document.getElementById('pageSize').value;
            var orient = document.getElementById('orientation').value;
            var marginVal = parseInt(document.getElementById('marginMm').value) || 10;
            var ps = PDF_SIZES[sizeName] || PDF_SIZES.a4;

            var printWin = window.open('', '_blank');
            if (!printWin) { showToast('请允许弹出窗口', 'error'); return; }

            var printHtml = '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
                '<style>' +
                '@page { size: ' + sizeName + ' ' + orient + '; margin: ' + marginVal + 'mm; }' +
                'body { background: #fff !important; color: #000 !important; }' +
                '* { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }' +
                '</style>' +
                '</head><body>' + content + '</body></html>';

            printWin.document.open();
            printWin.document.write(printHtml);
            printWin.document.close();

            printWin.onload = function() {
                setTimeout(function() { printWin.print(); }, 500);
            };
        }

        updatePreview();
        updateCharCount();
    </script>
</body>
</html>
