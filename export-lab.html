<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>导出图片方案实验室</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dom-to-image@2.6.0/dist/dom-to-image.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zumer/snapdom@1/dist/snapdom.min.js"></script>
<script type="module">
/* modern-screenshot v4 只提供 ESM，导入后挂到 window 供测试调用 */
import { domToPng } from 'https://cdn.jsdelivr.net/npm/modern-screenshot@4/dist/index.mjs';
window.modernScreenshot = { domToPng };
</script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:-apple-system,BlinkMacSystemFont,sans-serif; background:#0f0f0f; color:#e8e8e8; padding:16px; padding-bottom:calc(40px + env(safe-area-inset-bottom)); font-size:14px; line-height:1.6; }
h1 { font-size:20px; margin-bottom:4px; }
h2 { font-size:15px; margin:22px 0 10px; color:#7cb3ff; }
.tip { color:#999; font-size:12px; margin-bottom:14px; }
textarea { width:100%; height:150px; background:#1a1a1a; color:#cde; border:1px solid #333; border-radius:6px; padding:10px; font:11px/1.5 Menlo,monospace; }
.btn { display:inline-block; background:#2a2a2a; color:#fff; border:1px solid #444; border-radius:6px; padding:9px 14px; font-size:13px; margin:4px 4px 4px 0; cursor:pointer; }
.btn:active { opacity:.7; }
.btn.primary { background:#0066ff; border-color:#0066ff; }
.btn.go { background:#0a7d4f; border-color:#0a7d4f; width:100%; padding:12px; font-size:14px; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0; }
.cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:12px; }
.card { background:#1a1a1a; border:1px solid #2e2e2e; border-radius:8px; padding:12px; }
.card h3 { font-size:14px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; gap:6px; }
.badge { font-size:11px; padding:2px 8px; border-radius:10px; white-space:nowrap; }
.badge.idle { background:#333; color:#aaa; }
.badge.run { background:#7a5b00; color:#ffd; }
.badge.ok { background:#0a5c3a; color:#b8f5d8; }
.badge.err { background:#7a1616; color:#ffc9c9; }
.meta { font-size:11px; color:#8ab; margin:6px 0; word-break:break-all; }
.err { font-size:11px; color:#ff9; background:#3a2a00; padding:6px; border-radius:4px; margin:6px 0; white-space:pre-wrap; word-break:break-all; }
.imgwrap { background:#fff; border-radius:6px; padding:4px; margin-top:8px; text-align:center; }
.imgwrap img { max-width:100%; height:auto; }
.hint { font-size:11px; color:#777; margin-top:4px; }
pre#log { background:#121212; border:1px solid #2a2a2a; border-radius:6px; padding:10px; font:10px/1.5 Menlo,monospace; color:#9c9; max-height:260px; overflow:auto; white-space:pre-wrap; word-break:break-all; }
.diag { background:#161b22; border:1px solid #2a3542; border-radius:8px; padding:12px; font:11px/1.7 Menlo,monospace; color:#9fc; word-break:break-all; }
iframe#labFrame { position:fixed; left:-99999px; top:0; width:860px; height:900px; border:none; background:#fff; }
label { font-size:12px; color:#aaa; }
</style>
</head>
<body>
<h1>📷 导出图片方案实验室</h1>
<p class="tip">在真实设备（尤其 iPhone Safari）逐个运行方案，对比结果后筛选。每步都有日志，失败会显示具体原因。图片可长按保存。</p>

<h2>① 测试文档</h2>
<textarea id="docSrc" spellcheck="false"></textarea>
<div class="row">
  <button class="btn primary" onclick="loadDoc()">↻ 载入文档（渲染公式）</button>
  <span id="docState" class="badge idle">未载入</span>
</div>

<h2>② 选择倍率并运行方案</h2>
<div class="row">
  <label><input type="radio" name="scale" value="1"> 1x</label>
  <label><input type="radio" name="scale" value="2" checked> 2x</label>
  <label><input type="radio" name="scale" value="3"> 3x</label>
  <span style="color:#777;font-size:12px">（倍率越高越清晰，但 iOS canvas 有面积上限，见下方诊断）</span>
</div>
<div class="row">
  <button class="btn go" onclick="runAll()">▶ 全部运行</button>
</div>
<div class="cards" id="cards"></div>

<h2>③ 设备诊断</h2>
<div class="diag" id="diag">检测中…</div>

<h2>④ 运行日志</h2>
<pre id="log"></pre>

<iframe id="labFrame"></iframe>

<script>
/* ---------- 测试文档（MathJax v3 + 单$定界符 + 分数/上下标/选项） ---------- */
var DEFAULT_DOC = [
'<!DOCTYPE html><html><head><meta charset="utf-8"><title>数学卷</title>',
'<script>window.MathJax={tex:{inlineMath:[["$","$"],["\\\\(","\\\\)"]]}};<\/script>',
'<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"><\/script>',
'<style>body{font-family:-apple-system,"PingFang SC",sans-serif;padding:24px;line-height:1.9;font-size:18px;color:#111;background:#fff}',
'h3{font-size:17px;margin:18px 0 6px} .opt{padding-left:2em}</style></head><body>',
'<h3>一、选择题</h3>',
'<p>1. 已知函数 $f(x)=\\dfrac{1}{3}x^{3}-ax^{2}+2$，若 $f\'(1)=0$，则 $a$ 的值为（　　）</p>',
'<p class="opt">A. $1$　　B. $2$　　C. $3$　　D. $4$</p>',
'<p>2. 在 $\\triangle ABC$ 中，角 $A$、$B$、$C$ 的对边为 $a$、$b$、$c$，已知 $\\sin A=\\dfrac{1}{2}$，则 $\\cos A=$（　　）</p>',
'<p class="opt">A. $\\dfrac{\\sqrt{3}}{2}$　　B. $\\dfrac{1}{2}$　　C. $-\\dfrac{\\sqrt{3}}{2}$　　D. $-\\dfrac{1}{2}$</p>',
'<h3>二、解答题</h3>',
'<p>数列 $\\{a_n\\}$ 满足 $S_n=2a_n-1$（$n\\in \\mathbb{N}^*$），求 $a_1$、$a_2$ 及通项公式。</p>',
'<p>设 $\\alpha \\in (0,\\dfrac{\\pi}{2})$，证明：$\\sin\\alpha+\\cos\\alpha>1$。</p>',
'</body></html>'
].join('\n');
document.getElementById('docSrc').value = DEFAULT_DOC;

/* ---------- 日志与卡片 ---------- */
var t0 = Date.now();
function log(msg) {
  var el = document.getElementById('log');
  var ts = ((Date.now() - t0) / 1000).toFixed(2) + 's';
  el.textContent = '[' + ts + '] ' + msg + '\n' + el.textContent;
  el.scrollTop = 0;
}
function addCard(id, title, note) {
  var cards = document.getElementById('cards');
  var c = document.createElement('div');
  c.className = 'card'; c.id = 'card-' + id;
  c.innerHTML = '<h3><span>' + title + '</span><span class="badge idle" id="st-' + id + '">待运行</span></h3>'
    + (note ? '<div class="meta">' + note + '</div>' : '')
    + '<div id="body-' + id + '"></div>';
  cards.appendChild(c);
}
function setStatus(id, cls, text) {
  var el = document.getElementById('st-' + id);
  el.className = 'badge ' + cls; el.textContent = text;
}
function putResult(id, blobUrl, meta) {
  var body = document.getElementById('body-' + id);
  body.innerHTML = '<div class="meta">' + meta + '</div>'
    + '<div class="imgwrap"><img src="' + blobUrl + '"></div>'
    + '<div class="hint">长按图片可保存</div>';
}

/* ---------- 文档载入 + MathJax 渲染等待（含 v2/v3 主动排版 + 字体等待） ---------- */
var frameReady = false;
function loadDoc() {
  frameReady = false;
  var st = document.getElementById('docState');
  st.className = 'badge run'; st.textContent = '渲染中';
  var f = document.getElementById('labFrame');
  var src = document.getElementById('docSrc').value;
  var d = f.contentDocument;
  d.open(); d.write(src); d.close();
  log('文档已写入 iframe');
  waitRender(d).then(function () {
    frameReady = true;
    st.className = 'badge ok'; st.textContent = '渲染完成';
    log('文档渲染完成 ✓ 公式数: ' + d.querySelectorAll('mjx-container, .MathJax').length);
  });
}
function waitRender(doc) {
    return new Promise(function(resolve) {
        var win = doc.defaultView;
        var start = Date.now(); var lastH = -1; var stable = 0;
        var timer = setInterval(function() {
            var h = 0;
            try { h = Math.max(doc.documentElement.scrollHeight, doc.body ? doc.body.scrollHeight : 0); } catch (e) {}
            if (h === lastH) stable++; else { stable = 0; lastH = h; }
            var loading = false;
            try {
                if (!win.MathJax && doc.querySelector('script[src*="mathjax"]')) loading = true;
                if (!win.katex && doc.querySelector('script[src*="katex"]')) loading = true;
            } catch (e) {}
            if ((stable >= 5 && !loading) || Date.now() - start >= 15000) {
                clearInterval(timer);
                var p = null;
                try {
                    if (win.MathJax && win.MathJax.startup && win.MathJax.startup.promise) {
                        p = win.MathJax.startup.promise.then(function(){ if (win.MathJax.startup.pageReady) return win.MathJax.startup.pageReady(); })
                            .then(function(){ return win.MathJax.typesetPromise ? win.MathJax.typesetPromise() : Promise.resolve(); })
                            .catch(function(){});
                    } else if (win.MathJax && win.MathJax.Hub && win.MathJax.Hub.Queue) {
                        p = new Promise(function(res){ try { win.MathJax.Hub.Queue(["Typeset", win.MathJax.Hub], function(){ res(); }); } catch(e){ res(); } });
                    }
                } catch (e) {}
                var chain = Promise.resolve(p).then(function(){
                    return new Promise(function(res){
                        try {
                            if (doc.fonts && doc.fonts.ready) Promise.race([doc.fonts.ready, new Promise(function(r){setTimeout(r,3000);})]).then(res,res);
                            else res();
                        } catch(e){ res(); }
                    });
                });
                Promise.race([chain, new Promise(function(r){ setTimeout(r, 10000); })]).then(resolve, resolve);
            }
        }, 300);
    });
}

/* ---------- 通用：blob 展示 ---------- */
function blobMeta(blob, w, h, ms) {
  return '耗时 ' + (ms/1000).toFixed(1) + 's · ' + w + '×' + h + ' · ' + (blob.size/1024).toFixed(0) + ' KB';
}

/* ---------- 方案 0：当前线上方案复刻（iframe + html2canvas） ---------- */
async function runCurrent(scale, id) {
  var d = document.getElementById('labFrame').contentDocument;
  var t = performance.now();
  log('[当前方案] html2canvas 开始…');
  var canvas = await html2canvas(d.body, {
    scale: scale, backgroundColor: '#ffffff', logging: false,
    width: 860, height: Math.max(d.body.scrollHeight, 100), windowWidth: 860
  });
  log('[当前方案] canvas ' + canvas.width + '×' + canvas.height + '，toBlob…');
  var blob = await new Promise(function(res, rej) {
    canvas.toBlob(function(b){ b ? res(b) : rej(new Error('toBlob 返回 null（可能超出 iOS canvas 面积上限）')); }, 'image/png');
    setTimeout(function(){ rej(new Error('toBlob 15 秒无响应')); }, 15000);
  });
  putResult(id, URL.createObjectURL(blob), blobMeta(blob, canvas.width, canvas.height, performance.now()-t));
}

/* ---------- 方案 1：html-to-image ---------- */
async function runHtmlToImage(scale, id) {
  var d = document.getElementById('labFrame').contentDocument;
  var t = performance.now();
  if (!window.htmlToImage) throw new Error('库未加载（检查网络/CDN）');
  var url = await window.htmlToImage.toPng(d.body, { pixelRatio: scale, backgroundColor: '#ffffff' });
  var blob = await (await fetch(url)).blob();
  var img = new Image();
  await new Promise(function(r){ img.onload = r; img.src = url; });
  putResult(id, URL.createObjectURL(blob), blobMeta(blob, img.naturalWidth, img.naturalHeight, performance.now()-t));
}

/* ---------- 方案 2：modern-screenshot ---------- */
async function runModern(scale, id) {
  var d = document.getElementById('labFrame').contentDocument;
  var t = performance.now();
  var ms = window.modernScreenshot || window.ModernScreenshot;
  if (!ms || !ms.domToPng) throw new Error('库未加载或全局名不对: ' + Object.keys(window).filter(function(k){return /modern/i.test(k);}));
  var url = await ms.domToPng(d.body, { scale: scale, backgroundColor: '#ffffff' });
  var blob = await (await fetch(url)).blob();
  var img = new Image();
  await new Promise(function(r){ img.onload = r; img.src = url; });
  putResult(id, URL.createObjectURL(blob), blobMeta(blob, img.naturalWidth, img.naturalHeight, performance.now()-t));
}

/* ---------- 方案 3：snapdom ---------- */
async function runSnapdom(scale, id) {
  var d = document.getElementById('labFrame').contentDocument;
  var t = performance.now();
  if (!window.snapdom) throw new Error('库未加载（检查网络/CDN）');
  var r = await window.snapdom(d.body, { scale: scale, backgroundColor: '#ffffff' });
  var url = null;
  if (typeof r === 'string') url = r;
  else if (r && r.src) url = r.src;
  else if (r && r.toDataURL) url = r.toDataURL('image/png');
  else if (r && r.toPng) { var p = await r.toPng(); url = (p && p.src) ? p.src : p; }
  else if (r && r.url) url = r.url;
  if (!url) throw new Error('snapdom 返回了无法识别的结果: ' + String(r));
  var blob = await (await fetch(url)).blob();
  var img = new Image();
  await new Promise(function(res){ img.onload = res; img.src = url; });
  putResult(id, URL.createObjectURL(blob), blobMeta(blob, img.naturalWidth, img.naturalHeight, performance.now()-t));
}

/* ---------- 方案 4：dom-to-image（老牌） ---------- */
async function runDomToImage(scale, id) {
  var d = document.getElementById('labFrame').contentDocument;
  var t = performance.now();
  if (!window.domtoimage) throw new Error('库未加载（检查网络/CDN）');
  var url = await window.domtoimage.toPng(d.body, { style: { margin: '0' } });
  var blob = await (await fetch(url)).blob();
  var img = new Image();
  await new Promise(function(r){ img.onload = r; img.src = url; });
  putResult(id, URL.createObjectURL(blob), blobMeta(blob, img.naturalWidth, img.naturalHeight, performance.now()-t));
}

/* ---------- 方案 5：手工 foreignObject（零依赖） ---------- */
async function runForeignObject(scale, id) {
  var d = document.getElementById('labFrame').contentDocument;
  var t = performance.now();
  var w = d.body.scrollWidth, h = d.body.scrollHeight;
  var clone = d.documentElement.cloneNode(true);
  clone.querySelector('script[src*="mathjax"]') && clone.querySelectorAll('script').forEach(function(s){ s.remove(); });
  var xml = new XMLSerializer().serializeToString(clone);
  xml = xml.replace(/^<html[^>]*>/, '<html xmlns="http://www.w3.org/1999/xhtml">');
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '">'
    + '<foreignObject width="100%" height="100%">' + xml + '</foreignObject></svg>';
  var url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  var img = new Image();
  await new Promise(function(res, rej){ img.onload = res; img.onerror = function(){ rej(new Error('SVG 加载失败（iOS Safari 对 foreignObject 支持受限时会出现）')); }; img.src = url; });
  var c = document.createElement('canvas');
  c.width = w * scale; c.height = h * scale;
  var ctx = c.getContext('2d');
  if (!ctx) throw new Error('getContext 返回 null（canvas 尺寸超上限）');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(img, 0, 0, c.width, c.height);
  var blob = await new Promise(function(res, rej) {
    c.toBlob(function(b){ b ? res(b) : rej(new Error('toBlob 返回 null')); }, 'image/png');
    setTimeout(function(){ rej(new Error('toBlob 15 秒无响应')); }, 15000);
  });
  putResult(id, URL.createObjectURL(blob), blobMeta(blob, c.width, c.height, performance.now()-t));
}

/* ---------- 运行调度 ---------- */
var PLANS = [
  { id: 'cur',   title: '0 · 当前线上方案', note: 'html2canvas 1.4.1（复刻 my-html 导出流程）', fn: runCurrent },
  { id: 'hti',   title: '1 · html-to-image', note: 'dom-to-image 现代分支，SVG foreignObject 机制', fn: runHtmlToImage },
  { id: 'ms',    title: '2 · modern-screenshot', note: '2023 新库，宣称对各 CSS 特性支持最好', fn: runModern },
  { id: 'snap',  title: '3 · snapdom', note: '2024 新库，宣称最快最准', fn: runSnapdom },
  { id: 'dti',   title: '4 · dom-to-image', note: '老牌经典（2015）', fn: runDomToImage },
  { id: 'fo',    title: '5 · 手工 foreignObject', note: '零依赖纯手写实现', fn: runForeignObject }
];
PLANS.forEach(function(p) { addCard(p.id, p.title, p.note); });

function getScale() {
  var r = document.querySelector('input[name=scale]:checked');
  return r ? parseInt(r.value, 10) : 2;
}
async function runOne(p, scale) {
  if (!frameReady) { setStatus(p.id, 'err', '请先载入文档'); return; }
  setStatus(p.id, 'run', '运行中');
  document.getElementById('body-' + p.id).innerHTML = '';
  log('▶ [' + p.title + '] 开始（scale=' + scale + '）');
  var t = performance.now();
  try {
    await p.fn(scale, p.id);
    setStatus(p.id, 'ok', '成功 ' + ((performance.now()-t)/1000).toFixed(1) + 's');
    log('✓ [' + p.title + '] 成功');
  } catch (e) {
    setStatus(p.id, 'err', '失败');
    document.getElementById('body-' + p.id).innerHTML = '<div class="err">' + (e && e.message ? e.message : String(e)) + '</div>';
    log('✗ [' + p.title + '] ' + (e && e.message ? e.message : e));
  }
}
async function runAll() {
  var scale = getScale();
  for (var i = 0; i < PLANS.length; i++) {
    await runOne(PLANS[i], scale);
  }
  log('==== 全部方案运行完毕 ====');
}

/* ---------- 设备诊断 ---------- */
async function diag() {
  var el = document.getElementById('diag');
  var lines = [];
  lines.push('UA: ' + navigator.userAgent);
  lines.push('devicePixelRatio: ' + window.devicePixelRatio + ' · 屏幕: ' + screen.width + '×' + screen.height);
  if (navigator.deviceMemory) lines.push('deviceMemory: ' + navigator.deviceMemory + ' GB');
  lines.push('库加载: html2canvas=' + (typeof html2canvas) + ' / domtoimage=' + (typeof domtoimage)
    + ' / htmlToImage=' + (typeof htmlToImage) + ' / modernScreenshot=' + (typeof modernScreenshot)
    + ' / snapdom=' + (typeof snapdom));
  el.textContent = lines.join('\n');
  // canvas 面积上限探测
  var probes = [[4096,4096,'16.7M 像素'],[6000,6000,'36M'],[8192,8192,'67M'],[8192,16000,'131M'],[16384,16384,'268M']];
  el.textContent += '\ncanvas 上限探测:';
  for (var i = 0; i < probes.length; i++) {
    var p = probes[i];
    var ok = await probeCanvas(p[0], p[1]);
    el.textContent += '\n  ' + p[0] + '×' + p[1] + ' (' + p[2] + '): ' + (ok ? '✓ 可用' : '✗ 超限');
    if (!ok) break;
  }
  log('诊断完成');
}
function probeCanvas(w, h) {
  return new Promise(function(res) {
    try {
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      var ctx = c.getContext('2d');
      if (!ctx) return res(false);
      ctx.fillRect(0, 0, 2, 2);
      c.toBlob(function(b){ res(!!b); }, 'image/png');
      setTimeout(function(){ res(false); }, 4000);
    } catch (e) { res(false); }
  });
}
diag();
loadDoc();
</script>
</body>
</html>
