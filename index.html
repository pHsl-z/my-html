        // 把 "1.2 KB" / "890 B" / "3.4 MB" 之类的字符串解析为 KB 数值
        function favParseSizeToKB(sizeStr) {
            if (typeof sizeStr !== 'string') return null;
            const m = sizeStr.trim().match(/^([\d.]+)\s*(B|KB|MB|GB)$/i);
            if (!m) return null;
            const v = parseFloat(m[1]);
            if (isNaN(v)) return null;
            const unit = m[2].toUpperCase();
            if (unit === 'B') return v / 1024;
            if (unit === 'KB') return v;
            if (unit === 'MB') return v * 1024;
            return v * 1024 * 1024;
        }

        // 依据当前排序设置对文件夹/文件排序；文件夹组始终排在文件组前面
        function favSortEntries(folders, items) {
            const keyFn = {
                name: function(x) { return x.name || x.title || ''; },
                device: function(x) { return x.updatedBy || ''; },
                size: function(x) { return x.size ? favParseSizeToKB(x.size) : null; },
                time: function(x) { return favEffectiveTs(x); }
            }[favSortBy] || function(x) { return favEffectiveTs(x); };

            const cmp = function(a, b) {
                let va = keyFn(a), vb = keyFn(b);
                const na = (va === null || va === undefined || va === ''), nb = (vb === null || vb === undefined || vb === '');
                if (na && nb) return 0;
                if (na) return 1;   // 无值的条目（如按大小排序时的文件夹）始终排最后
                if (nb) return -1;
                let r;
                if (typeof va === 'number' && typeof vb === 'number') r = va - vb;
                else if (favSortBy === 'time') r = new Date(va) - new Date(vb);
                else r = String(va).localeCompare(String(vb), 'zh-CN');
                return favSortDir === 'asc' ? r : -r;
            };
            return {
                folders: folders.slice().sort(cmp),
                items: items.slice().sort(cmp)
            };
        }

        function favGenerateId(prefix) {
            return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).substring(2, 8);
        }

        function loadFavorites() {
            try {
                const stored = localStorage.getItem(FAVORITES_STORAGE_KEY);
                if (stored) {
                    const data = JSON.parse(stored);
                    favoritesData = {
                        folders: Array.isArray(data.folders) ? data.folders : [],
                        items: Array.isArray(data.items) ? data.items : [],
                        deleted: Array.isArray(data.deleted) ? data.deleted : [],
                        updatedAt: data.updatedAt || null,
                        updatedBy: data.updatedBy || null
                    };
                }
            } catch (error) {
                favoritesData = { folders: [], items: [], deleted: [], updatedAt: null, updatedBy: null };
            }
        }

        // 保存收藏到localStorage；bump=false 时不刷新时间戳（云拉取时保留云端时间）
        function saveFavorites(bump) {
            if (bump !== false) {
                favoritesData.updatedAt = new Date().toISOString();
                favoritesData.updatedBy = (typeof favSyncConfig !== 'undefined' && favSyncConfig) ? favSyncConfig.deviceName : '';
            }
            try {
                localStorage.setItem(FAVORITES_STORAGE_KEY, JSON.stringify(favoritesData));
                return true;
            } catch (error) {
                showToast('保存失败：本地存储空间不足', 'error');
                return false;
            }
        }

        /* ---------- ID 级合并核心（云同步 / 备份导入共用） ---------- */

        // 条目有效时间戳：新数据用 updatedAt，旧数据兜底 timestamp/createdAt
        function favEffectiveTs(entry) {
            return (entry && (entry.updatedAt || entry.timestamp || entry.createdAt)) || '1970-01-01T00:00:00Z';
        }

        // 给条目盖"设备名 + 时间"戳（新建/编辑/移动/重命名时调用）
        function favStamp(entry) {
            entry.updatedAt = new Date().toISOString();
            entry.updatedBy = (typeof favSyncConfig !== 'undefined' && favSyncConfig && favSyncConfig.deviceName) ? favSyncConfig.deviceName : '本机';
            return entry;
        }

        // 记录删除墓碑（同步时让删除跨设备生效，90 天后自动过期）
        function favAddTombstones(ids) {
            if (!Array.isArray(ids) || !ids.length) return;
            if (!Array.isArray(favoritesData.deleted)) favoritesData.deleted = [];
            const now = new Date().toISOString();
            favoritesData.deleted = favoritesData.deleted.filter(function(d) { return ids.indexOf(d.id) === -1; });
            ids.forEach(function(id) { favoritesData.deleted.push({ id: id, deletedAt: now }); });
        }

        // 纯函数：把远端数据（云端或备份文件）与本地合并，返回 {folders, items, deleted, stats}，不修改 favoritesData
        function favMergeData(remote) {
            const remoteFolders = (remote && Array.isArray(remote.folders)) ? remote.folders : [];
            const remoteItems = (remote && Array.isArray(remote.items)) ? remote.items : [];
            const stats = { foldersFromRemote: 0, itemsFromRemote: 0, foldersUpdated: 0, itemsUpdated: 0, foldersLocalOnly: 0, itemsLocalOnly: 0, deletesApplied: 0, foldersMerged: 0 };

            // 1. 墓碑并集，取每个 id 较新的删除时间；超过 90 天的自动清理
            const tomb = {};
            const localDeleted = Array.isArray(favoritesData.deleted) ? favoritesData.deleted : [];
            const remoteDeleted = (remote && Array.isArray(remote.deleted)) ? remote.deleted : [];
            localDeleted.concat(remoteDeleted).forEach(function(d) {
                if (!d || !d.id) return;
                const t = d.deletedAt || '';
                if (!tomb[d.id] || new Date(t) > new Date(tomb[d.id])) tomb[d.id] = t;
            });
            const cutoff = Date.now() - 90 * 24 * 3600 * 1000;
            Object.keys(tomb).forEach(function(id) {
                if (!tomb[id] || new Date(tomb[id]).getTime() < cutoff) delete tomb[id];
            });

            // 2. 文件夹按 ID 取并集；同 ID 冲突保留时间较新的一版
            const remoteFolderIds = {};
            const folderMap = {};
            favoritesData.folders.forEach(function(f) { folderMap[f.id] = f; });
            remoteFolders.forEach(function(rf) {
                if (!rf || !rf.id) return;
                remoteFolderIds[rf.id] = true;
                const lf = folderMap[rf.id];
                if (!lf) { folderMap[rf.id] = rf; stats.foldersFromRemote++; }
                else if (new Date(favEffectiveTs(rf)) > new Date(favEffectiveTs(lf))) { folderMap[rf.id] = rf; stats.foldersUpdated++; }
            });
            favoritesData.folders.forEach(function(f) { if (!remoteFolderIds[f.id]) stats.foldersLocalOnly++; });

            // 3. 同位置同名文件夹自动合并为一个（两台设备各自建的"数学"），保留创建最早的那个
            let folderList = Object.keys(folderMap).map(function(k) { return folderMap[k]; });
            const remap = {};
            function resolveId(id) {
                let cur = id, guard = 0;
                while (cur && remap[cur] !== undefined && guard++ < 20) cur = remap[cur];
                return cur;
            }
            let pass = 0, deduped = true;
            while (deduped && pass++ < 5) {
                deduped = false;
                const groups = {};
                folderList.forEach(function(f) {
                    const key = (resolveId(f.parentId) || '@root') + '|' + (f.name || '');
                    (groups[key] = groups[key] || []).push(f);
                });
                Object.keys(groups).forEach(function(key) {
                    const g = groups[key];
                    if (g.length < 2) return;
                    g.sort(function(a, b) { return new Date(favEffectiveTs(a)) < new Date(favEffectiveTs(b)) ? -1 : 1; });
                    const survivor = g[0];
                    const dupIds = {};
                    g.slice(1).forEach(function(dup) { remap[dup.id] = survivor.id; dupIds[dup.id] = true; stats.foldersMerged++; });
                    folderList = folderList.filter(function(f) { return !dupIds[f.id]; });
                    deduped = true;
                });
            }
            let folders = folderList.map(function(f) {
                if (f.parentId && remap[f.parentId] !== undefined) return Object.assign({}, f, { parentId: resolveId(f.parentId) });
                return f;
            });

            // 4. 收藏按 ID 取并集；同 ID 冲突保留较新；墓碑时间晚于条目时间 → 删除生效
            const remoteItemIds = {};
            const itemMap = {};
            favoritesData.items.forEach(function(it) { itemMap[it.id] = it; });
            remoteItems.forEach(function(rit) {
                if (!rit || !rit.id) return;
                remoteItemIds[rit.id] = true;
                const lit = itemMap[rit.id];
                if (!lit) { itemMap[rit.id] = rit; stats.itemsFromRemote++; }
                else if (new Date(favEffectiveTs(rit)) > new Date(favEffectiveTs(lit))) { itemMap[rit.id] = rit; stats.itemsUpdated++; }
            });
            favoritesData.items.forEach(function(it) { if (!remoteItemIds[it.id]) stats.itemsLocalOnly++; });

            const keptItems = [];
            Object.keys(itemMap).forEach(function(id) {
                const it = itemMap[id];
                const t = tomb[id];
                if (t && new Date(t) > new Date(favEffectiveTs(it))) {
                    stats.deletesApplied++;
                } else {
                    if (t) delete tomb[id]; // 条目比墓碑新 = 删除后又重新收藏，墓碑作废
                    keptItems.push(it);
                }
            });

            // 文件夹墓碑同样生效
            const keptFolders = [];
            folders.forEach(function(f) {
                const t = tomb[f.id];
                if (t && new Date(t) > new Date(favEffectiveTs(f))) {
                    stats.deletesApplied++;
                } else {
                    if (t) delete tomb[f.id];
                    keptFolders.push(f);
                }
            });
            folders = keptFolders;

            // 5. 孤儿修复：指向不存在文件夹的条目归根目录；重定向被合并文件夹里的收藏
            const folderIds = {};
            folders.forEach(function(f) { folderIds[f.id] = true; });
            folders = folders.map(function(f) {
                if (f.parentId && !folderIds[f.parentId]) return Object.assign({}, f, { parentId: null });
                return f;
            });
            const items = keptItems.map(function(it) {
                const fid = it.folderId ? resolveId(it.folderId) : it.folderId;
                const fixed = (fid && folderIds[fid]) ? fid : null;
                if (fixed !== it.folderId) return Object.assign({}, it, { folderId: fixed });
                return it;
            });

            const deleted = Object.keys(tomb).map(function(id) { return { id: id, deletedAt: tomb[id] }; });

            // 6. 提示词同样按 ID 合并（云端与收藏夹存同一份数据文件）
            const promptsMerged = favMergePrompts(
                (remote && Array.isArray(remote.prompts)) ? remote.prompts : [],
                (remote && Array.isArray(remote.promptsDeleted)) ? remote.promptsDeleted : []
            );
            Object.assign(stats, promptsMerged.stats);

            return { folders: folders, items: items, deleted: deleted, prompts: promptsMerged.items, promptsDeleted: promptsMerged.deleted, stats: stats };
        }

        // 应用合并结果到本地并刷新界面
        function favApplyMergeResult(result) {
            favoritesData = {
                folders: result.folders,
                items: result.items,
                deleted: result.deleted,
                updatedAt: new Date().toISOString(),
                updatedBy: (typeof favSyncConfig !== 'undefined' && favSyncConfig && favSyncConfig.deviceName) ? favSyncConfig.deviceName : ''
            };
            if (favCurrentFolderId && !favoritesData.folders.some(function(f) { return f.id === favCurrentFolderId; })) {
                favCurrentFolderId = null;
            }
            saveFavorites(false);
            renderFavorites();
            if (result.prompts) {
                promptsData = { items: result.prompts, deleted: result.promptsDeleted || [] };
                savePrompts();
                renderPrompts();
            }
        }

        // 构建上传云端的载荷（version 2 含逐条时间戳、删除墓碑与提示词）
        function favBuildCloudPayload() {
            return JSON.stringify({
                version: 2,
                app: 'my-html-editor',
                updatedAt: new Date().toISOString(),
                updatedBy: (typeof favSyncConfig !== 'undefined' && favSyncConfig && favSyncConfig.deviceName) ? favSyncConfig.deviceName : '',
                folders: favoritesData.folders,
                items: favoritesData.items,
                deleted: Array.isArray(favoritesData.deleted) ? favoritesData.deleted : [],
                prompts: Array.isArray(promptsData.items) ? promptsData.items : [],
                promptsDeleted: Array.isArray(promptsData.deleted) ? promptsData.deleted : []
            });
        }

        // 文件夹层级：根目录为0，最深3级
        function getFavFolderDepth(folderId) {
            let depth = 0;
            let currentId = folderId;
            while (currentId) {
                depth++;
                const f = favoritesData.folders.find(function(x) { return x.id === currentId; });
                currentId = f ? f.parentId : null;
            }
            return depth;
        }

        // 以某文件夹为根的子树高度（自身为1）
        function getFavSubtreeHeight(folderId) {
            const children = favoritesData.folders.filter(function(f) { return f.parentId === folderId; });
            let maxChild = 0;
            for (const c of children) maxChild = Math.max(maxChild, getFavSubtreeHeight(c.id));
            return 1 + maxChild;
        }

        // folderId 是否位于 ancestorId 的子树内
        function isDescendantOf(folderId, ancestorId) {
            let currentId = folderId;
            while (currentId) {
                if (currentId === ancestorId) return true;
                const f = favoritesData.folders.find(function(x) { return x.id === currentId; });
                currentId = f ? f.parentId : null;
            }
            return false;
        }

        function collectFavSubtreeFolderIds(folderId) {
            const ids = [folderId];
            const children = favoritesData.folders.filter(function(f) { return f.parentId === folderId; });
            for (const c of children) {
                ids.push.apply(ids, collectFavSubtreeFolderIds(c.id));
            }
            return ids;
        }

        // 树形排序（带depth），供下拉选择使用
        function getSortedFolders() {
            const result = [];
            function walk(parentId, depth) {
                const children = favoritesData.folders
                    .filter(function(f) { return f.parentId === parentId; })
                    .sort(function(a, b) { return a.name.localeCompare(b.name, 'zh-CN'); });
                for (const c of children) {
                    result.push({ id: c.id, name: c.name, depth: depth });
                    walk(c.id, depth + 1);
                }
            }
            walk(null, 0);
            return result;
        }

        function getFolderPathArray(folderId) {
            // 只返回文件夹链，不包含根节点（根目录由标题"收藏夹"标识，避免字样重复）
            const chain = [];
            let currentId = folderId;
            while (currentId) {
                const f = favoritesData.folders.find(function(x) { return x.id === currentId; });
                if (!f) break;
                chain.unshift({ id: f.id, name: f.name });
                currentId = f.parentId;
            }
            return chain;
        }

        function getFavFolderName(folderId) {
            if (!folderId) return '收藏夹（根目录）';
            const f = favoritesData.folders.find(function(x) { return x.id === folderId; });
            return f ? f.name : '未知文件夹';
        }

        // 收藏当前页面（弹窗选择目标文件夹）
        function showFavoriteDialog() {
            const content = htmlEditor.value.trim();
            if (!content) { showToast('请先输入HTML内容再收藏', 'error'); return; }
            const title = extractTitleFromCode(content);
            const sorted = getSortedFolders();
            let options = '<option value="">📁 收藏夹（根目录）</option>';
            for (const f of sorted) {
                const indent = '\u00A0\u00A0\u00A0'.repeat(f.depth) + (f.depth > 0 ? '└ ' : '');
                options += '<option value="' + f.id + '">' + escapeHtml(indent + f.name) + '</option>';
            }
            const html = '<div style="display:flex;flex-direction:column;gap:16px;">'
                + '<div style="background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;padding:16px;">'
                + '<div style="color:#888;font-size:12px;margin-bottom:6px;">将要收藏的页面</div>'
                + '<div style="color:#e6e6e6;font-weight:500;font-size:14px;margin-bottom:6px;word-break:break-all;">' + escapeHtml(title) + '</div>'
                + '<div style="color:#888;font-size:12px;">📊 ' + formatCodeSize(content) + ' · ' + content.length + ' 字符</div>'
                + '</div>'
                + '<div>'
                + '<label style="display:block;color:#e6e6e6;margin-bottom:8px;font-size:13px;font-weight:500;">收藏位置</label>'
                + '<select id="favTargetFolder" style="width:100%;padding:10px 12px;background:#0d0d0d;border:1px solid #3a3a3a;border-radius:6px;color:#e6e6e6;font-size:13px;outline:none;">'
                + options + '</select>'
                + '<div style="color:#666;font-size:11px;margin-top:8px;">不选择文件夹时，默认收藏到根目录</div>'
                + '</div>'
                + '<button class="btn btn-warning" onclick="doFavorite()" style="justify-content:center;">⭐ 确认收藏</button>'
                + '</div>';
            showModal('⭐ 收藏到收藏夹', html);
        }

        function doFavorite() {
            const content = htmlEditor.value.trim();
            if (!content) { showToast('请先输入HTML内容再收藏', 'error'); return; }
            const select = document.getElementById('favTargetFolder');
            const folderId = select ? (select.value || null) : null;
            const newItem = {
                id: favGenerateId('fi'),
                title: extractTitleFromCode(content),
                content: content,
                folderId: folderId,
                timestamp: new Date().toISOString(),
                size: formatCodeSize(content)
            };
            favStamp(newItem);
            favoritesData.items.unshift(newItem);
            if (saveFavorites()) {
                closeModal();
                showToast('已收藏到「' + getFavFolderName(folderId) + '」', 'success');
            }
        }

        // 收藏夹页面（文件管理器）
        function openFavoritesPage() {
            const page = document.getElementById('favoritesPage');
            if (!page) return;
            loadPrompts();
            page.style.display = 'flex';
            requestAnimationFrame(function() {
                requestAnimationFrame(function() { page.classList.add('show'); });
            });
            const modalOverlay = document.getElementById('modalOverlay');
            if (modalOverlay) modalOverlay.classList.add('above-favorites');
            try {
                const savedTab = localStorage.getItem(FAV_TAB_STORAGE_KEY);
                if (savedTab === 'prompt') favActiveTab = 'prompt';
                else if (savedTab === 'fav') favActiveTab = 'fav';
            } catch (e) { }
            setFavActiveTab(favActiveTab);
            hideFavContextMenu();
        }

        function closeFavoritesPage() {
            const page = document.getElementById('favoritesPage');
            if (!page) return;
            page.classList.remove('show');
            setTimeout(function() { page.style.display = 'none'; }, 260);
            const modalOverlay = document.getElementById('modalOverlay');
            if (modalOverlay) modalOverlay.classList.remove('above-favorites');
            hideFavContextMenu();
            closeModal();
        }

        function renderFavorites() {
            const grid = document.getElementById('favGrid');
            const list = document.getElementById('favList');
            if (!grid) return;
            syncFavViewSortControls();

            const bcEl = document.getElementById('favBreadcrumb');
            if (bcEl) {
                const path = getFolderPathArray(favCurrentFolderId);
                if (!path.length) {
                    // 根目录：标题已是"收藏夹"，隐藏面包屑避免字样重复
                    bcEl.innerHTML = '';
                    bcEl.style.display = 'none';
                } else {
                    bcEl.style.display = '';
                    let bc = '';
                    for (let i = 0; i < path.length; i++) {
                        const p = path[i];
                        const isLast = i === path.length - 1;
                        if (isLast) {
                            bc += '<span class="fav-crumb active">' + escapeHtml(p.name) + '</span>';
                        } else {
                            const arg = p.id === null ? 'null' : '\'' + p.id + '\'';
                            bc += '<span class="fav-crumb" onclick="favGoTo(' + arg + ')"'
                                + ' ondragover="favCrumbDragOver(event)" ondragleave="favCrumbDragLeave(event)"'
                                + ' ondrop="favCrumbDrop(event, ' + arg + ')">' + escapeHtml(p.name) + '</span>'
                                + '<span class="fav-crumb-sep">›</span>';
                        }
                    }
                    bcEl.innerHTML = bc;
                }
            }

            const filteredFolders = favoritesData.folders
                .filter(function(f) { return f.parentId === favCurrentFolderId; });
            const filteredItems = favoritesData.items
                .filter(function(i) { return (i.folderId || null) === favCurrentFolderId; });
            const sorted = favSortEntries(filteredFolders, filteredItems);
            const folders = sorted.folders;
            const items = sorted.items;

            let gridHtml = '';
            for (const f of folders) gridHtml += renderFavFolderCard(f);
            for (const item of items) gridHtml += renderFavItemCard(item);
            if (!gridHtml) {
                gridHtml = '<div class="fav-empty"><div class="fav-empty-icon">⭐</div>'
                    + '<div>这里还没有收藏</div>'
                    + '<div class="fav-empty-hint">在「AI 文档」菜单中点击「收藏」即可把当前页面收藏到这里<br>支持拖动页面到文件夹进行整理</div></div>';
            }
            grid.innerHTML = gridHtml;

            let listHtml = '';
            for (const f of folders) listHtml += renderFavRow(f, true);
            for (const item of items) listHtml += renderFavRow(item, false);
            if (!listHtml) {
                listHtml = '<div class="fav-empty"><div class="fav-empty-icon">⭐</div>'
                    + '<div>这里还没有收藏</div>'
                    + '<div class="fav-empty-hint">在「AI 文档」菜单中点击「收藏」即可把当前页面收藏到这里<br>支持拖动页面到文件夹进行整理</div></div>';
            }
            if (list) list.innerHTML = listHtml;

            const sb = document.getElementById('favStatusbar');
            if (sb && favActiveTab !== 'prompt') {
                sb.innerHTML = '<span>📁 ' + folders.length + ' 个文件夹 · 📄 ' + items.length + ' 个页面</span>'
                    + '<span>当前 ' + getFavFolderDepth(favCurrentFolderId) + '/3 级 · 可拖动整理</span>';
            }

            const backBtn = document.getElementById('favBackBtn');
            if (backBtn) backBtn.style.visibility = favCurrentFolderId ? 'visible' : 'hidden';
            // 根目录时整行隐藏返回+面包屑，避免空行占位
            const navRow = document.getElementById('favNavRow');
            if (navRow) navRow.style.display = favCurrentFolderId ? '' : 'none';
        }

        // 列表视图行：文件夹或收藏条目
        function renderFavRow(entry, isFolder) {
            const id = entry.id;
            const title = isFolder ? entry.name : (entry.title || '无标题');
            const device = entry.updatedBy || '';
            const time = formatRelativeTime(isFolder ? favEffectiveTs(entry) : entry.timestamp);
            const childCount = isFolder
                ? favoritesData.folders.filter(function(x) { return x.parentId === id; }).length
                  + favoritesData.items.filter(function(x) { return x.folderId === id; }).length
                : 0;
            const dragHandlers = isFolder
                ? ' ondragover="favDragOver(event)" ondragleave="favDragLeave(event)"'
                  + ' ondrop="favDrop(event, \'' + id + '\')"'
                : '';
            const metaCols = (isFolder
                ? '<span class="fav-row-col fav-col-device"></span>'
                  + '<span class="fav-row-col fav-col-size">' + childCount + ' 项</span>'
                : '<span class="fav-row-col fav-col-device" title="来自 ' + escapeHtml(device) + '">' + escapeHtml(device) + '</span>'
                  + '<span class="fav-row-col fav-col-size">' + escapeHtml(entry.size || '') + '</span>')
                + '<span class="fav-row-col fav-col-time" title="收藏于 ' + escapeHtml(time) + '">' + escapeHtml(time) + '</span>';
            return '<div class="fav-row" draggable="true" data-fav-id="' + id + '" data-fav-type="' + (isFolder ? 'folder' : 'item') + '"'
                + ' onclick="' + (isFolder ? 'favOpenFolder(\'' + id + '\')' : 'favLoadItem(\'' + id + '\')') + '"'
                + ' oncontextmenu="showFavContextMenu(event, \'' + id + '\', ' + isFolder + ')"'
                + ' ondragstart="favDragStart(event, \'' + id + '\', \'' + (isFolder ? 'folder' : 'item') + '\')"'

        function renderFavFolderCard(f) {

            if (!favCurrentFolderId) return;

        function favCreateFolder() {
            const currentDepth = getFavFolderDepth(favCurrentFolderId);
            if (currentDepth >= 3) {
                showToast('当前已是最深层级，最多支持三级文件夹', 'error');
                return;
            }
            showFavInputDialog('📁 新建文件夹（第 ' + (currentDepth + 1) + ' 级）', '请输入文件夹名称', '新建文件夹', function(name) {

                };
                favStamp(newFolder);

        function favStartRename(id, isFolder) {
            hideFavContextMenu();
            const entry = isFolder
                ? favoritesData.folders.find(function(f) { return f.id === id; })
                : favoritesData.items.find(function(i) { return i.id === id; });
            if (!entry) return;
            showFavInputDialog('✏️ 重命名', '请输入新名称', isFolder ? entry.name : (entry.title || ''), function(newName) {
                if (isFolder) entry.name = newName; else entry.title = newName;

                    showToast('已重命名', 'success');

        function favStartDelete(id, isFolder) {
            hideFavContextMenu();
            if (isFolder) {
                const folder = favoritesData.folders.find(function(f) { return f.id === id; });
                if (!folder) return;
                const subtreeIds = collectFavSubtreeFolderIds(id);
                const itemCount = favoritesData.items.filter(function(i) { return subtreeIds.indexOf(i.folderId) !== -1; }).length;
                showConfirmDialog('确定删除文件夹「' + folder.name + '」吗？其中 ' + itemCount + ' 个收藏页面将一并删除。', function() {
                    const removedItemIds = favoritesData.items
                        .filter(function(i) { return subtreeIds.indexOf(i.folderId) !== -1; })
                        .map(function(i) { return i.id; });
                    favoritesData.folders = favoritesData.folders.filter(function(f) { return subtreeIds.indexOf(f.id) === -1; });
                    favoritesData.items = favoritesData.items.filter(function(i) { return subtreeIds.indexOf(i.folderId) === -1; });
                    favAddTombstones(subtreeIds.concat(removedItemIds));
                    if (subtreeIds.indexOf(favCurrentFolderId) !== -1) favCurrentFolderId = null;
                    saveFavorites();
                    renderFavorites();
                    showToast('文件夹已删除', 'success');
                });
            } else {
                showConfirmDialog('确定要删除这条收藏吗？', function() {
                    favoritesData.items = favoritesData.items.filter(function(i) { return i.id !== id; });
                    favAddTombstones([id]);
                    saveFavorites();
                    renderFavorites();
                    showToast('收藏已删除', 'success');

        // 通过菜单「移动到…」（触屏设备无法拖拽时的替代方案）
        function favMoveEntry(id, isFolder) {
            hideFavContextMenu();
            const entry = isFolder
                ? favoritesData.folders.find(function(f) { return f.id === id; })
                : favoritesData.items.find(function(i) { return i.id === id; });
            if (!entry) return;
            const subtreeHeight = isFolder ? getFavSubtreeHeight(id) : 1;
            const sorted = getSortedFolders();
            let options = '<option value="">📁 收藏夹（根目录）</option>';
            for (const f of sorted) {
                if (isFolder && (f.id === id || isDescendantOf(f.id, id))) continue;
                const wouldExceed = getFavFolderDepth(f.id) + 1 + (subtreeHeight - 1) > 3;
                const indent = '\u00A0\u00A0\u00A0'.repeat(f.depth) + (f.depth > 0 ? '└ ' : '');
                const label = indent + f.name + (wouldExceed ? '（层级超限）' : '');
                options += '<option value="' + f.id + '"' + (wouldExceed ? ' disabled' : '') + '>' + escapeHtml(label) + '</option>';
            }
            const currentFolderId = isFolder ? entry.parentId : entry.folderId;
            const html = '<div style="display:flex;flex-direction:column;gap:14px;">'
                + '<div>'
                + '<label style="display:block;color:#e6e6e6;margin-bottom:8px;font-size:13px;font-weight:500;">移动「' + escapeHtml(isFolder ? entry.name : (entry.title || '无标题')) + '」到：</label>'
                + '<select id="favMoveTarget" style="width:100%;padding:10px 12px;background:#0d0d0d;border:1px solid #3a3a3a;border-radius:6px;color:#e6e6e6;font-size:13px;outline:none;">'

        function doFavMove(id, isFolder) {

        // 核心移动逻辑（拖拽与菜单共用）
        function moveFavEntry(id, isFolder, targetFolderId) {
            if (isFolder) {
                if (id === targetFolderId) return;
                if (isDescendantOf(targetFolderId, id)) { showToast('不能移动到自身或其子文件夹内', 'error'); return; }
                const folder = favoritesData.folders.find(function(f) { return f.id === id; });
                if (!folder) return;
                if ((folder.parentId || null) === (targetFolderId || null)) return;
                const subtreeHeight = getFavSubtreeHeight(id);
                const targetDepth = getFavFolderDepth(targetFolderId);
                if (targetDepth + 1 + (subtreeHeight - 1) > 3) { showToast('移动后将超过三级文件夹限制', 'error'); return; }
                folder.parentId = targetFolderId || null;
                favStamp(folder);
            } else {
                const item = favoritesData.items.find(function(i) { return i.id === id; });
                if (!item) return;
                if ((item.folderId || null) === (targetFolderId || null)) return;
                item.folderId = targetFolderId || null;
                favStamp(item);
            }
            if (saveFavorites()) {
                renderFavorites();
                showToast('已移动到「' + getFavFolderName(targetFolderId) + '」', 'success');
            }
        }

            hideFavContextMenu();
            const item = favoritesData.items.find(function(i) { return i.id === id; });

            htmlEditor.value = item.content || '';
            updatePreview();
            updateHighlight();
            updateCharCount();
            closeFavoritesPage();
            showToast('已加载收藏「' + (item.title || '无标题') + '」', 'success');

        /* ---------- GitHub 云同步（多设备收藏夹同步） ---------- */
        const FAV_SYNC_STORAGE_KEY = 'htmlEditorFavSyncConfig';
        var favSyncConfig = { owner: '', repo: '', token: '', branch: 'main', path: 'favorites.json', deviceName: '', lastSyncAt: null, lastSyncAction: '' };

        function favDefaultDeviceName() {
            const ua = navigator.userAgent;
            if (/iPad/.test(ua)) return 'iPad';
            if (/iPhone/.test(ua)) return 'iPhone';
            if (/Android/.test(ua)) return 'Android设备';
            if (/Macintosh/.test(ua)) return 'Mac';
            if (/Windows/.test(ua)) return 'Windows设备';
            return '我的设备';
        }

        function loadFavSyncConfig() {
            try {
                const stored = localStorage.getItem(FAV_SYNC_STORAGE_KEY);
                if (stored) {
                    const data = JSON.parse(stored);
                    favSyncConfig = {
                        owner: data.owner || '',
                        repo: data.repo || '',
                        token: data.token || '',
                        branch: data.branch || 'main',
                        path: data.path || 'favorites.json',
                        deviceName: data.deviceName || favDefaultDeviceName(),
                        lastSyncAt: data.lastSyncAt || null,
                        lastSyncAction: data.lastSyncAction || ''
                    };
                    return;
                }
            } catch (error) {}
            favSyncConfig = { owner: '', repo: '', token: '', branch: 'main', path: 'favorites.json', deviceName: favDefaultDeviceName(), lastSyncAt: null, lastSyncAction: '' };
        }

        function saveFavSyncConfigToStorage() {
            try {
                localStorage.setItem(FAV_SYNC_STORAGE_KEY, JSON.stringify(favSyncConfig));
                return true;
            } catch (error) {
                showToast('云同步配置保存失败', 'error');
                return false;
            }
        }

        function isFavSyncConfigured() {
            return !!(favSyncConfig.owner.trim() && favSyncConfig.repo.trim() && favSyncConfig.token.trim());
        }

        function favSyncApiBase() {
            return 'https://api.github.com/repos/' + encodeURIComponent(favSyncConfig.owner.trim()) + '/' + encodeURIComponent(favSyncConfig.repo.trim());
        }

        function favSyncBranchName() {
            return favSyncConfig.branch.trim() || 'main';
        }

        function favSyncNormalizedPath() {
            return (favSyncConfig.path || 'favorites.json').trim().replace(/^\/+/, '') || 'favorites.json';
        }

        function favSyncEncodedPath() {
            return favSyncNormalizedPath().split('/').map(encodeURIComponent).join('/');
        }

        function favSyncHeaders() {
            return { 'Authorization': 'Bearer ' + favSyncConfig.token.trim() };
        }

        // UTF-8 安全的 Base64（收藏内容含中文，且可能较大，分块处理）
        function favB64Encode(str) {
            const bytes = new TextEncoder().encode(str);
            let bin = '';
            const chunk = 0x8000;
            for (let i = 0; i < bytes.length; i += chunk) {
                bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
            }
            return btoa(bin);
        }

        function favB64Decode(b64) {
            const bin = atob(String(b64).replace(/\s/g, ''));
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return new TextDecoder('utf-8').decode(bytes);
        }

        function favSyncTimeStr(iso) {
            try { return new Date(iso).toLocaleString('zh-CN'); } catch (e) { return String(iso || ''); }
        }

        function favParseFavJson(text) {
            try {
                const d = JSON.parse(text);
                return (d && (Array.isArray(d.folders) || Array.isArray(d.items))) ? d : null;
            } catch (e) { return null; }
        }

        // 统一请求：404/409/422 返回状态对象，401/403/网络错误抛错
        async function favGhRequest(url, options) {
            let res;
            try {
                res = await fetch(url, options);
            } catch (e) {
                throw new Error('网络请求失败，请检查网络连接');
            }
            if (res.status === 401) throw new Error('访问令牌无效或已过期（401），请到设置中更新');
            if (res.status === 403) {
                const body = await res.json().catch(function() { return {}; });
                const msg = body && body.message ? body.message : '';
                if (/1 ?MB|too large/i.test(msg)) return { status: 403, ok: false, tooLarge: true };
                throw new Error('无权限访问（403），请检查令牌对该仓库的 Contents 读写权限');
            }
            if (res.status === 404) return { status: 404, ok: false };
            if (res.status === 409 || res.status === 422) return { status: res.status, ok: false, conflict: true };
            if (!res.ok) throw new Error('GitHub 请求失败（HTTP ' + res.status + '）');
            return { status: res.status, ok: true, res: res };
        }

        // 读取云端收藏：{exists:false} 或 {exists:true, text, sha}
        async function favCloudGet() {
            const headers = favSyncHeaders();
            const branch = favSyncBranchName();
            const fileUrl = favSyncApiBase() + '/contents/' + favSyncEncodedPath() + '?ref=' + encodeURIComponent(branch);
            const r = await favGhRequest(fileUrl, { headers: headers });
            if (r.status === 404) return { exists: false };
            if (r.tooLarge) {
                // 超过 1MB：raw 读取内容 + 递归树查询 blob sha
                const rawRes = await fetch(fileUrl, { headers: Object.assign({}, headers, { 'Accept': 'application/vnd.github.raw' }) });
                if (!rawRes.ok) throw new Error('读取云端大文件失败（HTTP ' + rawRes.status + '）');
                const text = await rawRes.text();
                const treeRes = await fetch(favSyncApiBase() + '/git/trees/' + encodeURIComponent(branch) + '?recursive=1', { headers: headers });
                if (!treeRes.ok) throw new Error('无法获取云端文件版本信息（HTTP ' + treeRes.status + '）');
                const tree = await treeRes.json();
                const entry = (tree.tree || []).find(function(t) { return t.path === favSyncNormalizedPath(); });
                if (!entry) throw new Error('无法定位云端文件，请稍后重试');
                return { exists: true, text: text, sha: entry.sha };
            }
            const info = await r.res.json();
            return { exists: true, text: favB64Decode(info.content || ''), sha: info.sha };
        }

        async function favCloudPut(jsonStr, sha) {
            const headers = Object.assign({}, favSyncHeaders(), { 'Content-Type': 'application/json' });
            const body = {
                message: '📁 更新收藏夹与提示词（' + favSyncConfig.deviceName + '）',
                content: favB64Encode(jsonStr),
                branch: favSyncBranchName()
            };
            if (sha) body.sha = sha;
            return favGhRequest(favSyncApiBase() + '/contents/' + favSyncEncodedPath(), {
                method: 'PUT', headers: headers, body: JSON.stringify(body)
            });
        }

        function favSyncEnsureConfigured() {
            if (isFavSyncConfigured()) return true;
            showConfirmDialog('尚未配置云同步。\n是否现在打开同步设置？', function() {
                toggleSettingsPanel();
            });
            return false;
        }

        function saveFavSyncRecord(action) {
            favSyncConfig.lastSyncAt = new Date().toISOString();
            favSyncConfig.lastSyncAction = action;
            saveFavSyncConfigToStorage();
        }

        // 上传前先把云端内容合并到本地（双方内容都保留），再统一上传 → 云端始终是多设备内容的并集
        async function favCloudUpload() {
            if (!favSyncEnsureConfigured()) return;
            closeModal();
            showToast('正在上传到云端…', 'success');
            try {
                const remote = await favCloudGet();
                let sha = null;
                let merged = null;
                if (remote.exists) {
                    sha = remote.sha;
                    const remoteData = favParseFavJson(remote.text);
                    if (remoteData) {
                        merged = favMergeData(remoteData);
                        favApplyMergeResult(merged);
                    }
                }
                await favDoUpload(sha, merged);
            } catch (e) {
                showToast('上传失败：' + e.message, 'error');
            }
        }

        async function favDoUpload(sha, merged) {
            try {
                let r = await favCloudPut(favBuildCloudPayload(), sha);
                if (r.conflict && sha) {
                    // 云端刚被其他设备更新：重新拉取、再合并一次后重传
                    const remote = await favCloudGet();
                    if (remote.exists) {
                        const remoteData = favParseFavJson(remote.text);
                        if (remoteData) {
                            merged = favMergeData(remoteData);
                            favApplyMergeResult(merged);
                        }
                        sha = remote.sha;
                    } else {
                        sha = null;
                    }
                    r = await favCloudPut(favBuildCloudPayload(), sha);
                }
                if (r.status === 404) throw new Error('仓库或分支不存在，请检查设置（部分仓库默认分支为 master）');
                if (r.conflict) throw new Error('云端数据刚被其他设备更新，请稍后重试');
                if (!r.ok) throw new Error('HTTP ' + r.status);
                saveFavSyncRecord('上传');
                let msg = '已上传到云端（' + favSyncConfig.repo + '/' + favSyncNormalizedPath() + '）';
                const s = (merged && merged.stats) || null;
                if (s && (s.itemsFromRemote || s.itemsUpdated || s.foldersFromRemote || s.foldersUpdated)) {
                    msg += '，已合并云端收藏：' + (s.itemsFromRemote + s.itemsUpdated) + ' 个收藏 · ' + (s.foldersFromRemote + s.foldersUpdated) + ' 个文件夹';
                }
                if (s && (s.promptsFromRemote || s.promptsUpdated)) {
                    msg += (msg.indexOf('合并') > -1 ? '' : '，已合并') + '云端提示词：' + (s.promptsFromRemote + s.promptsUpdated) + ' 条';
                }
                showToast(msg, 'success');
            } catch (e) {
                showToast('上传失败：' + e.message, 'error');
            }
        }

        // 拉取 = 云端与本地按 ID 合并：云端新增/较新的进入本地，本地独有的保留，删除墓碑生效
        async function favCloudPull() {
            if (!favSyncEnsureConfigured()) return;
            closeModal();
            showToast('正在从云端拉取…', 'success');
            try {
                const remote = await favCloudGet();
                if (!remote.exists) {
                    showToast('云端暂无收藏数据，请先在另一台设备上传', 'error');
                    return;
                }
                const remoteData = favParseFavJson(remote.text);
                if (!remoteData) {
                    showToast('云端文件不是有效的收藏数据', 'error');
                    return;
                }
                const result = favMergeData(remoteData);
                favApplyMergeResult(result);
                saveFavSyncRecord('拉取');
                const s = result.stats;
                const parts = [];
                if (s.itemsFromRemote) parts.push('新增 ' + s.itemsFromRemote + ' 个收藏');
                if (s.foldersFromRemote) parts.push('新增 ' + s.foldersFromRemote + ' 个文件夹');
                if (s.itemsUpdated) parts.push('更新 ' + s.itemsUpdated + ' 个收藏');
                if (s.foldersUpdated) parts.push('更新 ' + s.foldersUpdated + ' 个文件夹');
                if (s.foldersMerged) parts.push('合并 ' + s.foldersMerged + ' 个同名文件夹');
                if (s.promptsFromRemote) parts.push('新增 ' + s.promptsFromRemote + ' 条提示词');
                if (s.promptsUpdated) parts.push('更新 ' + s.promptsUpdated + ' 条提示词');
                if (s.deletesApplied) parts.push('应用 ' + s.deletesApplied + ' 条删除');
                if (s.promptDeletesApplied) parts.push('应用 ' + s.promptDeletesApplied + ' 条提示词删除');
                showToast('已从云端拉取合并：' + (parts.length ? parts.join(' · ') : '云端没有本地缺少的新内容'), 'success');
            } catch (e) {
                showToast('拉取失败：' + e.message, 'error');
            }
        }

        // 云端明细列表：按设备汇总数量 + 按更新时间倒序显示每条收藏/提示词来自哪台设备
        function favRenderCloudList(d) {
            const wrap = document.getElementById('favSyncCloudList');
            if (!wrap) return;
            const items = (d && Array.isArray(d.items)) ? d.items.slice() : [];
            const folders = (d && Array.isArray(d.folders)) ? d.folders : [];
            const prompts = (d && Array.isArray(d.prompts)) ? d.prompts.slice() : [];
            if (!items.length && !folders.length && !prompts.length) {
                wrap.innerHTML = '<div style="color:#888;font-size:12px;">云端暂无收藏内容</div>';
                return;
            }
            const fallbackDev = (d && d.updatedBy) || '未知设备';
            const all = [];
            items.forEach(function(it) { all.push({ type: '收藏', title: it.title || '无标题', dev: it.updatedBy || fallbackDev, ts: favEffectiveTs(it) }); });
            prompts.forEach(function(p) { all.push({ type: '提示词', title: p.title || '未命名', dev: p.updatedBy || fallbackDev, ts: promptEffectiveTs(p) }); });
            all.sort(function(a, b) { return new Date(b.ts) - new Date(a.ts); });
            const byDevice = {};
            all.forEach(function(x) { byDevice[x.dev] = (byDevice[x.dev] || 0) + 1; });
            const devChips = Object.keys(byDevice).sort(function(a, b) { return byDevice[b] - byDevice[a]; }).map(function(dev) {
                return '<span style="display:inline-block;background:#243447;border-radius:10px;padding:2px 10px;font-size:11px;color:#9ecbff;white-space:nowrap;">💻 ' + escapeHtml(dev) + ' · ' + byDevice[dev] + '</span>';
            }).join(' ');

            const rows = all.slice(0, 50).map(function(x) {
                return '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:5px 0;border-bottom:1px dashed #2a2a2a;">'

                    + '</div>';
            }).join('');
            const more = all.length > 50 ? '<div style="color:#666;font-size:11px;padding-top:6px;">… 仅显示最近 50 条（云端共 ' + items.length + ' 条收藏 · ' + folders.length + ' 个文件夹 · ' + prompts.length + ' 条提示词）</div>' : '';
            wrap.innerHTML = (devChips ? '<div style="margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px;">' + devChips + '</div>' : '') + rows + more;
        }

        /* ---------- 配置文件导入 / 收藏夹导出与导入 ---------- */

        // 解析配置文本：支持 ①MD 内 ```json 代码块 ②纯 JSON ③MD 配置表格
        function favParseConfigText(text) {
            const s = String(text || '');
            const block = s.match(/```json\s*([\s\S]*?)```/i);
            if (block) {
                try {
                    const j = JSON.parse(block[1]);
                    if (j && (j.owner || j.repo || j.token)) return j;
                } catch (e) {}
            }
            try {
                const j2 = JSON.parse(s);
                if (j2 && (j2.owner || j2.repo || j2.token)) return j2;
            } catch (e) {}
            const labels = {
                'github 用户名': 'owner', '用户名': 'owner', 'owner': 'owner',
                '仓库名': 'repo', '仓库': 'repo', 'repo': 'repo',
                '分支': 'branch', 'branch': 'branch',
                '文件路径': 'path', '路径': 'path', 'path': 'path',
                '设备名称': 'deviceName', '设备名': 'deviceName', 'devicename': 'deviceName',
                '访问令牌': 'token', '令牌': 'token', 'token': 'token'
            };
            const cfg = {};
            s.split('\n').forEach(function(line) {
                const mm = line.match(/^\s*\|\s*([^|]+?)\s*\|\s*([^|]*?)\s*\|?\s*$/);
                if (!mm) return;
                const key = labels[mm[1].toLowerCase()];
                if (key && !cfg[key]) cfg[key] = mm[2].replace(/`/g, '').trim();
            });
            if (cfg.owner || cfg.repo || cfg.token) return cfg;
            return null;
        }

                if (cfg.branch) favSyncConfig.branch = String(cfg.branch).trim() || 'main';
                if (cfg.path) favSyncConfig.path = String(cfg.path).trim() || 'favorites.json';
                if (cfg.deviceName) favSyncConfig.deviceName = String(cfg.deviceName).trim();
                if (cfg.token) favSyncConfig.token = String(cfg.token).trim();
                // 文件里若是通用设备名（如「iPad」），换设备导入时自动改为本机名称
                const defaultNames = ['iPad', 'iPhone', 'Android设备', 'Mac', 'Windows设备', '我的设备'];

        function favExportData() {
            if (!favoritesData.folders.length && !favoritesData.items.length) {
                showToast('收藏夹为空，没有可导出的内容', 'error');
                return;
            }
            const payload = {
                version: 2,
                app: 'my-html-editor',
                exportedAt: new Date().toISOString(),
                folders: favoritesData.folders,
                items: favoritesData.items,
                deleted: Array.isArray(favoritesData.deleted) ? favoritesData.deleted : []
            };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const d = new Date();
            const pad = function(n) { return (n < 10 ? '0' : '') + n; };
            a.download = 'favorites-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '.json';
            a.href = url;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
            showToast('已导出 ' + favoritesData.folders.length + ' 个文件夹 · ' + favoritesData.items.length + ' 个收藏', 'success');
        }

        function handleFavImport(inputEl) {
            const file = inputEl && inputEl.files && inputEl.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function() {
                const data = favParseFavJson(reader.result);
                if (!data) {
                    showToast('文件格式无效：请选择「📤 导出」生成的 JSON 备份文件', 'error');
                    return;
                }
                const inFolders = Array.isArray(data.folders) ? data.folders : [];
                const inItems = Array.isArray(data.items) ? data.items : [];
                if (!inFolders.length && !inItems.length) {
                    showToast('文件中没有可导入的内容', 'error');
                    return;
                }
                const s = favMergeData(data).stats;
                const changed = s.itemsFromRemote + s.foldersFromRemote + s.itemsUpdated + s.foldersUpdated + s.foldersMerged + s.deletesApplied;
                if (!changed) {
                    showToast('文件中的收藏均已存在，无需导入', 'success');
                    return;
                }
                const lines = [];
                if (s.itemsFromRemote) lines.push('· 新增 ' + s.itemsFromRemote + ' 个收藏');
                if (s.foldersFromRemote) lines.push('· 新增 ' + s.foldersFromRemote + ' 个文件夹');
                if (s.itemsUpdated) lines.push('· 更新 ' + s.itemsUpdated + ' 个收藏');
                if (s.foldersUpdated) lines.push('· 更新 ' + s.foldersUpdated + ' 个文件夹');
                if (s.foldersMerged) lines.push('· 合并 ' + s.foldersMerged + ' 个同名文件夹');
                if (s.deletesApplied) lines.push('· 应用 ' + s.deletesApplied + ' 条删除记录');
                showConfirmDialog(
                    '合并导入预览：\n' + lines.join('\n') + '\n\n（合并模式：保留双方内容，不会误删本地收藏）',
                    function() {
                        favApplyMergeResult(favMergeData(data));
                        showToast('导入完成', 'success');
                    }
                );
            };
            reader.readAsText(file);
        }

        /* ---------- 提示词模板（云同步并入收藏夹同一份数据文件） ---------- */
        const PROMPTS_STORAGE_KEY = 'htmlEditorPrompts';
        const FAV_TAB_STORAGE_KEY = 'htmlEditorFavActiveTab';
        var promptsData = { items: [], deleted: [] };
        var promptEditingId = null;
        var favActiveTab = 'fav';

        function loadPrompts() {
            try {
                const raw = localStorage.getItem(PROMPTS_STORAGE_KEY);
                if (raw) {
                    const d = JSON.parse(raw);
                    if (d && Array.isArray(d.items)) {
                        promptsData = { items: d.items, deleted: Array.isArray(d.deleted) ? d.deleted : [] };
                    }
                }
            } catch (e) { }
        }

        function savePrompts() {
            try {
                localStorage.setItem(PROMPTS_STORAGE_KEY, JSON.stringify(promptsData));
            } catch (e) {
                showToast('保存失败：本地存储空间不足', 'error');
            }
        }

        function promptEffectiveTs(p) {
            return (p && (p.updatedAt || p.createdAt)) || '1970-01-01T00:00:00Z';
        }

        function promptDeviceName() {
            return (typeof favSyncConfig !== 'undefined' && favSyncConfig && favSyncConfig.deviceName) ? favSyncConfig.deviceName : '';
        }

        // 收藏夹页面标签页切换：收藏夹 / 提示词

            favActiveTab = (tab === 'prompt') ? 'prompt' : 'fav';
            try { localStorage.setItem(FAV_TAB_STORAGE_KEY, favActiveTab); } catch (e) { }

            const tabPrompt = document.getElementById('favTabPromptBtn');
            if (tabFav) tabFav.classList.toggle('active', !isPrompt);

            show('favViewsort', !isPrompt);
            show('favNavRow', !isPrompt);
            show('favActionsRow', !isPrompt);
            show('promptActionsRow', isPrompt);
            show('favGrid', !isPrompt);
            show('favList', !isPrompt);
            show('promptList', isPrompt);
            hideFavContextMenu();
            if (isPrompt) renderPrompts();
            else renderFavorites();
        }

        // 兼容入口：AI 文档菜单「提示词」→ 打开收藏夹页面并切到提示词标签
        function openPromptsPage() {
            openFavoritesPage();

        function renderPrompts() {
            const list = document.getElementById('promptList');
            if (!list) return;
            if (!Array.isArray(promptsData.items)) promptsData.items = [];
            const items = promptsData.items.slice().sort(function(a, b) {
                return new Date(promptEffectiveTs(b)) - new Date(promptEffectiveTs(a));
            });
            if (!items.length) {
                list.innerHTML = '<div class="prompt-empty">💬 还没有提示词<br><span>点击「➕ 新建提示词」或「📋 从剪贴板新建」添加一条</span></div>';
            } else {
                let html = '';
                items.forEach(function(p) {
                    const preview = (p.content || '').replace(/\s+/g, ' ').trim().slice(0, 120);
                    html += '<div class="prompt-row" onclick="showPromptEditor(\'' + p.id + '\')">'
                        + '<div class="prompt-row-top">'
                        + '<div class="prompt-row-title">' + escapeHtml(p.title || '未命名') + '</div>'
                        + '<button class="prompt-copy-btn" onclick="event.stopPropagation();copyPromptToClipboard(\'' + p.id + '\')" title="复制到剪贴板">📋 复制</button>'
                        + '<button class="prompt-more-btn" onclick="event.stopPropagation();showPromptMenuAtButton(event, \'' + p.id + '\')" title="更多操作">⋯</button>'
                        + '</div>'
                        + (preview ? '<div class="prompt-row-preview">' + escapeHtml(preview) + '</div>' : '')
                        + '<div class="prompt-row-meta"><span>' + formatRelativeTime(promptEffectiveTs(p)) + '</span><span>' + (p.content || '').length + ' 字符</span></div>'
                        + '</div>';
                });
                list.innerHTML = html;
            }
            if (favActiveTab === 'prompt') {
                const bar = document.getElementById('favStatusbar');
                if (bar) bar.textContent = '共 ' + promptsData.items.length + ' 条提示词';
            }
        }

        function showPromptEditor(id, prefillContent) {
            const p = id ? promptsData.items.find(function(x) { return x.id === id; }) : null;
            promptEditingId = id || null;
            const html = '<div style="display:flex;flex-direction:column;gap:12px;">'
                + '<input type="text" id="promptTitleInput" placeholder="提示词标题（例如：几何模型识别）"'
                + ' style="padding:10px 14px;background:#0d0d0d;border:1px solid #3a3a3a;border-radius:6px;color:#e6e6e6;font-size:14px;outline:none;">'
                + '<textarea id="promptContentInput" rows="10" placeholder="提示词内容，支持多行文本"'
                + ' style="padding:10px 14px;background:#0d0d0d;border:1px solid #3a3a3a;border-radius:6px;color:#e6e6e6;font-size:13px;line-height:1.6;outline:none;resize:vertical;font-family:inherit;"></textarea>'
                + '<div style="display:flex;gap:8px;justify-content:flex-end;">'
                + '<button class="btn btn-secondary" onclick="closeModal()">取消</button>'
                + '<button class="btn btn-primary" onclick="savePromptFromEditor()">保存</button>'
                + '</div></div>';
            showModal(p ? '编辑提示词' : '新建提示词', html);
            setTimeout(function() {
                const t = document.getElementById('promptTitleInput');
                const c = document.getElementById('promptContentInput');
                if (t) t.value = p ? (p.title || '') : '';
                if (c) c.value = p ? (p.content || '') : (prefillContent || '');
                if (t && !p) t.focus();
            }, 50);
        }

        function savePromptFromEditor() {
            const t = document.getElementById('promptTitleInput');
            const c = document.getElementById('promptContentInput');
            if (!t || !c) return;
            const title = t.value.trim();
            const content = c.value;
            if (!title) { showToast('标题不能为空', 'error'); return; }
            if (!content.trim()) { showToast('内容不能为空', 'error'); return; }
            const now = new Date().toISOString();
            const dev = promptDeviceName();
            if (promptEditingId) {
                const p = promptsData.items.find(function(x) { return x.id === promptEditingId; });
                if (p) { p.title = title; p.content = content; p.updatedAt = now; if (dev) p.updatedBy = dev; }
            } else {
                const np = {
                    id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
                    title: title,
                    content: content,
                    createdAt: now,
                    updatedAt: now
                };
                if (dev) np.updatedBy = dev;
                promptsData.items.push(np);
            }
            savePrompts();
            closeModal();
            renderPrompts();
            showToast(promptEditingId ? '提示词已更新' : '提示词已保存', 'success');
            promptEditingId = null;
        }

        function copyPromptToClipboard(id) {
            const p = promptsData.items.find(function(x) { return x.id === id; });
            if (!p || !(p.content || '').trim()) { showToast('该提示词内容为空', 'error'); return; }
            const text = p.content;
            const label = p.title || '未命名';
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function() {
                    showToast('已复制「' + label + '」', 'success');
                }).catch(function() { fallbackCopyText(text, label); });
            } else {
                fallbackCopyText(text, label);
            }
        }

        function fallbackCopyText(text, label) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0.01;z-index:-1;';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            ta.setSelectionRange(0, text.length);
            try {
                document.execCommand('copy');
                showToast('已复制「' + label + '」', 'success');
            } catch (e) {
                showToast('复制失败，请点开提示词后手动复制', 'error');
            }
            document.body.removeChild(ta);
        }

        function showPromptMenuAtButton(event, id) {
            const menu = document.getElementById('favContextMenu');
            if (!menu) return;
            menu.innerHTML = '<div class="fav-menu-item" onclick="copyPromptToClipboard(\'' + id + '\')">📋 复制</div>'
                + '<div class="fav-menu-item" onclick="showPromptEditor(\'' + id + '\')">✏️ 编辑</div>'
                + '<div class="fav-menu-item fav-menu-danger" onclick="deletePrompt(\'' + id + '\')">🗑️ 删除</div>';
            menu.style.display = 'block';
            const rect = event.currentTarget.getBoundingClientRect();
            const menuW = menu.offsetWidth || 150;
            const menuH = menu.offsetHeight || 120;
            let mx = Math.max(8, rect.right - menuW), my = rect.bottom + 4;
            if (mx + menuW > window.innerWidth - 8) mx = Math.max(8, window.innerWidth - menuW - 8);
            if (my + menuH > window.innerHeight - 8) my = Math.max(8, rect.top - menuH - 4);
            menu.style.left = mx + 'px';
            menu.style.top = my + 'px';
        }

        function deletePrompt(id) {
            const p = promptsData.items.find(function(x) { return x.id === id; });
            if (!p) return;
            showConfirmDialog('确定删除提示词「' + (p.title || '未命名') + '」吗？', function() {
                const now = new Date().toISOString();
                promptsData.items = promptsData.items.filter(function(x) { return x.id !== id; });
                if (!Array.isArray(promptsData.deleted)) promptsData.deleted = [];
                promptsData.deleted = promptsData.deleted.filter(function(d) { return d.id !== id; });
                promptsData.deleted.push({ id: id, deletedAt: now });
                savePrompts();
                renderPrompts();
                showToast('已删除（同步后其他设备也会删除）', 'success');
            });
        }

        // 提示词与远端按 ID 合并：并集 + 较新优先 + 删除墓碑（与收藏夹同一套逻辑）
        function favMergePrompts(remoteItems, remoteDeleted) {
            const rItems = Array.isArray(remoteItems) ? remoteItems : [];
            const rDeleted = Array.isArray(remoteDeleted) ? remoteDeleted : [];
            const stats = { promptsFromRemote: 0, promptsUpdated: 0, promptsLocalOnly: 0, promptDeletesApplied: 0 };

            const tomb = {};
            (Array.isArray(promptsData.deleted) ? promptsData.deleted : []).concat(rDeleted).forEach(function(d) {
                if (!d || !d.id) return;
                const t = d.deletedAt || '';
                if (!tomb[d.id] || new Date(t) > new Date(tomb[d.id])) tomb[d.id] = t;
            });
            const cutoff = Date.now() - 90 * 24 * 3600 * 1000;
            Object.keys(tomb).forEach(function(id) {
                if (!tomb[id] || new Date(tomb[id]).getTime() < cutoff) delete tomb[id];
            });

            const map = {};
            promptsData.items.forEach(function(p) { map[p.id] = p; });
            const remoteIds = {};
            rItems.forEach(function(rp) {
                if (!rp || !rp.id) return;
                remoteIds[rp.id] = true;
                const lp = map[rp.id];
                if (!lp) { map[rp.id] = rp; stats.promptsFromRemote++; }
                else if (new Date(promptEffectiveTs(rp)) > new Date(promptEffectiveTs(lp))) { map[rp.id] = rp; stats.promptsUpdated++; }
            });
            promptsData.items.forEach(function(p) { if (!remoteIds[p.id]) stats.promptsLocalOnly++; });

            const items = [];
            Object.keys(map).forEach(function(id) {
                const p = map[id];
                const t = tomb[id];
                if (t && new Date(t) > new Date(promptEffectiveTs(p))) {
                    stats.promptDeletesApplied++;
                } else {
                    if (t) delete tomb[id];
                    items.push(p);
                }
            });
            const deleted = Object.keys(tomb).map(function(id) { return { id: id, deletedAt: tomb[id] }; });
            return { items: items, deleted: deleted, stats: stats };
        }

        async function newPromptFromClipboard() {
            let prefill = '';
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    prefill = (await navigator.clipboard.readText()) || '';
                }
            } catch (e) { }
            if (prefill.trim()) {
                showPromptEditor(null, prefill);
                showToast('已读取剪贴板，补充标题后保存', 'success');
            } else {
                showPromptEditor(null, '');
                showToast('无法读取剪贴板，请在内容框中手动粘贴', 'error');
            }
        }

        function exportPrompts() {
            if (!promptsData.items.length) {
                showToast('还没有提示词可导出', 'error');
                return;
            }
            const payload = {
                version: 2,
                app: 'my-html-editor',
                type: 'prompts',
                exportedAt: new Date().toISOString(),
                items: promptsData.items,
                deleted: Array.isArray(promptsData.deleted) ? promptsData.deleted : []
            };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const d = new Date();
            const pad = function(n) { return (n < 10 ? '0' : '') + n; };
            a.download = 'prompts-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '.json';
            a.href = url;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
            showToast('已导出 ' + promptsData.items.length + ' 条提示词', 'success');
        }

        function importPromptsClick() {
            const input = document.getElementById('promptImportFile');
            if (!input) return;
            input.value = '';
            input.click();
        }

        function handlePromptsImport(inputEl) {
            const file = inputEl && inputEl.files && inputEl.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function() {
                let data = null;
                try { data = JSON.parse(reader.result); } catch (e) { }
                const inItems = data && Array.isArray(data.items)
                    ? data.items.filter(function(x) { return x && typeof x.content === 'string'; }) : [];
                if (!inItems.length) {
                    showToast('文件格式无效：请选择「📤 导出」生成的提示词备份文件', 'error');
                    return;
                }
                const before = promptsData.items.length;
                const merged = favMergePrompts(inItems, Array.isArray(data.deleted) ? data.deleted : []);
                promptsData.items = merged.items;
                promptsData.deleted = merged.deleted;
                savePrompts();
                renderPrompts();
                const added = merged.stats.promptsFromRemote;
                const updated = merged.stats.promptsUpdated;
                const deletes = merged.stats.promptDeletesApplied;
                showToast('导入完成：新增 ' + added + ' 条' + (updated ? '，更新 ' + updated + ' 条' : '') + (deletes ? '，应用 ' + deletes + ' 条删除' : '') + '（原 ' + before + ' 条）', 'success');
            };
            reader.readAsText(file);
        }

        loadPrompts();

        loadFavSyncConfig();

        // ESC 关闭收藏夹页面（modal 打开时优先交给 modal 处理）
        document.addEventListener('keydown', function(e) {
            if (e.key !== 'Escape') return;
            const modalOverlay = document.getElementById('modalOverlay');
            if (modalOverlay && modalOverlay.classList.contains('show')) return;
            const page = document.getElementById('favoritesPage');
            if (page && page.style.display === 'flex') closeFavoritesPage();
        });
    </script>
