            try {
                const stored = localStorage.getItem(HISTORY_STORAGE_KEY);
                if (stored) {
                    historyRecords = JSON.parse(stored);
                }
            } catch (error) {
                // 静默处理历史记录加载错误，避免控制台污染
                historyRecords = [];
            }
        }
        
        // 保存历史记录到localStorage
        function saveHistory() {
            try {
                localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(historyRecords));
            } catch (error) {
                if (historyRecords.length > 10) {
                    try {
                        historyRecords = historyRecords.slice(0, Math.floor(historyRecords.length / 2));
                        localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(historyRecords));
                    } catch (e) {
                        historyRecords = historyRecords.slice(0, 5);
                        try { localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(historyRecords)); } catch(e2) {}
                    }
                }
            }
        }
        
        // 添加当前代码到历史记录
        function extractTitleFromCode(code) {
            const titleMatch = code.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
            if (titleMatch && titleMatch[1].trim()) {
                return titleMatch[1].trim();
            }
            const h1Match = code.match(/<h[1-3][^>]*>([\s\S]*?)<\/h[1-3]>/i);
            if (h1Match && h1Match[1].trim()) {
                const temp = document.createElement('div');
                temp.innerHTML = h1Match[1].trim();
                return temp.textContent.trim().substring(0, 50);
            }
            return '无标题';
        }

        function formatRelativeTime(timestamp) {
            const now = Date.now();
            const diff = now - new Date(timestamp).getTime();
            const seconds = Math.floor(diff / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);

            if (seconds < 60) return '刚刚';
            if (minutes < 60) return minutes + '分钟前';
            if (hours < 24) return hours + '小时前';
            if (days < 7) return days + '天前';
            return new Date(timestamp).toLocaleString('zh-CN');
        }

        function formatCodeSize(code) {
            const bytes = new Blob([code]).size;
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function addToHistory() {
            const code = htmlEditor.value.trim();
            if (!code) return;

            const recentDuplicate = historyRecords.slice(0, 3).find(r => r.content === code);
            if (recentDuplicate) return;

            const record = {
                id: Date.now(),
                content: code,
                title: extractTitleFromCode(code),
                timestamp: new Date().toISOString(),
                preview: code.substring(0, 100) + (code.length > 100 ? '...' : ''),
                size: formatCodeSize(code)
            };

            historyRecords.unshift(record);

            if (historyRecords.length > MAX_HISTORY_RECORDS) {
                historyRecords = historyRecords.slice(0, MAX_HISTORY_RECORDS);
            }

            saveHistory();
        }
        
        // 页面加载时尝试恢复保存的内容
        window.addEventListener('load', function() {
            try {
                // 加载设置
                loadSettings();
                
                // 首先检查是否有分享链接参数
                loadFromShareUrl();
                
                // 如果没有分享内容，再从localStorage加载
                if (!htmlEditor.value.trim()) {
                    loadFromLocalStorage();
                }
                
                setTimeout(autoPasteOnLoad, 500);
                
                loadHistory();
                
                // iOS设备特殊处理
                if (isIOS()) {
                    // 延迟初始化确保iOS完全加载
                    setTimeout(function() {
                        htmlEditor.focus();
                        htmlEditor.blur();
                    }, 500);
                    
                    console.log('检测到iOS设备，已应用兼容性优化');
                }
                
                console.log('HTML编辑器已加载，历史记录功能已初始化');
                console.log('当前历史记录数量:', historyRecords.length);
                console.log('分享基础URL:', shareBaseUrl || '使用当前页面URL');
            } catch (error) {
                handleIOSError('页面加载', error);
            }
        });
        
        htmlEditor.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'h') {
                e.preventDefault();
                toggleHistoryPanel();
            }
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'S') {
                e.preventDefault();
                toggleSharePanelModal();
            }
        });
        
        // 切换分享面板显示/隐藏 - 改为使用弹出窗口
        function toggleSharePanel() {
            // 直接调用弹窗版本的分享面板
            toggleSharePanelModal();
        }
        
        // 从URL参数加载分享内容
        async function loadFromShareUrl() {
            try {
                var content = null;
                var isHashShare = false;
                var hash = window.location.hash;
                if (hash && hash.length > 1) {
                    var hashData = hash.substring(1);
                    if (hashData.startsWith('lz:') || hashData.startsWith('b64:')) {
                        await loadLzString();
                        content = decompressFromUrl(hashData);
                        isHashShare = true;
                    }
                }
                if (!content) {
                    var url = new URL(window.location.href);
                    var encodedContent = url.searchParams.get(SHARE_PARAM_NAME);
                    if (encodedContent) {
                        try {
                            content = decodeURIComponent(atob(encodedContent));
                        } catch(e) {
                            showToast('分享链接内容解码失败', 'error');
                        }
                    }
                }
                if (content) {
                    if (isHashShare) {
                        document.open();
                        document.write(content);
                        document.close();
                        return;
                    }
                    htmlEditor.value = content;
                    updatePreview();
                    updateCharCount();
                    showToast('已加载分享内容', 'success');
                    if (window.history && window.history.replaceState) {
                        window.history.replaceState(null, '', window.location.pathname);
                    }
                }
            } catch (error) {
                if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                    console.error('从分享链接加载内容失败:', error);
                }
                showToast('分享链接无效或已损坏', 'error');
            }
        }
        
        // 切换设置面板显示/隐藏 - 改为弹出窗口模式
        function loadSettings() {
            try {
                const stored = localStorage.getItem(SETTINGS_STORAGE_KEY);
                if (stored) {
                    const settings = JSON.parse(stored);
                    
                    if (settings.shareBaseUrl) {
                        shareBaseUrl = settings.shareBaseUrl;
                    }
                    
                    if (settings.autoSaveInterval) {
                        autoSaveInterval = settings.autoSaveInterval;
                    }
                    
                    if (settings.maxHistoryRecords) {
                        MAX_HISTORY_RECORDS = settings.maxHistoryRecords;
                    }
                    
                    if (settings.pdfPageSize) {
                        pdfPageSize = settings.pdfPageSize;
                    }
                    
                    if (settings.pdfOrientation) {
                        pdfOrientation = settings.pdfOrientation;
                    }
                    
                    if (settings.pdfMargin !== undefined) {
                        pdfMargin = settings.pdfMargin;
                    }
                    
                    if (settings.docxExportConfig) {
                        Object.assign(DOCX_EXPORT_CONFIG, settings.docxExportConfig);
                    }
                }
            } catch (error) {
                if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                    console.error('加载设置失败:', error);
                }
            }
        }
        
        // 保存设置到localStorage
        function saveSettings(settings) {
            try {
                const currentSettings = JSON.parse(localStorage.getItem(SETTINGS_STORAGE_KEY) || '{}');
                const updatedSettings = { ...currentSettings, ...settings };
                localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(updatedSettings));
                showToast('设置已保存', 'success');
                return true;
            } catch (error) {
                // 只在开发模式下显示设置保存错误
                if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                    console.error('保存设置失败:', error);
                }
                showToast('保存设置失败', 'error');
                return false;
            }
        }
        
        function saveModalPdfPageSize() {

        function saveModalPdfOrientation() {

        function saveModalPdfMargin() {
            const input = document.getElementById('modalPdfMargin');
            if (!input) return;

                showToast('请输入0-50之间的数值', 'error');

        function saveModalDocxOrientation() {

        function saveModalDocxFontName() {

        function saveModalDocxFontSize() {
            const select = document.getElementById('modalDocxFontSize');
            if (!select) return;
            DOCX_EXPORT_CONFIG.fontSize = parseInt(select.value);
            saveSettings({ docxExportConfig: DOCX_EXPORT_CONFIG });
        }
        
        
        // iOS Safari/Edge 兼容性：增强触摸事件处理
        if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
            // 为所有按钮添加触摸事件支持
            [clearBtn, pasteBtn, downloadBtn, fullscreenBtn, printBtn, openBtn].forEach(function(btn) {
                btn.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    this.style.opacity = '0.7';
                    this.style.transform = 'scale(0.98)';
                });
                
                btn.addEventListener('touchend', function(e) {
                    this.style.opacity = '';
                    this.style.transform = '';
                    
                    if (this.id === 'pasteBtn') {
                        e.preventDefault();
                        pasteFromClipboard();
                    } else {
                        e.preventDefault();
                        setTimeout(() => {
                            if (this.id === 'clearBtn') {
                                clearEditor();
                            } else if (this.id === 'downloadBtn') {
                                exportToPdf();
                            } else if (this.id === 'fullscreenBtn') {
                                toggleFullscreenPreview();
                            } else if (this.id === 'printBtn') {
                                printPreview();
                            } else if (this.id === 'openBtn') {
                                openLocalFile();
                            }
                        }, 50);
                    }
                });
                
                btn.addEventListener('touchcancel', function(e) {
                    this.style.opacity = '';
                    this.style.transform = '';
                });
            });
            
            // 防止双击缩放
            document.addEventListener('touchstart', function(e) {
                if (e.touches.length > 1) {
                    e.preventDefault();
                }
            }, { passive: false });
            
            // 防止页面缩放
            document.addEventListener('gesturestart', function(e) {
                e.preventDefault();
            });
        }

        var highlightLayer=document.getElementById('highlightLayer');
        var editToggleBtn=document.getElementById('editToggleBtn');
        var isEditMode=false;
        var isSyncing=false;
        var previewSyncTimer=null;
        var syncObserver=null;
        var previousEditorHtml='';
        var modifiedRange=null;
        var ZWSP='\u200B';
        var STRUCT_TAGS=['SUP','SUB'];
        var STRUCT_CLASSES=['fraction','num','den','sqrt','sqrt-content'];

        function highlightHTML(html){
            var result='';
            var i=0;
            var len=html.length;
            while(i<len){
                if(html[i]==='<'&&html.substr(i,4)==='<!--'){
                    var end=html.indexOf('-->',i);
                    if(end===-1)end=len;else end+=3;
                    result+='<span class="token-comment">'+escapeHtmlTokens(html.substring(i,end))+'</span>';
                    i=end;
                }else if(html[i]==='<'&&html.substr(i,9)==='<!DOCTYPE'){
                    var end=html.indexOf('>',i);
                    if(end===-1)end=len;else end++;
                    result+='<span class="token-doctype">'+escapeHtmlTokens(html.substring(i,end))+'</span>';
                    i=end;
                }else if(html[i]==='<'){
                    var end=html.indexOf('>',i);
                    if(end===-1)end=len;else end++;
                    result+=highlightTag(html.substring(i,end));
                    i=end;
                }else{
                    var end=html.indexOf('<',i);
                    if(end===-1)end=len;
                    var text=html.substring(i,end);
                    if(text.trim()){
                        result+='<span class="token-text">'+escapeHtmlTokens(text)+'</span>';
                    }else{
                        result+=escapeHtmlTokens(text);
                    }
                    i=end;
                }
            }
            return result;
        }

        function escapeHtmlTokens(text){
            return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function highlightTag(tag){
            var result='<span class="token-tag">&lt;';
            var m=tag.match(/^<(\/?)([a-zA-Z0-9_\-]+)/);
            if(m){
                result+=m[1]+m[2];
                var rest=tag.substring(m[0].length);
                rest=rest.replace(/\s([a-zA-Z0-9_\-]+)(?:\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+)))?/g,function(match,name,double,single,unquoted){
                    var attr=' <span class="token-attr">'+name+'</span>';
                    var val=double||single||unquoted;
                    if(val!==undefined){
                        attr+='=<span class="token-string">'+(double?'"'+double+'"':single?"'"+single+"'":val)+'</span>';
                    }
                    return attr;
                });
                result+=rest.replace(/>/g,'&gt;');
            }else{
                result+=escapeHtmlTokens(tag.substring(1));
            }
            return result+'</span>';
        }

        function updateHighlight(){
            highlightLayer.innerHTML=highlightHTML(htmlEditor.value);
            syncHighlightScroll();
        }

        function syncHighlightScroll(){
            highlightLayer.scrollTop=htmlEditor.scrollTop;
            highlightLayer.scrollLeft=htmlEditor.scrollLeft;
        }

        function findDiff(oldStr,newStr){
            var oldLines=oldStr.split('\n');
            var newLines=newStr.split('\n');
            var start=-1,end=-1;
            for(var i=0;i<Math.min(oldLines.length,newLines.length);i++){
                if(oldLines[i]!==newLines[i]){
                    if(start===-1)start=i;
                    end=i;
                }
            }
            if(start===-1){
                if(newLines.length>oldLines.length){
                    start=oldLines.length;
                    end=newLines.length-1;
                }
            }else if(newLines.length>oldLines.length){
                end=newLines.length-1;
            }
            if(start!==-1)return{start:start,end:end};
            return null;
        }

        function scrollToModifiedLine(lineNum){
            var lineHeight=1.6*14;
            htmlEditor.scrollTop=lineNum*lineHeight-(htmlEditor.clientHeight/2);
            syncHighlightScroll();
        }

        function highlightModifiedRange(range){
            if(!range)return;
            updateHighlight();
            var lines=htmlEditor.value.split('\n');
            var newHtml='';
            for(var i=0;i<lines.length;i++){
                if(i>=range.start&&i<=range.end){
                    newHtml+='<span class="highlight-modified">'+highlightHTML(lines[i])+'</span>';
                }else{
                    newHtml+=highlightHTML(lines[i]);
                }
                if(i<lines.length-1)newHtml+='\n';
            }
            highlightLayer.innerHTML=newHtml;
        }

        function isStructElement(el){
            if(!el)return false;
            if(STRUCT_TAGS.indexOf(el.tagName)!==-1)return true;
            if(el.classList){
                for(var i=0;i<STRUCT_CLASSES.length;i++){
                    if(el.classList.contains(STRUCT_CLASSES[i]))return true;
                }
            }
            return false;
        }

        function protectStructure(doc){
            var sups=doc.querySelectorAll('sup, sub');
            sups.forEach(function(el){
                var text=el.textContent;
                if(text.length===0||text===ZWSP)el.textContent=ZWSP;
            });
            var fracs=doc.querySelectorAll('.fraction .num, .fraction .den');
            fracs.forEach(function(el){
                var text=el.textContent;
                if(text.length===0||text===ZWSP)el.textContent=ZWSP;
            });
        }

        function setupMutationGuard(doc){
            var observer=new MutationObserver(function(mutations){
                mutations.forEach(function(m){
                    if(m.type==='childList'){
                        m.removedNodes.forEach(function(node){
                            if(node.nodeType===1&&isStructElement(node)){
                                var parent=m.target;
                                if(parent&&parent.nodeType===1){
                                    var restored=node.cloneNode(true);
                                    if(restored.textContent.length===0)restored.textContent=ZWSP;
                                    if(m.nextSibling)parent.insertBefore(restored,m.nextSibling);
                                    else parent.appendChild(restored);
                                }
                            }
                        });
                    }
                    if(m.type==='characterData'){
                        var parent=m.target.parentElement;
                        if(parent&&isStructElement(parent)){
                            if(parent.textContent.length===0)parent.textContent=ZWSP;
                        }
                    }
                });
            });
            observer.observe(doc.body,{childList:true,subtree:true,characterData:true});
            return observer;
        }

        function setupBeforeInputGuard(doc){
            doc.addEventListener('beforeinput',function(e){
                var sel=doc.getSelection();
                if(!sel||sel.rangeCount===0)return;
                var range=sel.getRangeAt(0);
                var container=range.commonAncestorContainer;
                var el=container.nodeType===3?container.parentElement:container;
                while(el&&el!==doc.body){
                    if(isStructElement(el)){
                        if(e.inputType==='deleteContentBackward'||e.inputType==='deleteContentForward'||e.inputType==='deleteContent'){
                            var text=el.textContent;
                            if(text.length<=1||(text.length===1&&text===ZWSP)){
                                e.preventDefault();
                                el.textContent=ZWSP;
                                sel.collapse(el,0);
                                sel.modify('move','forward','character');
                                return;
                            }
                        }
                        break;
                    }
                    el=el.parentElement;
                }
            },true);
        }

        function toggleEditMode(){
            isEditMode=!isEditMode;
            var previewLabel=document.getElementById('previewLabel');
            if(isEditMode){
                editToggleBtn.textContent='编辑';
                editToggleBtn.classList.add('active');
                if(previewLabel)previewLabel.textContent='编辑';
            }else{
                editToggleBtn.textContent='编辑';
                editToggleBtn.classList.remove('active');
                if(previewLabel)previewLabel.textContent='预览';
            }
            applyEditMode();
        }

        function applyEditMode(){
            try{
                var doc=previewFrame.contentDocument||previewFrame.contentWindow.document;
                if(!doc||!doc.body)return;
                if(isEditMode){
                    doc.body.contentEditable=true;
                    doc.body.style.outline='none';
                    doc.body.style.cursor='text';
                    doc.body.style.userSelect='text';
                    var allEls=doc.body.querySelectorAll('*');
                    for(var i=0;i<allEls.length;i++){
                        allEls[i].contentEditable='inherit';
                    }
                    setupBeforeInputGuard(doc);
                    if(syncObserver)syncObserver.disconnect();
                    syncObserver=setupMutationGuard(doc);
                    bindPreviewSyncEvents();
                }else{
                    doc.body.contentEditable=false;
                    doc.body.style.cursor='default';
                    doc.body.style.userSelect='default';
                    if(syncObserver){
                        syncObserver.disconnect();
                        syncObserver=null;
                    }
                    bindPreviewSyncEvents();
                    var allEls=doc.body.querySelectorAll('*');
                    for(var i=0;i<allEls.length;i++){
                        allEls[i].contentEditable='false';
                    }
                }
            }catch(e){}
        }

        function updateEditorFromPreview(){
            if(isSyncing||!isEditMode)return;
            isSyncing=true;
            try{
                var doc=previewFrame.contentDocument||previewFrame.contentWindow.document;
                protectStructure(doc);
                var editedHtml=doc.documentElement.outerHTML;
                var cleaned=editedHtml.replace(/\u200B/g,'');
                var currentCleaned=htmlEditor.value.replace(/\u200B/g,'');
                if(cleaned&&cleaned!==currentCleaned){
                    var oldHtml=htmlEditor.value;
                    var fullHtml='<!DOCTYPE html>\n'+editedHtml;
                    htmlEditor.value=fullHtml;
                    var diffRange=findDiff(oldHtml,fullHtml);
                    if(diffRange){
                        scrollToModifiedLine(diffRange.start);
                        highlightModifiedRange(diffRange);
                        setTimeout(function(){
                            if(modifiedRange){updateHighlight();modifiedRange=null;}
                        },2000);
                        modifiedRange=diffRange;
                    }else{
                        updateHighlight();
                    }
                    updateCharCount();
                    clearTimeout(autoSaveTimeout);
                    autoSaveTimeout=setTimeout(function(){
                        localStorage.setItem('htmlEditorContent',htmlEditor.value);
                        if(htmlEditor.value.trim()&&htmlEditor.value!==lastContent){
                            addToHistory();
                            lastContent=htmlEditor.value;
                        }
                    },2000);
                }
            }catch(e){}
            setTimeout(function(){isSyncing=false;},150);
        }

        function bindPreviewSyncEvents(){
            try{
                var doc=previewFrame.contentDocument||previewFrame.contentWindow.document;
                var body=doc.body;
                body.removeEventListener('input',onPreviewSyncInput);
                body.removeEventListener('blur',onPreviewSyncBlur);
                if(isEditMode){
                    body.addEventListener('input',onPreviewSyncInput);
                    body.addEventListener('blur',onPreviewSyncBlur);
                }
            }catch(e){}
        }

        function onPreviewSyncInput(e){
            if(!isEditMode)return;
            clearTimeout(previewSyncTimer);
            previewSyncTimer=setTimeout(function(){updateEditorFromPreview();},300);
        }

        function onPreviewSyncBlur(e){
            if(!isEditMode)return;
            clearTimeout(previewSyncTimer);
            updateEditorFromPreview();
        }

        htmlEditor.addEventListener('scroll',syncHighlightScroll);
    </script>
