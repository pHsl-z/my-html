<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HTML → DOCX 方案对比测试</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        :root{--bg:#0f0f0f;--surface:#1a1a1a;--surface2:#242424;--border:#333;--text:#e6e6e6;--text2:#999;--accent:#2b5797;--accent2:#4a9eff;--success:#28a745;--error:#dc3545;--warning:#e67e22;--radius:10px;--docx:#2b5797;}
        html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;}
        .app{display:flex;flex-direction:column;height:100vh;height:100dvh;}
        .header{padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0;}
        .header h1{font-size:15px;font-weight:600;color:var(--accent);white-space:nowrap;}
        .header .badge{font-size:11px;background:var(--docx);color:#fff;padding:2px 8px;border-radius:10px;white-space:nowrap;}
        .main{flex:1;display:flex;overflow:hidden;min-height:0;}
        .editor-panel{width:50%;display:flex;flex-direction:column;border-right:1px solid var(--border);min-width:0;}
        .preview-panel{width:50%;display:flex;flex-direction:column;min-width:0;}
        .panel-header{padding:6px 12px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:12px;font-weight:500;color:var(--text2);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
        .panel-header .label{color:var(--text);font-weight:600;}
        #htmlEditor{flex:1;width:100%;background:#111;color:#d4d4d4;border:none;padding:12px;font-family:"SF Mono","Fira Code",Menlo,Monaco,monospace;font-size:12px;line-height:1.5;resize:none;outline:none;tab-size:2;}
        #previewFrame{flex:1;width:100%;border:none;background:#fff;}
        .templates-bar{padding:6px 12px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;}
        .templates-bar h3{font-size:10px;color:var(--text2);margin-bottom:4px;}
        .templates-scroll{display:flex;gap:4px;overflow-x:auto;padding-bottom:3px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
        .tpl-btn{flex-shrink:0;padding:4px 8px;border:1px solid var(--border);border-radius:5px;background:var(--surface2);color:var(--text);font-size:10px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:3px;}
        .tpl-btn:hover{border-color:var(--accent2);}
        .tpl-btn.active{border-color:var(--accent2);background:rgba(74,158,255,.15);color:var(--accent2);}
        .methods-bar{padding:8px 12px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;}
        .methods-bar h3{font-size:10px;color:var(--text2);margin-bottom:6px;}
        .methods-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;}
        .method-card{border:1px solid var(--border);border-radius:8px;background:var(--surface2);overflow:hidden;transition:border-color .2s;}
        .method-card:hover{border-color:var(--accent2);}
        .method-card.ready{border-color:rgba(40,167,69,.4);}
        .method-card.missing{border-color:rgba(230,126,34,.4);}
        .method-card.selected{outline:2px solid var(--accent2);outline-offset:-2px;}
        .method-info{padding:5px 8px 3px;cursor:pointer;display:flex;align-items:center;gap:4px;}
        .method-info .num{display:inline-flex;width:16px;height:16px;border-radius:50%;background:var(--accent2);color:#fff;font-size:8px;align-items:center;justify-content:center;flex-shrink:0;}
        .method-card.ready .num{background:var(--success);}
        .method-card.missing .num{background:var(--warning);}
        .method-info .mname{font-size:10px;font-weight:600;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
        .method-info .mstatus{font-size:8px;color:var(--text2);flex-shrink:0;}
        .method-actions{display:flex;gap:3px;padding:0 8px 5px;}
        .method-export-btn{flex:1;padding:4px 0;border:1px solid var(--accent2);border-radius:5px;background:var(--accent2);color:#fff;font-size:10px;font-weight:600;cursor:pointer;text-align:center;transition:all .2s;}
        .method-export-btn:hover{background:#3d8bfd;transform:scale(1.02);}
        .method-export-btn:active{transform:scale(0.98);}
        .method-export-btn.loading{background:var(--warning);border-color:var(--warning);cursor:wait;}
        .method-detail-btn{padding:4px 8px;border:1px solid var(--border);border-radius:5px;background:transparent;color:var(--text2);font-size:9px;cursor:pointer;flex-shrink:0;}
        .method-detail-btn:hover{border-color:var(--accent2);color:var(--accent2);}
        .bottom-panel{background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;max-height:200px;overflow-y:auto;}
        .panel-tabs{display:flex;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1;}
        .panel-tab{padding:6px 14px;font-size:11px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;}
        .panel-tab:hover{color:var(--text);}
        .panel-tab.active{color:var(--accent2);border-bottom-color:var(--accent2);}
        .panel-content{padding:8px 12px;font-size:11px;line-height:1.6;}
        .lib-card{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:var(--surface2);}
        .lib-card .lib-icon{font-size:20px;}
        .lib-card .lib-info{flex:1;min-width:0;}
        .lib-card .lib-name{font-weight:600;color:var(--text);font-size:12px;}
        .lib-card .lib-desc{font-size:10px;color:var(--text2);margin-top:1px;}
        .lib-card .lib-size{font-size:10px;color:var(--warning);font-weight:500;}
        .lib-card .lib-status{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500;}
        .lib-card .lib-status.loaded{background:rgba(40,167,69,.15);color:var(--success);}
        .lib-card .lib-status.unloaded{background:rgba(231,76,60,.15);color:var(--error);}
        .lib-load-btn{padding:4px 12px;border:1px solid var(--accent2);border-radius:5px;background:transparent;color:var(--accent2);font-size:10px;cursor:pointer;white-space:nowrap;}
        .lib-load-btn:hover{background:var(--accent2);color:#fff;}
        .load-all-btn{padding:6px 16px;border:1px solid var(--accent2);border-radius:8px;background:var(--accent2);color:#fff;font-size:11px;cursor:pointer;font-weight:500;}
        .load-all-btn:hover{background:#3d8bfd;}
        .status-bar{padding:4px 12px;background:var(--surface2);border-top:1px solid var(--border);font-size:10px;color:var(--text2);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
        .status-bar .status-dot{width:5px;height:5px;border-radius:50%;background:var(--success);display:inline-block;margin-right:5px;}
        .toast-container{position:fixed;top:16px;right:16px;z-index:10000;display:flex;flex-direction:column;gap:8px;}
        .toast{padding:10px 16px;border-radius:var(--radius);font-size:13px;color:#fff;animation:toastIn .3s ease;max-width:360px;word-break:break-word;}
        .toast.info{background:var(--accent2);}
        .toast.success{background:var(--success);}
        .toast.error{background:var(--error);}
        .toast.warning{background:var(--warning);}
        @keyframes toastIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
        .compare-table{width:100%;border-collapse:collapse;font-size:10px;margin-top:8px;}
        .compare-table th{background:var(--surface2);color:var(--accent2);padding:6px 8px;border:1px solid var(--border);text-align:center;font-weight:600;white-space:nowrap;}
        .compare-table td{padding:5px 8px;border:1px solid var(--border);text-align:center;color:var(--text2);}
        .compare-table td:first-child{text-align:left;color:var(--text);font-weight:500;}
        .compare-table .good{color:var(--success);font-weight:600;}
        .compare-table .bad{color:var(--error);font-weight:600;}
        .compare-table .mid{color:var(--warning);font-weight:600;}
        .config-section{margin-top:8px;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);}
        .config-section h4{font-size:11px;color:var(--accent2);margin-bottom:6px;}
        .config-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:10px;}
        .config-row label{width:60px;color:var(--text2);flex-shrink:0;}
        .config-row select,.config-row input{flex:1;padding:3px 6px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:4px;font-size:10px;}
        @media(max-width:768px){.main{flex-direction:column;}.editor-panel,.preview-panel{width:100%;height:50%;}.editor-panel{border-right:none;border-bottom:1px solid var(--border);}.methods-grid{grid-template-columns:repeat(2,1fr);}}
    </style>
</head>
<body>
<div class="app">
    <div class="header"><h1>HTML → DOCX 方案对比测试</h1><span class="badge">8方案·6库·14模板</span></div>
    <div class="main">
        <div class="editor-panel">
            <div class="panel-header"><span class="label">HTML 编辑器</span><span id="charCount" style="font-size:10px;">0 字符</span></div>
            <textarea id="htmlEditor" spellcheck="false"></textarea>
            <div class="templates-bar"><h3>📋 预制模板：</h3><div class="templates-scroll" id="templatesScroll"></div></div>
        </div>
        <div class="preview-panel">
            <div class="panel-header"><span class="label">实时预览</span><span id="currentTpl" style="font-size:10px;color:var(--accent2);"></span></div>
            <iframe id="previewFrame"></iframe>
            <div class="methods-bar"><h3>🔧 导出方案（🟢=库已加载 🟡=需加载库，点击「导出」自动加载并导出）：</h3><div class="methods-grid" id="methodsGrid"></div></div>
        </div>
    </div>
    <div class="bottom-panel">
        <div class="panel-tabs">
            <div class="panel-tab active" data-tab="libs" onclick="switchTab('libs')">📦 库管理</div>
            <div class="panel-tab" data-tab="method" onclick="switchTab('method')">ℹ️ 方案详情</div>
            <div class="panel-tab" data-tab="compare" onclick="switchTab('compare')">📊 方案对比</div>
            <div class="panel-tab" data-tab="config" onclick="switchTab('config')">⚙️ 导出配置</div>
            <div class="panel-tab" data-tab="github" onclick="switchTab('github')">🔗 GitHub 源</div>
        </div>
        <div class="panel-content" id="panelContent"></div>
    </div>
    <div class="status-bar"><span><span class="status-dot"></span>就绪</span><span id="statusText">选择模板 → 预览 → 点击导出</span></div>
</div>
<div class="toast-container" id="toastContainer"></div>

SAMPLES.legal='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>律师函</title><style>body{font-family:"SimSun",serif;padding:50px 60px;max-width:800px;margin:0 auto;color:#000;line-height:2;}.header{text-align:center;margin-bottom:40px;}.header h1{font-size:26px;letter-spacing:6px;}.header .firm{font-size:14px;border-top:2px solid #000;border-bottom:1px solid #000;padding:8px 0;margin-top:10px;}.title{text-align:center;font-size:20px;font-weight:bold;margin-bottom:30px;letter-spacing:4px;}.content{text-indent:2em;margin-bottom:15px;font-size:15px;}.highlight{font-weight:bold;text-decoration:underline;}.stamp{display:inline-block;border:3px solid #c00;color:#c00;padding:5px 15px;border-radius:50%;font-size:14px;font-weight:bold;transform:rotate(-15deg);margin-left:10px;opacity:0.7;}.page-break{page-break-after:always;margin:30px 0;border-bottom:1px dashed #ccc;}</style></head><body><div class="header"><h1>律 师 函</h1><div class="firm">XX律师事务所</div></div><div class="title">关于要求支付工程款的律师函</div><div class="content">XX建设集团有限公司：</div><div class="content">XX律师事务所接受XX工程有限公司（以下简称"委托人"）的委托，指派本所律师就贵司拖欠委托人工程款一事，特致函如下：</div><div class="content"><strong>一、基本事实</strong></div><div class="content">委托人与贵司于2024年3月15日签订了《建设工程施工合同》（合同编号：<span class="highlight">GZ-2025-0315</span>），约定由委托人承建贵司开发的"XX商业广场"项目。合同总价人民币<span class="highlight">叁佰伍拾万元整</span>（¥3,500,000.00）。</div><div class="content">委托人已按照合同约定完成了全部施工内容，工程已于2025年8月20日通过竣工验收，并取得竣工验收备案证书。截至本函发出之日，贵司已支付工程款人民币贰佰壹拾万元整（¥2,100,000.00），尚欠工程款人民币<span class="highlight">壹佰肆拾万元整</span>（¥1,400,000.00）。</div><div class="content"><strong>二、法律依据</strong></div><div class="content">根据《中华人民共和国民法典》第八百零七条规定："发包人未按照约定支付价款的，承包人可以催告发包人在合理期限内支付价款。发包人逾期不支付的，除根据建设工程的性质不宜折价、拍卖外，承包人可以与发包人协议将该工程折价，也可以请求人民法院将该工程依法拍卖。建设工程的价款就该工程折价或者拍卖的价款优先受偿。"</div><div class="content">根据《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第二十七条规定，当事人对欠付工程价款利息计付标准有约定的，按照约定处理；没有约定的，按照同期同类贷款市场报价利率计息。</div><div class="page-break"></div><div class="content"><strong>三、律师意见</strong></div><div class="content">本律师认为，委托人与贵司签订的《建设工程施工合同》合法有效，双方均应严格履行。委托人已按约完成施工义务，贵司应当按约支付工程款。贵司拖欠工程款的行为已构成违约，依法应承担违约责任。</div><div class="content"><strong>四、律师要求</strong></div><div class="content">鉴于上述事实和法律依据，本律师代表委托人向贵司提出如下要求：</div><div class="content">1. 请于收到本函之日起<span class="highlight">十五个工作日</span>内支付剩余工程款人民币壹佰肆拾万元整（¥1,400,000.00）；</div><div class="content">2. 请同时支付自2025年9月1日起至实际付清之日止的逾期付款利息（按同期贷款市场报价利率计算）；</div><div class="content">3. 如贵司在上述期限内仍未履行付款义务，委托人将依法向人民法院提起诉讼，届时贵司将承担诉讼费、律师费等全部诉讼费用。</div><div class="content"><strong>五、特别提示</strong></div><div class="content">本函所陈述的事实均有相关证据予以佐证。委托人对本函所述内容的真实性负责。如贵司对本函内容有异议，请在收到本函后五日内书面回复，逾期未回复的，视为认可本函所述事实。</div><div class="content">望贵司慎重对待，以免讼累。</div><div style="text-align:right;margin-top:40px;"><div>XX律师事务所<span class="stamp">律师函</span></div><div>承办律师：张XX、李XX</div><div>联系电话：010-8888XXXX</div><div>2026年4月28日</div></div></body></html>';

SAMPLES.contract='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>房屋租赁合同</title><style>body{font-family:"SimSun",serif;padding:40px 50px;max-width:800px;margin:0 auto;color:#000;line-height:2;font-size:14px;}.title{text-align:center;font-size:22px;font-weight:bold;margin-bottom:30px;letter-spacing:6px;}.blank{display:inline-block;border-bottom:1px solid #333;min-width:120px;margin:0 5px;}.sign-line{border-bottom:1px solid #333;display:inline-block;width:150px;margin-left:5px;}.clause{margin-bottom:12px;text-indent:2em;}.page-break{page-break-after:always;border-bottom:1px dashed #ccc;padding-bottom:20px;margin-bottom:20px;}</style></head><body><div class="title">房屋租赁合同</div><p style="text-align:center;font-size:13px;color:#666;">合同编号：ZL-2026-00158</p><p><strong>出租方（甲方）：</strong><span class="blank">XX物业管理有限公司</span></p><p><strong>承租方（乙方）：</strong><span class="blank">XX科技有限公司</span></p><p style="margin-top:15px;">根据《中华人民共和国民法典》及相关法律法规的规定，甲乙双方在平等、自愿、协商一致的基础上，就房屋租赁事宜达成如下协议：</p><p><strong>第一条 房屋基本情况</strong></p><div class="clause">甲方将坐落于<span class="blank">北京市朝阳区XX路88号XX大厦12层</span>的房屋出租给乙方使用。房屋建筑面积为<span class="blank">500</span>平方米，房屋用途为<span class="blank">办公</span>。</div><p><strong>第二条 租赁期限</strong></p><div class="clause">租赁期限自<span class="blank">2026年1月1日</span>至<span class="blank">2028年12月31日</span>，共计三年。租赁期满，乙方如需续租，应在租赁期满前三个月书面通知甲方，在同等条件下乙方有优先承租权。</div><p><strong>第三条 租金及支付方式</strong></p><div class="clause">月租金人民币<span class="blank">叁万贰仟元整</span>（¥32,000.00），按季度支付，每季度首月5日前支付当季租金。甲方收到租金后应向乙方出具合法有效的收款凭证。</div><p><strong>第四条 押金</strong></p><div class="clause">乙方应于本合同签订之日起三日内向甲方支付押金人民币<span class="blank">陆万肆仟元整</span>（¥64,000.00），相当于两个月租金。租赁期满，如乙方无违约行为，甲方应在合同终止后十五日内无息退还押金。</div><div class="page-break"></div><p><strong>第五条 房屋维护与修缮</strong></p><div class="clause">甲方应保证房屋建筑结构安全，负责房屋主体结构的维修保养。乙方应合理使用房屋及其附属设施，如因乙方使用不当造成损坏，乙方应负责修复或赔偿。</div><p><strong>第六条 合同变更与解除</strong></p><div class="clause">1. 经甲乙双方协商一致，可以变更或解除本合同。<br>2. 乙方有下列情形之一的，甲方有权解除合同：（1）逾期支付租金超过30日的；（2）擅自将房屋转租的；（3）利用房屋从事违法活动的。<br>3. 甲方有下列情形之一的，乙方有权解除合同：（1）未按约定交付房屋超过15日的；（2）交付的房屋不符合约定用途的。</div><p><strong>第七条 违约责任</strong></p><div class="clause">1. 乙方逾期支付租金的，每逾期一日，应按逾期金额的万分之五向甲方支付违约金。<br>2. 甲方未按约定交付房屋的，每逾期一日，应按月租金的万分之五向乙方支付违约金。<br>3. 任何一方提前解除合同的，应提前三十日书面通知对方，并向对方支付相当于两个月租金的违约金。</div><p><strong>第八条 争议解决</strong></p><div class="clause">本合同在履行过程中发生的争议，由双方协商解决；协商不成的，依法向房屋所在地人民法院起诉。</div><p><strong>第九条 其他约定</strong></p><div class="clause">1. 本合同未尽事宜，由双方另行协商签订补充协议，补充协议与本合同具有同等法律效力。<br>2. 本合同一式两份，甲乙双方各执一份，自双方签字盖章之日起生效。</div><div style="margin-top:50px;display:flex;justify-content:space-between;"><div>甲方（盖章）：<span class="sign-line"></span><br>法定代表人：<span class="sign-line"></span><br>日期：2026年1月1日</div><div>乙方（盖章）：<span class="sign-line"></span><br>法定代表人：<span class="sign-line"></span><br>日期：2026年1月1日</div></div></body></html>';
SAMPLES.exam='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>期末考试试卷</title><style>body{font-family:"SimSun",serif;padding:30px 40px;max-width:800px;margin:0 auto;color:#000;line-height:1.8;}.exam-header{text-align:center;margin-bottom:20px;}.exam-header h1{font-size:20px;letter-spacing:4px;}.student-info{display:flex;justify-content:space-between;border:1px solid #000;padding:8px 15px;margin-bottom:20px;font-size:13px;}.student-info .line{display:inline-block;width:80px;border-bottom:1px solid #000;}.score-table{width:100%;border-collapse:collapse;margin-bottom:20px;text-align:center;font-size:13px;}.score-table th,.score-table td{border:1px solid #000;padding:6px 10px;}.score-table th{background:#f0f0f0;}.section-title{font-size:15px;font-weight:bold;margin:20px 0 10px;border-bottom:2px solid #000;}.question{margin-bottom:15px;font-size:14px;}.answer-space{height:80px;border-bottom:1px dashed #ccc;margin:10px 0;}.page-break{page-break-after:always;border-bottom:1px dashed #ccc;padding-bottom:15px;margin-bottom:15px;}</style></head><body><div class="exam-header"><h1>2025-2026学年度第二学期期末考试</h1><div style="font-size:13px;color:#666;">高二英语 | 120分钟 | 满分150分</div></div><div class="student-info"><span>姓名：<span class="line"></span></span><span>班级：<span class="line"></span></span><span>学号：<span class="line"></span></span><span>考场：<span class="line"></span></span></div><table class="score-table"><tr><th>题型</th><th>听力</th><th>阅读</th><th>完形</th><th>语法</th><th>写作</th><th>总分</th></tr><tr><th>满分</th><td>30</td><td>40</td><td>15</td><td>35</td><td>30</td><td>150</td></tr><tr><th>得分</th><td></td><td></td><td></td><td></td><td></td><td></td></tr></table><div class="section-title">第一部分 听力（共两节，满分30分）</div><div class="question"><strong>第一节</strong>（共5小题；每小题1.5分，满分7.5分）<br>听下面5段对话。每段对话后有一个小题，从题中所给的A、B、C三个选项中选出最佳选项。<br>1. What does the woman want to do?<br>A. Watch a movie. &nbsp; B. Go shopping. &nbsp; C. Visit a museum.</div><div class="question">2. How much will the man pay for the tickets?<br>A. $15. &nbsp; B. $30. &nbsp; C. $45.</div><div class="question">3. Where are the speakers?<br>A. In a restaurant. &nbsp; B. In a library. &nbsp; C. In a bookstore.</div><div class="question">4. What is the weather like now?<br>A. Sunny. &nbsp; B. Rainy. &nbsp; C. Cloudy.</div><div class="question">5. When will the meeting start?<br>A. At 9:00. &nbsp; B. At 9:30. &nbsp; C. At 10:00.</div><div class="section-title">第二部分 阅读理解（共两节，满分40分）</div><div class="question"><strong>第一节</strong>（共15小题；每小题2分，满分30分）<br><strong>A</strong><br>Artificial intelligence (AI) has become one of the most transformative technologies of the 21st century. From self-driving cars to virtual assistants, AI is reshaping how we live and work. However, the rapid development of AI also raises important ethical questions.<br>21. What is the main concern about AI according to the passage?<br>A. Its cost &nbsp; B. Its ethical implications &nbsp; C. Its speed &nbsp; D. Its complexity</div><div class="question">22. According to the passage, which of the following is NOT an application of AI?<br>A. Self-driving cars &nbsp; B. Virtual assistants &nbsp; C. Manual labor &nbsp; D. Image recognition</div><div class="question">23. The author suggests that AI development should be accompanied by ___.<br>A. more funding &nbsp; B. ethical guidelines &nbsp; C. faster computers &nbsp; D. fewer regulations</div><div class="page-break"></div><div class="question"><strong>B</strong><br>The concept of sustainable development has gained significant attention in recent years. It refers to meeting the needs of the present without compromising the ability of future generations to meet their own needs. This principle applies to economic, social, and environmental dimensions.<br>24. What does "sustainable development" mean according to the passage?<br>A. Rapid economic growth &nbsp; B. Meeting current needs without harming future generations<br>C. Reducing industrial production &nbsp; D. Increasing natural resource consumption</div><div class="question">25. Which dimension is NOT mentioned in the passage?<br>A. Economic &nbsp; B. Social &nbsp; C. Cultural &nbsp; D. Environmental</div><div class="section-title">第三部分 完形填空（共15小题；每小题1分，满分15分）</div><div class="question">阅读下面短文，从短文后各题所给的A、B、C、D四个选项中，选出可以填入空白处的最佳选项。<br>The Internet has ___26___ the way we communicate, learn, and do business. Before the Internet, people had to ___27___ letters and wait days for a reply. Today, we can send an email and get a ___28___ within seconds. However, this convenience comes with ___29___. Cybercrime, privacy issues, and information overload are just some of the ___30___ we face in the digital age.<br>26. A. changed &nbsp; B. kept &nbsp; C. followed &nbsp; D. stopped<br>27. A. read &nbsp; B. write &nbsp; C. buy &nbsp; D. burn<br>28. A. question &nbsp; B. problem &nbsp; C. response &nbsp; D. letter<br>29. A. advantages &nbsp; B. challenges &nbsp; C. improvements &nbsp; D. suggestions<br>30. A. benefits &nbsp; B. opportunities &nbsp; C. problems &nbsp; D. solutions</div><div class="section-title">第四部分 语法填空（共10小题；每小题1.5分，满分15分）</div><div class="question">阅读下面材料，在空白处填入适当的内容（1个单词）或括号内单词的正确形式。<br>The Great Wall of China ___31___ (build) over many centuries. It ___32___ (be) one of the greatest wonders of the world. Every year, millions of ___33___ (tour) visit it. If you ___34___ (visit) the Great Wall, you will be amazed by its ___35___ (beautiful). It ___36___ (actual) stretches over 21,000 kilometers across northern China. The wall was originally built ___37___ (protect) the Chinese Empire from invasions. Today, it ___38___ (regard) as a symbol of Chinese civilization and ___39___ (it) long history. In 1987, it ___40___ (list) as a World Heritage Site by UNESCO.</div><div class="section-title">第五部分 书面表达（满分30分）</div><div class="question">假定你是李华，你的英国笔友Tom来信询问你校的课外活动情况。请给他回信，内容包括：<br>1. 介绍你校的主要课外活动；<br>2. 你参加的课外活动及收获；<br>3. 询问对方学校的课外活动情况。<br>注意：词数100左右。</div><div class="answer-space"></div><div class="answer-space"></div><div class="answer-space"></div><div style="text-align:center;margin-top:30px;font-size:12px;color:#999;">— 第2页 共2页 —</div></body></html>';

on-item .value{font-size:18px;font-weight:bold;color:#ee5a24;}.nutrition-item .label{font-size:10px;color:#999;margin-top:2px;}.page-break{page-break-after:always;border-bottom:1px dashed #ddd;padding-bottom:20px;margin-bottom:20px;}.pairing-section{margin-top:15px;padding:12px;background:#f8f9fa;border-radius:8px;font-size:13px;line-height:1.8;}.pairing-section h3{font-size:14px;color:#8e44ad;margin-bottom:8px;}.pairing-item{display:flex;align-items:center;gap:8px;margin-bottom:6px;}.pairing-item .pname{font-weight:bold;min-width:80px;}.pairing-item .pdesc{color:#666;}.weekly-plan{width:100%;border-collapse:collapse;font-size:12px;margin-top:15px;}.weekly-plan th{background:#8e44ad;color:#fff;padding:8px;text-align:center;}.weekly-plan td{border:1px solid #ddd;padding:8px;text-align:center;}.weekly-plan td:first-child{font-weight:bold;background:#f8f9fa;}.shopping-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px;}.shop-category{border:1px solid #eee;border-radius:8px;padding:12px;}.shop-category h4{font-size:13px;color:#8e44ad;margin-bottom:8px;}.shop-item{font-size:12px;margin-bottom:4px;display:flex;justify-content:space-between;}</style></head><body><div class="recipe-card"><div class="recipe-hero"><h1>红烧肉</h1><div style="opacity:0.8;">Braised Pork Belly</div><div style="margin-top:15px;font-size:13px;">⏱ 90分钟 | 🔥 中等难度 | 👥 4人份</div></div><div class="recipe-body"><div class="section"><h2>🥩 食材清单</h2><div class="ingredient-grid"><div class="ingredient-item"><span>五花肉</span><span class="amount">500g</span></div><div class="ingredient-item"><span>冰糖</span><span class="amount">30g</span></div><div class="ingredient-item"><span>生抽</span><span class="amount">2勺</span></div><div class="ingredient-item"><span>老抽</span><span class="amount">1勺</span></div><div class="ingredient-item"><span>料酒</span><span class="amount">2勺</span></div><div class="ingredient-item"><span>八角</span><span class="amount">2个</span></div><div class="ingredient-item"><span>桂皮</span><span class="amount">1小块</span></div><div class="ingredient-item"><span>姜片</span><span class="amount">3片</span></div><div class="ingredient-item"><span>葱段</span><span class="amount">2根</span></div><div class="ingredient-item"><span>香叶</span><span class="amount">2片</span></div></div></div><div class="section"><h2>👨‍🍳 烹饪步骤</h2><div class="step"><div class="step-num">1</div><div class="step-content">五花肉切成3cm见方的块，冷水下锅焯水3分钟，加料酒去腥，捞出沥干。</div></div><div class="step"><div class="step-num">2</div><div class="step-content">锅中放少许油，小火熬冰糖至琥珀色起泡，放入肉块翻炒上色，每面约30秒。</div></div><div class="step"><div class="step-num">3</div><div class="step-content">加入生抽、老抽、料酒翻炒均匀，放入八角、桂皮、姜片、葱段、香叶。</div></div><div class="step"><div class="step-num">4</div><div class="step-content">加开水没过肉块约2cm，大火烧开后转小火慢炖60分钟，中途翻动1-2次。</div></div><div class="step"><div class="step-num">5</div><div class="step-content">开大火收汁至汤汁浓稠，约5-8分钟，期间不断翻动防止糊锅。</div></div><div class="step"><div class="step-num">6</div><div class="step-content">出锅装盘，撒上葱花点缀即可。</div></div></div><div class="tip-box">💡 小贴士：冰糖炒色时火候要小，颜色变深起泡即可，炒过头会发苦。炖肉时一定要加开水，加冷水肉会变硬。</div><div class="nutrition-info"><div class="nutrition-item"><div class="value">485</div><div class="label">千卡/份</div></div><div class="nutrition-item"><div class="value">32g</div><div class="label">蛋白质</div></div><div class="nutrition-item"><div class="value">35g</div><div class="label">脂肪</div></div><div class="nutrition-item"><div class="value">8g</div><div class="label">碳水</div></div></div></div></div><div class="page-break"></div><div class="recipe-card"><div class="recipe-hero green"><h1>清炒时蔬</h1><div style="opacity:0.8;">Stir-fried Seasonal Vegetables</div><div style="margin-top:15px;font-size:13px;">⏱ 15分钟 | 🟢 简单难度 | 👥 2人份</div></div><div class="recipe-body section green"><h2>🥬 食材清单</h2><div class="ingredient-grid"><div class="ingredient-item"><span>西兰花</span><span class="amount">200g</span></div><div class="ingredient-item"><span>胡萝卜</span><span class="amount">100g</span></div><div class="ingredient-item"><span>蒜末</span><span class="amount">3瓣</span></div><div class="ingredient-item"><span>盐</span><span class="amount">适量</span></div><div class="ingredient-item"><span>蚝油</span><span class="amount">1勺</span></div><div class="ingredient-item"><span>食用油</span><span class="amount">2勺</span></div></div><h2>👨‍🍳 烹饪步骤</h2><div class="step"><div class="step-num">1</div><div class="step-content">西兰花掰小朵，胡萝卜切薄片，分别焯水1分钟捞出沥干。</div></div><div class="step"><div class="step-num">2</div><div class="step-content">热锅凉油，爆香蒜末，先下胡萝卜翻炒30秒。</div></div><div class="step"><div class="step-num">3</div><div class="step-content">加入西兰花，大火快炒1分钟，加盐和蚝油调味出锅。</div></div><div class="tip-box">💡 小贴士：焯水时加少许盐和油，可以保持蔬菜翠绿。大火快炒是保持口感脆嫩的关键。</div></div></div><div class="recipe-card"><div class="recipe-hero blue"><h1>番茄蛋花汤</h1><div style="opacity:0.8;">Tomato Egg Drop Soup</div><div style="margin-top:15px;font-size:13px;">⏱ 20分钟 | 🟢 简单难度 | 👥 3人份</div></div><div class="recipe-body section blue"><h2>🍅 食材清单</h2><div class="ingredient-grid"><div class="ingredient-item"><span>番茄</span><span class="amount">2个</span></div><div class="ingredient-item"><span>鸡蛋</span><span class="amount">2个</span></div><div class="ingredient-item"><span>香葱</span><span class="amount">1根</span></div><div class="ingredient-item"><span>盐</span><span class="amount">适量</span></div><div class="ingredient-item"><span>香油</span><span class="amount">几滴</span></div><div class="ingredient-item"><span>白胡椒粉</span><span class="amount">少许</span></div></div><h2>👨‍🍳 烹饪步骤</h2><div class="step"><div class="step-num">1</div><div class="step-content">番茄顶部划十字，开水烫30秒去皮，切小块。鸡蛋打散备用。</div></div><div class="step"><div class="step-num">2</div><div class="step-content">锅中放少许油，下番茄块翻炒至出汁变软，加入适量清水烧开。</div></div><div class="step"><div class="step-num">3</div><div class="step-content">转小火，沿锅边缓缓倒入蛋液，待蛋花浮起后轻轻搅动，加盐、白胡椒粉调味，淋香油撒葱花。</div></div><div class="tip-box">💡 小贴士：倒蛋液时火要小，沿锅边缓缓倒入，这样蛋花更漂亮。番茄先炒出汁再加水，汤底更浓郁。</div></div></div><div class="pairing-section SAMPLES.paper='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>学术论文</title><style>body{font-family:"Times New Roman","SimSun",serif;padding:40px 60px;max-width:800px;margin:0 auto;color:#000;line-height:1.8;font-size:14px;}.paper-title{text-align:center;font-size:20px;font-weight:bold;margin-bottom:8px;}.authors{text-align:center;font-size:13px;margin-bottom:20px;}.abstract{background:#f8f9fa;padding:15px 20px;border-radius:4px;margin:20px 0;font-size:13px;}.keywords span{display:inline-block;border:1px solid #ddd;padding:2px 8px;border-radius:3px;margin:2px;background:#f8f9fa;font-size:12px;}h2{font-size:15px;margin:25px 0 10px;border-bottom:1px solid #ddd;padding-bottom:5px;}p{text-indent:2em;margin:8px 0;}.formula{text-align:center;margin:15px 0;font-style:italic;font-size:15px;}.data-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px;}.data-table th{background:#f0f0f0;border:1px solid #ccc;padding:6px;text-align:center;}.data-table td{border:1px solid #ccc;padding:6px;text-align:center;}.page-break{page-break-after:always;border-bottom:1px dashed #ccc;padding-bottom:15px;margin-bottom:15px;}</style></head><body><div class="paper-title">基于深度学习的自然语言处理技术在智能客服系统中的应用研究</div><div class="authors">陈思远¹ 王晓明² 李华¹<br><span style="font-size:11px;">1. XX大学计算机科学与技术学院 &nbsp; 2. YY研究院人工智能实验室</span></div><div class="abstract"><strong>摘要：</strong>本文提出了基于预训练语言模型与知识图谱融合的智能客服系统。该系统采用BERT预训练模型进行意图识别，结合知识图谱实现精准的实体链接与答案生成。在自建数据集上的实验结果表明，本系统的意图识别准确率达到94.7%，实体链接F1值达到91.2%，显著优于传统规则引擎和单一模型方法。此外，本文还提出了一种基于多任务学习的联合优化策略，进一步提升了系统的整体性能。</div><div class="keywords"><strong>关键词：</strong><span>深度学习</span><span>自然语言处理</span><span>智能客服</span><span>知识图谱</span><span>预训练模型</span></div><h2>1 引言</h2><p>随着互联网技术的快速发展，智能客服系统在电商、金融、医疗等领域得到了广泛应用。传统的智能客服系统主要基于规则引擎和关键词匹配，存在维护成本高、泛化能力弱等问题。近年来，深度学习技术在自然语言处理领域取得了突破性进展，为智能客服系统的升级提供了新的技术路径。</p><p>预训练语言模型（如BERT、GPT等）通过在大规模语料上的自监督学习，能够捕获丰富的语言知识，在文本分类、命名实体识别、问答系统等任务上取得了显著效果。然而，单一的预训练模型在处理领域特定问题时，仍存在知识覆盖不足、推理能力有限等缺陷。</p><p>知识图谱作为一种结构化的知识表示方式，能够提供精确的实体关系信息，弥补预训练模型在知识准确性方面的不足。因此，本文提出将预训练语言模型与知识图谱进行融合，构建一个兼具语言理解能力和知识推理能力的智能客服系统。</p><h2>2 相关工作</h2><p>智能客服系统的研究可以追溯到20世纪60年代的ELIZA系统。早期的系统主要基于模板匹配和规则引擎，如AIML框架。随着机器学习技术的发展，基于统计学习的方法逐渐成为主流，包括SVM、CRF等。近年来，深度学习方法在意图识别和槽位填充任务上取得了显著进展，如CNN、RNN、Transformer等架构的应用。</p><p>知识图谱增强的自然语言处理是近年来的研究热点。Zhang等人提出了ERNIE模型，将知识图谱信息融入预训练过程；Sun等人设计了K-BERT模型，在BERT基础上引入知识图谱的分支结构。这些工作表明，知识图谱与预训练模型的融合能够有效提升NLP任务的性能。</p><div class="page-break"></div><h2>3 方法</h2><p>本文提出的智能客服系统框架包含三个核心模块：意图识别模块、实体链接模块和答案生成模块。</p><p><strong>3.1 意图识别模块</strong>：基于BERT预训练模型，在领域数据上进行微调。输入用户问句，输出意图类别概率分布。采用多任务学习策略，同时优化意图分类和槽位填充两个任务。</p><p><strong>3.2 实体链接模块</strong>：将用户问句中的实体提及链接到知识图谱中的对应实体。采用两阶段方法：首先使用命名实体识别模型提取实体提及，然后通过实体消歧将提及映射到知识图谱实体。</p><p><strong>3.3 答案生成模块</strong>：基于检索增强生成（RAG）策略，结合知识图谱查询结果和预训练语言模型生成自然语言答案。</p><div class="formula">P(a|s) = softmax(W · [h_t; k_t; c_t] + b)</div><p>其中，h_t为BERT输出的隐状态向量，k_t为知识图谱嵌入向量，c_t为上下文注意力向量，W和b为可学习参数。</p><h2>4 实验</h2><p>本文在自建的客服对话数据集上进行了实验，该数据集包含10个意图类别、50个槽位类型，共计50,000条标注数据。实验采用5折交叉验证，评价指标包括准确率（Accuracy）、精确率（Precision）、召回率（Recall）和F1值。</p><table class="data-table"><tr><th>方法</th><th>意图准确率(%)</th><th>槽位F1(%)</th><th>实体链接F1(%)</th><th>端到端F1(%)</th></tr><tr><td>Rule-based</td><td>78.3</td><td>72.1</td><td>65.4</td><td>60.2</td></tr><tr><td>SVM+CRF</td><td>85.6</td><td>80.3</td><td>73.8</td><td>68.5</td></tr><tr><td>BERT-base</td><td>91.2</td><td>87.5</td><td>82.6</td><td>78.3</td></tr><tr><td>BERT+KG</td><td>93.8</td><td>89.7</td><td>90.1</td><td>86.9</td></tr><tr><td><strong>Ours (MTL+KG)</strong></td><td><strong>94.7</strong></td><td><strong>91.4</strong></td><td><strong>91.2</strong></td><td><strong>89.6</strong></td></tr></table><h2>5 结论</h2><p>本文提出了基于预训练语言模型与知识图谱融合的智能客服系统，通过多任务学习策略联合优化意图识别和槽位填充任务。实验结果表明，本系统在各项指标上均优于基线方法，意图识别准确率达94.7%，端到端F1值达89.6%。未来工作将探索大语言模型在智能客服中的应用，以及多轮对话场景下的上下文理解问题。</p><p style="font-size:12px;color:#666;margin-top:20px;"><strong>参考文献：</strong><br>[1] Devlin J, et al. BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding. NAACL 2019.<br>[2] Zhang Z, et al. ERNIE: Enhanced Language Representation with Informative Entities. ACL 2019.<br>[3] Sun T, et al. K-BERT: Enabling Language Representation with Knowledge Graph. AAAI 2020.</p></body></html>';

function buildTemplateButtons(){
    TEMPLATES.forEach(function(tpl){
        var btn=document.createElement('button');
        btn.className='tpl-btn';
        btn.dataset.id=tpl.id;
        btn.innerHTML='<span>'+tpl.icon+'</span>'+tpl.name;
        btn.onclick=function(){loadSample(tpl.id);};
        templatesScroll.appendChild(btn);
    });
}

function loadSample(name){
    htmlEditor.value=SAMPLES[name]||'';
    document.querySelectorAll('.tpl-btn').forEach(function(b){b.classList.toggle('active',b.dataset.id===name);});
    var tpl=TEMPLATES.find(function(t){return t.id===name;});
    currentTpl.textContent=tpl?tpl.icon+' '+tpl.name:'';
    updatePreview();
}

function updatePreview(){
    var code=htmlEditor.value;
    charCount.textContent=code.length+' 字符';
    try{
        if('srcdoc' in previewFrame){previewFrame.srcdoc=code;}
        else{var doc=previewFrame.contentDocument;doc.open();doc.write(code);doc.close();}
    }catch(e){previewFrame.src='data:text/html;charset=utf-8,'+encodeURIComponent(code);}
}

htmlEditor.addEventListener('input',function(){
    clearTimeout(htmlEditor._timer);
    htmlEditor._timer=setTimeout(updatePreview,300);
    charCount.textContent=htmlEditor.value.length+' 字符';
    currentTpl.textContent='自定义编辑中...';
});

function showToast(msg,type){
    type=type||'info';
    var t=document.createElement('div');
    t.className='toast '+type;
    t.textContent=msg;
    document.getElementById('toastContainer').appendChild(t);
    setTimeout(function(){t.remove();},3000);
}

function setStatus(text){statusText.textContent=text;}
function getHtmlContent(){return htmlEditor.value;}

function getFilename(ext){
    ext=ext||'docx';
    var content=htmlEditor.value;
    var title=(content.match(/<title[^>]*>([\s\S]*?)<\/title>/i)||[])[1];
    return(title?title.trim().replace(/[^a-zA-Z0-9\u4e00-\u9fa5_-]/g,'_'):'export')+'.'+ext;
}

function isLibLoaded(id){return LIBS[id]&&LIBS[id].check();}
function isMethodReady(method){return method.libs.every(function(lid){return isLibLoaded(lid);});}

function loadLib(id){
    if(isLibLoaded(id)){return Promise.resolve();}
    if(libLoading[id]){return libLoading[id];}
    showToast('正在加载 '+LIBS[id].name+'...','info');
    libLoading[id]=new Promise(function(resolve,reject){
        var s=document.createElement('script');
        s.src=LIBS[id].url;
        s.onload=function(){
            libLoading[id]=null;
            if(id==='htmlDocxJs'){
                _htmlDocxJsFn=window.htmlDocx;
                delete window.htmlDocx;
            }else if(id==='htmlToDocx'){
                _htmlToDocxFn=window.HTMLtoDOCX;
                delete window.HTMLtoDOCX;
            }else if(id==='docShift'){
                _docShiftFn=window.DocShift;
                delete window.DocShift;
            }
            showToast(LIBS[id].name+' 加载成功','success');
            refreshUI();
            resolve();
        };
        s.onerror=function(){
            libLoading[id]=null;
            showToast(LIBS[id].name+' 加载失败','error');
            refreshUI();
            reject();
        };
        document.head.appendChild(s);
    });
    return libLoading[id];
}

function loadLibsForMethod(method){return Promise.all(method.libs.map(function(lid){return loadLib(lid);}));}
function loadAllLibs(){return Promise.all(Object.keys(LIBS).map(function(id){return loadLib(id);}));}

function buildMethodsGrid(){
    methodsGrid.innerHTML='';
    METHODS.forEach(function(m){
        var ready=isMethodReady(m);
        var card=document.createElement('div');
        card.className='method-card '+(ready?'ready':'missing');
        card.id='methodCard'+m.id;
        if(selectedMethod===m.id)card.classList.add('selected');
        var info=document.createElement('div');
        info.className='method-info';
        info.innerHTML='<span class="num">'+m.id+'</span><span class="mname">'+m.name+'</span><span class="mstatus">'+(ready?'🟢':'🟡')+'</span>';
        info.onclick=function(){selectMethod(m.id);};
        var actions=document.createElement('div');
        actions.className='method-actions';
        var exportBtn=document.createElement('button');
        exportBtn.className='method-export-btn';
        exportBtn.id='exportBtn'+m.id;
        if(ready){
            exportBtn.textContent='🚀 导出'+m.format.toUpperCase();
            exportBtn.onclick=function(e){e.stopPropagation();doExport(m.id);};
        }else{
            exportBtn.textContent='📥 加载并导出';
            exportBtn.classList.add('loading');
            exportBtn.onclick=function(e){
                e.stopPropagation();
                exportBtn.textContent='⏳ 加载中...';
                exportBtn.disabled=true;
                loadLibsForMethod(m).then(function(){refreshUI();doExport(m.id);}).catch(function(){exportBtn.textContent='📥 重试';exportBtn.disabled=false;});
            };
        }
        var detailBtn=document.createElement('button');
        detailBtn.className='method-detail-btn';
        detailBtn.textContent='详情';
        detailBtn.onclick=function(e){e.stopPropagation();selectMethod(m.id);};
        actions.appendChild(exportBtn);
        actions.appendChild(detailBtn);
        card.appendChild(info);
        card.appendChild(actions);
        methodsGrid.appendChild(card);
    });
}

function refreshUI(){buildMethodsGrid();renderPanel();}
function selectMethod(id){selectedMethod=id;switchTab('method');refreshUI();}
function switchTab(tab){activeTab=tab;document.querySelectorAll('.panel-tab').forEach(function(t){t.classList.toggle('active',t.dataset.tab===tab);});renderPanel();}
function renderPanel(){
    if(activeTab==='libs')renderLibsPanel();
    else if(activeTab==='github')renderGithubPanel();
    else if(activeTab==='compare')renderComparePanel();
    else if(activeTab==='config')renderConfigPanel();
    else renderMethodPanel();
}

function renderLibsPanel(){
    var html='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><span style="font-size:12px;font-weight:600;color:var(--text);">📦 库文件管理</span><button class="load-all-btn" onclick="loadAllLibs().then(function(){refreshUI();})">一键加载全部</button></div>';
    Object.keys(LIBS).forEach(function(id){
        var lib=LIBS[id];var loaded=isLibLoaded(id);
        html+='<div class="lib-card"><div class="lib-icon">'+lib.icon+'</div><div class="lib-info"><div class="lib-name">'+lib.name+'</div><div class="lib-desc">'+lib.desc+'</div><div class="lib-size">'+lib.size+' | ⭐'+lib.stars+' | '+lib.compat+'</div></div><span class="lib-status '+(loaded?'loaded':'unloaded')+'">'+(loaded?'✅ 已加载':'❌ 未加载')+'</span>';
        if(!loaded)html+='<button class="lib-load-btn" onclick="loadLib(\''+id+'\').then(function(){refreshUI();})">加载</button>';
        html+='</div>';

    html+='<table class="compare-table"><tr><th>方案</th><th>输出格式</th><th>转换质量</th><th>转换速度</th><th>兼容性</th><th>易用性</th><th>需加载库</th><th>库大小</th></tr>';

    html+='<div class="config-row"><label>正文字号</label><select id="cfgFontSize" onchange="EXPORT_CONFIG.fontSize=parseInt(this.value)"><option value="21"'+(EXPORT_CONFIG.fontSize===21?' selected':'')+'>小五 (9pt)</option><option value="24"'+(EXPORT_CONFIG.fontSize===24?' selected':'')+'>五号 (10.5pt)</option><option value="28"'+(EXPORT_CONFIG.fontSize===28?' selected':'')+'>小四 (12pt)</option><option value="30"'+(EXPORT_CONFIG.fontSize===30?' selected':'')+'>四号 (14pt)</option></select></div>';
    html+='</div>';
    panelContent.innerHTML=html;
}

    html+='<span>质量：'+m.quality+'</span><span>速度：'+m.speed+'</span><span>兼容：'+m.compat+'</span><span>易用：'+m.ease+'</span>';

        });

    }else{

    }

function downloadBlob(blob,filename){
    if(typeof saveAs!=='undefined'){
        saveAs(blob,filename);
        showToast('导出成功：'+filename,'success');
    }else{
        var url=URL.createObjectURL(blob);
        var a=document.createElement('a');
        a.href=url;a.download=filename;
        document.body.appendChild(a);a.click();document.body.removeChild(a);
        setTimeout(function(){URL.revokeObjectURL(url);},1000);
        showToast('导出成功：'+filename,'success');
    }
}

function htmlToText(html){
    var tmp=document.createElement('div');tmp.innerHTML=html;
    return tmp.textContent||tmp.innerText||'';
}

function wrapHtmlForDoc(html){
    if(/<html/i.test(html))return html;
    return '<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body>'+html+'</body></html>';
}

function getOrientation(){
    return EXPORT_CONFIG.orientation||'portrait';
}

function getMargins(){
    return {
        top:EXPORT_CONFIG.marginTop,
        right:EXPORT_CONFIG.marginRight,
        bottom:EXPORT_CONFIG.marginBottom,
        left:EXPORT_CONFIG.marginLeft,
        header:720,
        footer:720,
        gutter:0
    };
}

async function doExport(id){
    var method=METHODS.find(function(m){return m.id===id;});
    if(!method)return;
    if(!isMethodReady(method)){showToast('请先加载所需库','error');return;}
    var html=getHtmlContent();
    if(!html.trim()){showToast('内容为空','error');return;}
    setStatus('方案'+id+': '+method.name+' 生成中...');
    showToast('方案'+id+': 开始生成','info');
    var startTime=performance.now();
    try{
        switch(id){
            case 1:await exportHtmlToDocx(html);break;
            case 2:await exportHtmlDocxJs(html);break;
            case 3:await exportDocShift(html);break;
            case 4:await exportDocxJs(html);break;
            case 5:await exportDocxJsParsed(html);break;
            case 6:exportHtmlAsDoc(html);break;
            case 7:await exportRichCopy(html);break;
            case 8:exportPrintPreview(html);break;
        }
        var elapsed=((performance.now()-startTime)/1000).toFixed(2);
        setStatus('方案'+id+': 导出完成 ('+elapsed+'s)');
    }catch(e){
        showToast('方案'+id+'失败: '+e.message,'error');
        setStatus('方案'+id+': 失败 - '+e.message);
    }
}

async function exportHtmlToDocx(html){
    var fullHtml=wrapHtmlForDoc(html);
    var opts={
        orientation:getOrientation(),
        margins:getMargins(),
        table:{row:{cantSplit:true}},
        footer:false,
        header:false
    };
    var result=await _htmlToDocxFn(fullHtml,null,opts);
    var blob=new Blob([result],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
    downloadBlob(blob,getFilename('docx'));
}

async function exportHtmlDocxJs(html){
    var fullHtml=wrapHtmlForDoc(html);
    var opts={
        orientation:getOrientation(),
        margins:getMargins()
    };
    var converted=_htmlDocxJsFn.asBlob(fullHtml,opts);
    var blob=new Blob([converted],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
    downloadBlob(blob,getFilename('docx'));
    showToast('提示：html-docx-js使用altchunks，仅Word可正常打开，LibreOffice/Google Docs不支持','warning');
}

async function exportDocShift(html){
    var fullHtml=wrapHtmlForDoc(html);
    var result=await _docShiftFn.toDocx(fullHtml);
    var blob=new Blob([result],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
    downloadBlob(blob,getFilename('docx'));
}

async function exportDocxJs(html){
    var text=htmlToText(html);
    var titleMatch=html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
    var title=titleMatch?titleMatch[1]:'导出文档';
    var paragraphs=text.split('\n').filter(function(l){return l.trim().length>0;});
    var children=[];
    children.push(new docx.Paragraph({
        children:[new docx.TextRun({text:title,bold:true,size:48,font:EXPORT_CONFIG.fontName})],
        alignment:docx.AlignmentType.CENTER,
        spacing:{after:400}
    }));
    children.push(new docx.Paragraph({children:[]}));
    paragraphs.forEach(function(l){
        children.push(new docx.Paragraph({
            children:[new docx.TextRun({text:l,size:EXPORT_CONFIG.fontSize,font:EXPORT_CONFIG.fontName})],
            spacing:{after:120}
        }));
    });
    var doc=new docx.Document({
        sections:[{
            properties:{
                page:{
                    size:getOrientation()==='landscape'?
                        {width:16838,height:11906,orientation:docx.PageOrientation.LANDSCAPE}:
                        {width:11906,height:16838},
                    margin:{top:EXPORT_CONFIG.marginTop,bottom:EXPORT_CONFIG.marginBottom,left:EXPORT_CONFIG.marginLeft,right:EXPORT_CONFIG.marginRight}
                }
            },
            children:children
        }]
    });
    var blob=await docx.Packer.toBlob(doc);
    downloadBlob(blob,getFilename('docx'));
    showToast('提示：docx.js声明式方案仅导出纯文本，HTML样式已丢失','warning');
}

async function exportDocxJsParsed(html){
    var tmp=document.createElement('div');
    tmp.innerHTML=html.replace(/<!DOCTYPE[^>]*>/i,'').replace(/<html[^>]*>/i,'').replace(/<\/html>/i,'').replace(/<head[^>]*>[\s\S]*?<\/head>/i,'').replace(/<body[^>]*>/i,'<div>').replace(/<\/body>/i,'</div>');
    var titleMatch=html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
    var title=titleMatch?titleMatch[1]:'导出文档';
    var children=[];
    children.push(new docx.Paragraph({
        children:[new docx.TextRun({text:title,bold:true,size:48,font:EXPORT_CONFIG.fontName})],
        alignment:docx.AlignmentType.CENTER,
        spacing:{after:400}
    }));

    function processNode(node){
        if(node.nodeType===3){
            var txt=node.textContent.trim();
            if(txt)children.push(new docx.Paragraph({children:[new docx.TextRun({text:txt,size:EXPORT_CONFIG.fontSize,font:EXPORT_CONFIG.fontName})],spacing:{after:120}}));
            return;
        }
        if(node.nodeType!==1)return;
        var tag=node.tagName.toLowerCase();
        if(tag==='style'||tag==='script'||tag==='meta'||tag==='link'||tag==='head')return;
        if(tag==='h1'||tag==='h2'||tag==='h3'||tag==='h4'||tag==='h5'||tag==='h6'){
            var sizes={h1:48,h2:36,h3:28,h4:24,h5:21,h6:18};
            children.push(new docx.Paragraph({
                children:[new docx.TextRun({text:node.textContent,bold:true,size:sizes[tag]||28,font:EXPORT_CONFIG.fontName})],
                spacing:{before:240,after:120}
            }));
        }else if(tag==='p'){
            var runs=[];
            node.childNodes.forEach(function(cn){
                if(cn.nodeType===3){
                    var t=cn.textContent;
                    if(t)runs.push(new docx.TextRun({text:t,size:EXPORT_CONFIG.fontSize,font:EXPORT_CONFIG.fontName}));
                }else if(cn.nodeType===1){
                    var ct=cn.tagName.toLowerCase();
                    if(ct==='strong'||ct==='b')runs.push(new docx.TextRun({text:cn.textContent,bold:true,size:EXPORT_CONFIG.fontSize,font:EXPORT_CONFIG.fontName}));
                    else if(ct==='em'||ct==='i')runs.push(new docx.TextRun({text:cn.textContent,italics:true,size:EXPORT_CONFIG.fontSize,font:EXPORT_CONFIG.fontName}));
                    else if(ct==='u')runs.push(new docx.TextRun({text:cn.textContent,underline:{type:docx.UnderlineType.SINGLE},size:EXPORT_CONFIG.fontSize,font:EXPORT_CONFIG.fontName}));
                    else runs.push(new docx.TextRun({text:cn.textContent,size:EXPORT_CONFIG.fontSize,font:EXPORT_CONFIG.fontName}));
                }
            });
            if(runs.length>0)children.push(new docx.Paragraph({children:runs,spacing:{after:120}}));
        }else if(tag==='table'){
            var rows=node.querySelectorAll('tr');
            var tableRows=[];
            rows.forEach(function(row){
                var cells=row.querySelectorAll('th,td');
                var tableCells=[];
                cells.forEach(function(cell){
                    tableCells.push(new docx.TableCell({
                        children:[new docx.Paragraph({children:[new docx.TextRun({text:cell.textContent,size:EXPORT_CONFIG.fontSize,font:EXPORT_CONFIG.fontName,bold:cell.tagName.toLowerCase()==='th'})]})],
                        width:{size:Math.floor(9000/Math.max(cells.length,1)),type:docx.WidthType.DXA}
                    }));
                });
                if(tableCells.length>0)tableRows.push(new docx.TableRow({children:tableCells}));
            });
            if(tableRows.length>0)children.push(new docx.Table({rows:tableRows,width:{size:100,type:docx.WidthType.PERCENTAGE}}));
        }else if(tag==='ul'||tag==='ol'){
            var items=node.querySelectorAll(':scope > li');
            items.forEach(function(li,i){
                children.push(new docx.Paragraph({
                    children:[new docx.TextRun({text:(tag==='ol'?(i+1)+'. ':'• ')+li.textContent,size:EXPORT_CONFIG.fontSize,font:EXPORT_CONFIG.fontName})],
                    spacing:{after:60},
                    indent:{left:720}
                }));
            });
        }else if(tag==='br'){
            children.push(new docx.Paragraph({children:[]}));
        }else{
            node.childNodes.forEach(function(cn){processNode(cn);});
        }
    }

    tmp.childNodes.forEach(function(cn){processNode(cn);});

    var doc=new docx.Document({
        sections:[{
            properties:{
                page:{
                    size:getOrientation()==='landscape'?
                        {width:16838,height:11906,orientation:docx.PageOrientation.LANDSCAPE}:
                        {width:11906,height:16838},
                    margin:{top:EXPORT_CONFIG.marginTop,bottom:EXPORT_CONFIG.marginBottom,left:EXPORT_CONFIG.marginLeft,right:EXPORT_CONFIG.marginRight}
                }
            },
            children:children
        }]
    });
    var blob=await docx.Packer.toBlob(doc);
    downloadBlob(blob,getFilename('docx'));
}

function exportHtmlAsDoc(html){
    var fullHtml=wrapHtmlForDoc(html);
    var wordHtml='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom><w:DoNotOptimizeForBrowser/></w:WordDocument></xml><![endif]--><style>'+
        '@page { size: '+EXPORT_CONFIG.pageSize+'; margin: '+(EXPORT_CONFIG.marginTop/1440*2.54).toFixed(2)+'cm '+(EXPORT_CONFIG.marginRight/1440*2.54).toFixed(2)+'cm '+(EXPORT_CONFIG.marginBottom/1440*2.54).toFixed(2)+'cm '+(EXPORT_CONFIG.marginLeft/1440*2.54).toFixed(2)+'cm; }'+
        'body { font-family: "'+EXPORT_CONFIG.fontName+'", sans-serif; font-size: '+(EXPORT_CONFIG.fontSize/2).toFixed(1)+'pt; }'+
        '</style></head><body>'+fullHtml.replace(/<!DOCTYPE[^>]*>/i,'').replace(/<html[^>]*>/i,'').replace(/<\/html>/i,'').replace(/<head[^>]*>[\s\S]*?<\/head>/i,'').replace(/<body[^>]*>/i,'').replace(/<\/body>/i,'')+'</body></html>';
    var blob=new Blob(['\ufeff'+wordHtml],{type:'application/msword'});
    downloadBlob(blob,getFilename('doc'));
    showToast('提示：.doc格式实际为Word兼容HTML，Word/WPS可直接打开，保留CSS样式','info');
}

async function exportRichCopy(html){
    var tmp=document.createElement('div');
    tmp.innerHTML=html;
    tmp.style.cssText='position:fixed;left:-9999px;top:0;';
    document.body.appendChild(tmp);
    try{
        var htmlContent=tmp.innerHTML;
        var textContent=tmp.textContent||tmp.innerText||'';
        if(navigator.clipboard&&navigator.clipboard.write){
            await navigator.clipboard.write([
                new ClipboardItem({
                    'text/html':new Blob([htmlContent],{type:'text/html'}),
                    'text/plain':new Blob([textContent],{type:'text/plain'})
                })
            ]);
            showToast('已复制富文本到剪贴板，可直接粘贴到Word/WPS','success');
        }else{
            var range=document.createRange();
            range.selectNodeContents(tmp);
            var sel=window.getSelection();
            sel.removeAllRanges();sel.addRange(range);
            document.execCommand('copy');
            sel.removeAllRanges();
            showToast('已复制到剪贴板（兼容模式），可直接粘贴到Word','success');
        }
    }catch(e){
        showToast('复制失败: '+e.message,'error');
    }finally{
        document.body.removeChild(tmp);
    }
}

function exportPrintPreview(html){
    var printWin=window.open('','_blank');
    if(!printWin){showToast('弹窗被拦截，请允许弹窗后重试','error');return;}
    printWin.document.write(html);
    printWin.document.close();
    printWin.onload=function(){printWin.print();};
    showToast('已打开打印预览，可选择"打印到PDF"或"另存为"','success');
}
