<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双向同步编辑器 - 复杂内容测试</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#1e1e1e;--surface:#252526;--accent:#007acc;--text:#d4d4d4;--text2:#808080;--border:#3c3c3c;--success:#28a745;--warning:#e67e22;--error:#dc3545}
        html,body{height:100%;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
        .app{display:grid;grid-template-rows:auto 1fr auto auto;height:100vh;grid-template-columns:180px 1fr 1fr}
        .header{grid-column:1/-1;background:var(--surface);padding:12px 24px;border-bottom:2px solid var(--accent);display:flex;align-items:center;gap:16px}
        .header h1{font-size:17px;font-weight:700;color:var(--accent);letter-spacing:.5px}
        .header .badge{font-size:10px;background:rgba(0,122,204,.2);color:var(--accent);padding:4px 12px;border-radius:12px;border:1px solid rgba(0,122,204,.3)}
        .sync-indicator{margin-left:auto;font-size:12px;display:flex;align-items:center;gap:8px;color:var(--text2)}
        .sync-dot{width:8px;height:8px;border-radius:50%;background:var(--success);animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

        .tpl-sidebar{background:#1a1a1a;border-right:1px solid var(--border);overflow-y:auto;padding:12px 0}
        .tpl-section{margin-bottom:16px}
        .tpl-section-title{font-size:10px;color:var(--text2);padding:8px 16px 6px;text-transform:uppercase;letter-spacing:1px}
        .tpl-btn{display:block;width:calc(100% - 16px);margin:0 8px 4px;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);cursor:pointer;font-size:12px;text-align:left;transition:all .15s}
        .tpl-btn:hover{border-color:var(--accent);background:rgba(0,122,204,.08);color:#fff}
        .tpl-btn.active{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:600}
        .tpl-btn .tpl-icon{font-size:14px;margin-right:8px}
        .tpl-btn .tpl-name{display:block;font-size:11px;opacity:.7;margin-top:2px}

        .editor-panel,.preview-panel{display:flex;flex-direction:column;overflow:hidden}
        .editor-panel{border-right:2px solid var(--border)}
        .panel-header{padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border);font-size:13px;color:var(--text2);display:flex;align-items:center;justify-content:space-between}
        .panel-header .label{color:var(--text);font-weight:600;font-size:13px}
        .panel-header .hint{font-size:10px;color:var(--accent);background:rgba(0,122,204,.12);padding:3px 10px;border-radius:6px}
        .editor-wrapper{flex:1;position:relative;overflow:hidden;}
        .highlight-layer{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:1;padding:16px 18px;font-family:"Cascadia Code","Consolas","Monaco","Courier New",monospace;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all;overflow:auto;}
        #htmlEditor{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;background:transparent;color:transparent;caret-color:#fff;border:none;padding:16px 18px;font-family:"Cascadia Code","Consolas","Monaco","Courier New",monospace;font-size:13px;line-height:1.7;resize:none;outline:none;tab-size:2;letter-spacing:.3px;z-index:2;}
        .token-tag{color:#569cd6}
        .token-attr{color:#9cdcfe}
        .token-string{color:#ce9178}
        .token-comment{color:#6a9955}
        .token-doctype{color:#569cd6}
        .token-text{color:#d4d4d4}
        .token-entity{color:#dcdcaa}
        .highlight-modified{background:rgba(255,198,109,.25);border-radius:3px}
        #previewFrame{flex:1;border:none;background:#fff}
        .status-bar{grid-column:1/-1;padding:8px 24px;background:var(--surface);border-top:1px solid var(--border);font-size:12px;color:var(--text2);display:flex;justify-content:space-between;align-items:center}
        .status-bar .direction{color:var(--accent);font-weight:600}
        .test-results{grid-column:1/-1;padding:8px 24px;background:#1a1a1a;border-top:1px solid var(--border);font-size:11px;color:var(--text2);display:flex;gap:20px;flex-wrap:wrap;align-items:center}
        .test-item{display:flex;align-items:center;gap:5px}
        .test-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
        .test-dot.pass{background:var(--success)}
        .test-dot.warn{background:var(--warning)}
        .test-dot.fail{background:var(--error)}
        .test-dot.pending{background:var(--text2)}
        .guard-info{margin-left:auto;font-size:10px;color:var(--success);display:flex;align-items:center;gap:4px}
        .edit-btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;transition:all .2s;background:var(--accent);color:#fff;}
        .edit-btn:hover{filter:brightness(1.1);}
        .edit-btn.inactive{background:#555;}
        .edit-btn.inactive:hover{background:#666;}
    </style>
</head>
<body>
<div class="app">
    <header class="header">
        <h1>🔄 双向同步编辑器</h1>
        <span class="badge">公式 · 表格 · SVG · 列表</span>
        <div class="sync-indicator">
            <span class="sync-dot"></span>
            <span>双向同步已启用</span>
        </div>
    </header>

    <nav class="tpl-sidebar">
        <div class="tpl-section">
            <div class="tpl-section-title">📐 数学公式</div>
            <button class="tpl-btn" data-tpl="math" onclick="loadTemplate('math')">
                <span class="tpl-icon">📐</span>数学公式
                <span class="tpl-name">分数·上下标·根号</span>
            </button>
            <button class="tpl-btn" data-tpl="table" onclick="loadTemplate('table')">
                <span class="tpl-icon">📊</span>表格
                <span class="tpl-name">成绩表·课程表</span>
            </button>
            <button class="tpl-btn" data-tpl="katex" onclick="loadTemplate('katex')">
                <span class="tpl-icon">🔢</span>KaTeX公式
                <span class="tpl-name">专业LaTeX公式</span>
            </button>
            <button class="tpl-btn" data-tpl="mixed" onclick="loadTemplate('mixed')">
                <span class="tpl-icon">🧩</span>综合混合
                <span class="tpl-name">公式+表格+填空</span>
            </button>
        </div>

        <div class="tpl-section">
            <div class="tpl-section-title">🎨 UI组件</div>
            <button class="tpl-btn" data-tpl="form" onclick="loadTemplate('form')">
                <span class="tpl-icon">📝</span>表单组件
                <span class="tpl-name">输入框·按钮·选择器</span>
            </button>
            <button class="tpl-btn" data-tpl="card" onclick="loadTemplate('card')">
                <span class="tpl-icon">🃏</span>卡片布局
                <span class="tpl-name">产品卡·信息卡</span>
            </button>
            <button class="tpl-btn" data-tpl="nav" onclick="loadTemplate('nav')">
                <span class="tpl-icon">🔗</span>导航菜单
                <span class="tpl-name">顶部栏·侧边栏</span>
            </button>
            <button class="tpl-btn" data-tpl="tabs" onclick="loadTemplate('tabs')">
                <span class="tpl-icon">📑</span>标签页
                <span class="tpl-name">Tabs切换·步骤条</span>
            </button>
            <button class="tpl-btn" data-tpl="modal" onclick="loadTemplate('modal')">
                <span class="tpl-icon">💬</span>对话框
                <span class="tpl-name">模态框·提示框</span>
            </button>
        </div>

        <div class="tpl-section">
            <div class="tpl-section-title">📈 数据展示</div>
            <button class="tpl-btn" data-tpl="chart" onclick="loadTemplate('chart')">
                <span class="tpl-icon">📊</span>图表
                <span class="tpl-name">柱状图·饼图·折线</span>
            </button>
            <button class="tpl-btn" data-tpl="stats" onclick="loadTemplate('stats')">
                <span class="tpl-icon">📈</span>统计卡片
                <span class="tpl-name">数据统计·指标卡</span>
            </button>
            <button class="tpl-btn" data-tpl="progress" onclick="loadTemplate('progress')">
                <span class="tpl-icon">⏳</span>进度条
                <span class="tpl-name">加载·步骤·环形</span>
            </button>
            <button class="tpl-btn" data-tpl="timeline" onclick="loadTemplate('timeline')">
                <span class="tpl-icon">�</span>时间线
                <span class="tpl-name">历程·历史·流程</span>
            </button>
        </div>

        <div class="tpl-section">
            <div class="tpl-section-title">🎭 视觉交互</div>
            <button class="tpl-btn" data-tpl="animation" onclick="loadTemplate('animation')">
                <span class="tpl-icon">✨</span>动画效果
                <span class="tpl-name">CSS动画·过渡</span>
            </button>
            <button class="tpl-btn" data-tpl="gallery" onclick="loadTemplate('gallery')">
                <span class="tpl-icon">🖼️</span>图片画廊
                <span class="tpl-name">网格·瀑布流</span>
            </button>
            <button class="tpl-btn" data-tpl="rating" onclick="loadTemplate('rating')">
                <span class="tpl-icon">⭐</span>评分组件
                <span class="tpl-name">星级·点赞·评价</span>
            </button>
        </div>

        <div class="tpl-section">
            <div class="tpl-section-title">📱 商业模板</div>
            <button class="tpl-btn" data-tpl="pricing" onclick="loadTemplate('pricing')">
                <span class="tpl-icon">💰</span>价格表
                <span class="tpl-name">Pricing Table</span>
            </button>
            <button class="tpl-btn" data-tpl="profile" onclick="loadTemplate('profile')">
                <span class="tpl-icon">👤</span>用户卡片
                <span class="tpl-name">Profile Card</span>
            </button>
            <button class="tpl-btn" data-tpl="search" onclick="loadTemplate('search')">
                <span class="tpl-icon">🔍</span>搜索框
                <span class="tpl-name">搜索组件·过滤</span>
            </button>
            <button class="tpl-btn" data-tpl="list" onclick="loadTemplate('list')">
                <span class="tpl-icon">�</span>列表嵌套
                <span class="tpl-name">有序·无序·定义</span>
            </button>
            <button class="tpl-btn" data-tpl="svg" onclick="loadTemplate('svg')">
                <span class="tpl-icon">🎨</span>SVG图形
                <span class="tpl-name">柱状图·几何图形</span>
            </button>
        </div>
    </nav>

    <section class="editor-panel">
        <div class="panel-header">
            <span class="label">📝 HTML 代码编辑器</span>
            <span class="hint">修改代码 → 自动同步到预览</span>
        </div>
        <div class="editor-wrapper" style="flex:1;position:relative;overflow:hidden;">
            <div id="highlightLayer" class="highlight-layer"></div>
            <textarea id="htmlEditor" spellcheck="false"></textarea>
        </div>
    </section>
    <section class="preview-panel">
        <div class="panel-header">
            <span class="label">👁️ 可编辑预览</span>
            <div style="display:flex;gap:12px;align-items:center;">
                <span class="hint" id="modeHint">预览模式 - 无法编辑</span>
                <button class="edit-btn" id="editBtn">🔓 启用编辑</button>
            </div>
        </div>
        <iframe id="previewFrame"></iframe>
    </section>

    <div class="test-results">
        <span class="test-item"><span class="test-dot pending" id="testText"></span>纯文本</span>
        <span class="test-item"><span class="test-dot pending" id="testFormula"></span>数学公式</span>
        <span class="test-item"><span class="test-dot pending" id="testTable"></span>表格</span>
        <span class="test-item"><span class="test-dot pending" id="testSvg"></span>SVG</span>
        <span class="test-item"><span class="test-dot pending" id="testList"></span>列表</span>
        <span class="test-item"><span class="test-dot pending" id="testStyle"></span>样式保留</span>
        <span class="guard-info">🛡️ 结构保护已启用（sup/sub/fraction）</span>
    </div>
    <footer class="status-bar">
        <span>同步方向：<span class="direction" id="syncDirection">就绪</span></span>
        <span id="syncCount">同步次数：0</span>
    </footer>
</div>

<script>
var htmlEditor=document.getElementById('htmlEditor');
var highlightLayer=document.getElementById('highlightLayer');
var previewFrame=document.getElementById('previewFrame');
var syncDirection=document.getElementById('syncDirection');
var syncCountEl=document.getElementById('syncCount');
var syncCount=0;
var isSyncing=false;
var editorTimer=null;
var previewTimer=null;
var ZWSP='\u200B';
var isEditMode=false;
var editBtn=document.getElementById('editBtn');
var modeHint=document.getElementById('modeHint');
var previousHtml='';
var modifiedRange=null;

var STRUCT_TAGS=['SUP','SUB'];
var STRUCT_CLASSES=['fraction','num','den','sqrt','sqrt-content'];

var TEMPLATES={};

TEMPLATES.math='<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n<style>\nbody{font-family:"Times New Roman","Microsoft YaHei",serif;padding:30px 40px;max-width:750px;margin:0 auto;color:#333;line-height:1.8;}\nh1{font-size:22px;text-align:center;border-bottom:2px solid #333;padding-bottom:12px;margin-bottom:24px;}\n.question{margin-bottom:16px;font-size:14px;}\n.answer-line{border-bottom:1px solid #999;width:150px;display:inline-block;margin:0 5px;}\n.box{border:1px solid #ccc;padding:10px;border-radius:4px;margin-top:8px;background:#f9f9f9;}\n.formula-block{text-align:center;margin:16px 0;font-size:18px;font-style:italic;padding:12px;background:#fafafa;border-radius:6px;border:1px solid #eee;}\nsub,sup{font-size:0.7em;}\n.fraction{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;}\n.fraction .num{border-bottom:1px solid #333;padding:0 5px 3px;text-align:center;min-width:20px;}\n.fraction .den{padding:3px 5px 0;text-align:center;}\n.sqrt-wrap{display:inline-flex;align-items:baseline;margin:0 2px;}\n.sqrt-prefix{font-size:1.3em;line-height:1;position:relative;}\n.sqrt-line{position:absolute;bottom:-2px;left:0;width:100%;height:1px;background:#333;transform:rotate(-15deg);transform-origin:left bottom;}\n.sqrt-content{bargin-left:3px;padding:0 2px;border-top:1px solid #333;}\n</style>\n</head>\n<body>\n<h1>数学公式编辑测试</h1>\n\n<div class="question"><strong>一、一元二次方程</strong></div>\n<div class="question">1. 解方程：x<sup>2</sup> - 5x + 6 = 0</div>\n<div class="formula-block">x = <span class="fraction"><span class="num">-b ± √(b<sup>2</sup>-4ac)</span><span class="den">2a</span></span></div>\n\n<div class="question">2. 求根公式中，当 Δ = b<sup>2</sup>-4ac &gt; 0 时，方程有两个不相等的实数根。</div>\n<div class="formula-block">Δ = (-5)<sup>2</sup> - 4×1×6 = 25 - 24 = 1 &gt; 0</div>\n\n<div class="question"><strong>二、三角函数</strong></div>\n<div class="question">3. 已知 sin θ = <span class="fraction"><span class="num">3</span><span class="den">5</span></span>，求 cos θ 的值。</div>\n<div class="formula-block">cos<sup>2</sup>θ + sin<sup>2</sup>θ = 1 → cos θ = <span class="fraction"><span class="num">4</span><span class="den">5</span></span></div>\n\n<div class="question">4. 勾股定理：在直角三角形中，a<sup>2</sup> + b<sup>2</sup> = c<sup>2</sup></div>\n<div class="formula-block">勾股定理：a<sup>2</sup> + b<sup>2</sup> = c<sup>2</sup></div>\n<div class="formula-block">求平方根：<span class="sqrt-wrap"><span class="sqrt-prefix\">√<span class="sqrt-line"></span></span><span class="sqrt-content">25</span></span> = 5</div>\n\n<div class="question"><strong>三、微积分</strong></div>\n<div class="question">5. 求函数 f(x) = x<sup>3</sup> 的导数：</div>\n<div class="formula-block">f\'(x) = 3x<sup>2</sup></div>\n\n<div class="question">6. 求定积分：</div>\n<div class="formula-block">∫₀¹ x<sup>2</sup> dx = <span class="fraction"><span class="num">1</span><span class="den">3</span></span>x<sup>3</sup> |₀¹ = <span class="fraction"><span class="num">1</span><span class="den">3</span></span></div>\n\n<div class="question"><strong>四、填空题</strong></div>\n<div class="question">7. 若 log₂8 = <span class="answer-line"></span></div>\n<div class="question">8. 2<sup>10</sup> = <span class="answer-line"></span></div>\n<div class="question">9. 圆的面积公式 S = π<span class="answer-line"></span><sup>2</sup></div>\n\n<div class="box" style="margin-top:24px;">💡 <strong>测试提示：</strong>试试点击上标数字（如 x² 中的 2）进行编辑，删除后重新输入，新内容会保持上标格式。</div>\n</body>\n</html>';

TEMPLATES.table='<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n<style>\nbody{font-family:"Microsoft YaHei",sans-serif;padding:30px 40px;max-width:800px;margin:0 auto;color:#333;line-height:1.8;}\nh1{font-size:22px;text-align:center;border-bottom:2px solid #2c3e50;padding-bottom:12px;margin-bottom:24px;}\nh3{font-size:16px;color:#2c3e50;margin:24px 0 12px;}\ntable{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px;}\nth{background:#2c3e50;color:#fff;padding:10px 14px;text-align:center;border:1px solid #1a252f;font-weight:600;}\ntd{padding:9px 14px;border:1px solid #ddd;text-align:center;}\ntr:nth-child(even){background:#f8f9fa;}\n.highlight-cell{background:#fff3cd;font-weight:bold;}\n.total-row{background:#e8f4fd;font-weight:bold;}\n.nested-table{width:100%;border-collapse:collapse;font-size:11px;margin:5px 0;}\n.nested-table th{background:#3498db;padding:5px 8px;font-size:10px;}\n.nested-table td{padding:4px 8px;border:1px solid #ddd;font-size:10px;}\n</style>\n</head>\n<body>\n<h1>表格编辑测试</h1>\n\n<h3>📊 成绩表</h3>\n<table>\n<tr><th>姓名</th><th>语文</th><th>数学</th><th>英语</th><th>总分</th><th>排名</th></tr>\n<tr><td>张三</td><td class="highlight-cell">95</td><td>88</td><td>92</td><td>275</td><td>1</td></tr>\n<tr><td>李四</td><td>87</td><td class="highlight-cell">98</td><td>85</td><td>270</td><td>2</td></tr>\n<tr><td>王五</td><td>90</td><td>82</td><td class="highlight-cell">96</td><td>268</td><td>3</td></tr>\n<tr class="total-row"><td>平均分</td><td>90.7</td><td>89.3</td><td>91.0</td><td>271.0</td><td>-</td></tr>\n</table>\n\n<h3>📋 课程表</h3>\n<table>\n<tr><th>节次</th><th>时间</th><th>周一</th><th>周二</th><th>周三</th><th>周四</th><th>周五</th></tr>\n<tr><td>1</td><td>8:00-8:45</td><td>语文</td><td>数学</td><td>英语</td><td>物理</td><td>化学</td></tr>\n<tr><td>2</td><td>8:55-9:40</td><td>数学</td><td>英语</td><td>语文</td><td>数学</td><td>语文</td></tr>\n<tr><td>3</td><td>10:00-10:45</td><td>英语</td><td>物理</td><td>数学</td><td>语文</td><td>英语</td></tr>\n<tr><td>4</td><td>10:55-11:40</td><td>物理</td><td>化学</td><td>体育</td><td>英语</td><td>数学</td></tr>\n</table>\n\n<h3>🔧 嵌套表格</h3>\n<table>\n<tr><th>项目</th><th>详情</th><th>状态</th></tr>\n<tr><td>前端开发</td><td>\n<table class="nested-table">\n<tr><th>模块</th><th>进度</th></tr>\n<tr><td>首页</td><td>90%</td></tr>\n<tr><td>用户中心</td><td>75%</td></tr>\n<tr><td>设置页</td><td>60%</td></tr>\n</table>\n</td><td>进行中</td></tr>\n<tr><td>后端开发</td><td>\n<table class="nested-table">\n<tr><th>模块</th><th>进度</th></tr>\n<tr><td>API</td><td>85%</td></tr>\n<tr><td>数据库</td><td>100%</td></tr>\n</table>\n</td><td>进行中</td></tr>\n</table>\n\n<div style="margin-top:24px;padding:14px;background:#f8f9fa;border-radius:8px;font-size:13px;">💡 <strong>测试提示：</strong>试试点击表格中的单元格直接编辑分数、姓名、课程名等。嵌套表格也可以编辑。</div>\n</body>\n</html>';

ss="num">7</span><span class="den">2</span></span> &nbsp;&nbsp; B. (x-4)<sup>2</sup>=<span class="fraction"><span class="num">15</span><span class="den">2</span></span> &nbsp;&nbsp; C. (x-2)<sup>2</sup>=<span class="fraction"><span class="num">15</span><span class="den">2</span></span> &nbsp;&nbsp; D. (x-4)<sup>2</sup>=<span class="fraction"><span class="num">7</span><span class="den">2</span></span></p>\n\n<h2>二、填空题（每题3分，共18分）</h2>\n<p>3. 方程 x<sup>2</sup>=9 的解为<span class="answer-line"></span></p>\n<p>4. 若 x=2 是方程 x<sup>2</sup>-ax+2=0 的一个根，则 a=<span class="answer-line"></span></p>\n\n<h2>三、解答题</h2>\n<p><strong>5.</strong>（8分）解方程：x<sup>2</sup>-5x+6=0</p>\n<div class="formula-block">x = <span class="fraction"><span class="num">5 ± √(25-24)</span><span class="den">2</span></span> = <span class="fraction"><span class="num">5 ± 1</span><span class="den">2</span></span></div>\n<div class="box">解：x<sub>1</sub>=3, x<sub>2</sub>=2</div>\n\n<p><strong>6.</strong>（10分）某商品原价200元，连续两次降价后为162元，求降价百分率。</p>\n<div class="formula-block">200 × (1-x)<sup>2</sup> = 162 → (1-x)<sup>2</sup> = 0.81 → 1-x = 0.9 → x = 10%</div>\n<div class="box">解：降价百分率为10%</div>\n\n<h2>四、成绩统计</h2>\n<table>\n<tr><th>学生</th><th>选择题</th><th>填空题</th><th>解答题</th><th>总分</th></tr>\n<tr><td>张三</td><td>18</td><td>15</td><td>40</td><td>73</td></tr>\n<tr><td>李四</td><td>15</td><td>18</td><td>45</td><td>78</td></tr>\n<tr><td>王五</td><td>12</td><td>12</td><td>35</td><td>59</td></tr>\n</table>\n\n<div style="margin-top:24px;padding:14px;background:#f8f9fa;border-radius:8px;font-size:13px;">💡 <strong>测试提示：</strong>这是综合测试，包含公式、表格、填空线、分数等。试试编辑上标（如 x² 中的 2）和表格数据。</div>\n</body>\n</html>';

TEMPLATES.katex='<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">\n<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"><\/script>\n<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"><\/script>\n<style>\nbody{font-family:"Microsoft YaHei","Times New Roman",serif;padding:30px 40px;max-width:750px;margin:0 auto;color:#333;line-height:1.8;}\nh1{font-size:22px;text-align:center;border-bottom:2px solid #2c3e50;padding-bottom:12px;margin-bottom:24px;}\nh2{font-size:16px;color:#2c3e50;margin:24px 0 12px;}\n.formula-area{margin:14px 0;padding:14px 16px;background:#fafafa;border-radius:8px;border:1px solid #eee;}\n</style>\n</head>\n<body>\n<h1>KaTeX公式编辑测试</h1>\n\n<h2>📐 基础公式</h2>\n<div class="formula-area">一元二次方程求根公式：$$x = \\frac{-b \\pm \\sqrt{b^2-4ac}}{2a}$$</div>\n\n<div class="formula-area">欧拉公式：$$e^{i\\pi} + 1 = 0$$</div>\n\n<div class="formula-area">勾股定理：$$a^2 + b^2 = c^2$$</div>\n\n<h2>📊 积分与极限</h2>\n<div class="formula-area">定积分：$$\\int_0^1 x^2 \\, dx = \\frac{1}{3}$$</div>\n\n<div class="formula-area">极限：$$\\lim_{n \\to \\infty} \\frac{1}{n} = 0$$</div>\n\n<div class="formula-area">求和：$$\\sum_{i=1}^{n} i = \\frac{n(n+1)}{2}$$</div>\n\n<h2>🧮 矩阵</h2>\n<div class="formula-area">$$\\begin{pmatrix} a & b \\\\ c & d \\end{pmatrix}$$</div>\n\n<h2>📝 行内公式</h2>\n<p>已知函数 $f(x) = x^2 + 2x + 1$，求 $f\'(x)$ 的值。</p>\n<p>当 $x = 3$ 时，$f(3) = 9 + 6 + 1 = 16$。</p>\n\n<div style="margin-top:24px;padding:14px;background:#fff3cd;border-radius:8px;font-size:13px;">⚠️ <strong>重要提示：</strong>KaTeX渲染的公式是特殊的DOM结构，直接点击编辑可能导致公式结构破坏。建议只编辑公式外的普通文字，公式部分通过代码编辑器修改LaTeX源码。</div>\n\n<script>\nrenderMathInElement(document.body, {\ndelimiters: [\n{left: "$$", right: "$$", display: true},\n{left: "$", right: "$", display: false}\n]\n});\n<\/script>\n</body>\n</html>';

function resetTestDots(){
    ['testText','testFormula','testTable','testSvg','testList','testStyle'].forEach(function(id){
        document.getElementById(id).className='test-dot pending';
    });
}

function updateSyncInfo(direction){
    syncCount++;
    syncDirection.textContent=direction;
    syncCountEl.textContent='同步次数：'+syncCount;
}

function isStructElement(el){
    if(!el)return false;
    if(STRUCT_TAGS.indexOf(el.tagName)!==-1)return true;
    if(el.classList){
        for(var i=0;i<STRUCT_CLASSES.length;i++){
            if(el.classList.contains(STRUCT_CLASSES[i]))return true;
        }
    }
    return false;
}

function protectStructure(doc){
    var sups=doc.querySelectorAll('sup, sub');
    sups.forEach(function(el){
        var text=el.textContent;
        if(text.length===0||text===ZWSP){
            el.textContent=ZWSP;
        }
    });
    var fracs=doc.querySelectorAll('.fraction .num, .fraction .den');
    fracs.forEach(function(el){
        var text=el.textContent;
        if(text.length===0||text===ZWSP){
            el.textContent=ZWSP;
        }
    });
}

function setupMutationGuard(doc){
    var observer=new MutationObserver(function(mutations){
        mutations.forEach(function(m){
            if(m.type==='childList'){
                m.removedNodes.forEach(function(node){
                    if(node.nodeType===1&&isStructElement(node)){
                        var parent=m.target;
                        if(parent&&parent.nodeType===1){
                            var restored=node.cloneNode(true);
                            if(restored.textContent.length===0){
                                restored.textContent=ZWSP;
                            }
                            if(m.nextSibling){
                                parent.insertBefore(restored,m.nextSibling);
                            }else{
                                parent.appendChild(restored);
                            }
                        }
                    }
                });
            }
            if(m.type==='characterData'){
                var parent=m.target.parentElement;
                if(parent&&isStructElement(parent)){
                    if(parent.textContent.length===0){
                        parent.textContent=ZWSP;
                    }
                }
            }
        });
    });
    observer.observe(doc.body,{
        childList:true,
        subtree:true,
        characterData:true
    });
    return observer;
}

function setupBeforeInputGuard(doc){
    doc.addEventListener('beforeinput',function(e){
        var sel=doc.getSelection();
        if(!sel||sel.rangeCount===0)return;
        var range=sel.getRangeAt(0);
        var container=range.commonAncestorContainer;
        var el=container.nodeType===3?container.parentElement:container;
        while(el&&el!==doc.body){
            if(isStructElement(el)){
                if(e.inputType==='deleteContentBackward'||e.inputType==='deleteContentForward'||e.inputType==='deleteContent'){
                    var text=el.textContent;
                    if(text.length<=1||(text.length===1&&text===ZWSP)){
                        e.preventDefault();
                        el.textContent=ZWSP;
                        sel.collapse(el,0);
                        sel.modify('move','forward','character');
                        return;
                    }
                }
                break;
            }
            el=el.parentElement;
        }
    },true);
}

function highlightHTML(html){
    var result='';
    var i=0;
    var len=html.length;
    while(i<len){
        if(html[i]==='<'&&html.substr(i,4)==='<!--'){
            var end=html.indexOf('-->',i);
            if(end===-1)end=len;
            else end+=3;
            result+='<span class="token-comment">'+escapeHtml(html.substring(i,end))+'</span>';
            i=end;
        }else if(html[i]==='<'&&html.substr(i,9)==='<!DOCTYPE'){
            var end=html.indexOf('>',i);
            if(end===-1)end=len;
            else end++;
            result+='<span class="token-doctype">'+escapeHtml(html.substring(i,end))+'</span>';
            i=end;
        }else if(html[i]==='<'){
            var end=html.indexOf('>',i);
            if(end===-1)end=len;
            else end++;
            result+=highlightTag(html.substring(i,end));
            i=end;
        }else{
            var end=html.indexOf('<',i);
            if(end===-1)end=len;
            var text=html.substring(i,end);
            if(text.trim()){
                result+='<span class="token-text">'+escapeHtml(text)+'</span>';
            }else{
                result+=escapeHtml(text);
            }
            i=end;
        }
    }
    return result;
}

function escapeHtml(text){
    return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlightTag(tag){
    var result='<span class="token-tag">&lt;';
    var m=tag.match(/^<(\/?)([a-zA-Z0-9_\-]+)/);
    if(m){
        result+=m[1]+m[2];
        var rest=tag.substring(m[0].length);
        rest=rest.replace(/\s([a-zA-Z0-9_\-]+)(?:\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+)))?/g,function(match,name,double,single,unquoted){
            var attr=' <span class="token-attr">'+name+'</span>';
            var val=double||single||unquoted;
            if(val!==undefined){
                attr+='=<span class="token-string">'+(double?'"'+double+'"':single?"'"+single+"'":val)+'</span>';
            }
            return attr;
        });
        result+=rest.replace(/>/g,'&gt;');
    }else{
        result+=escapeHtml(tag.substring(1));
    }
    return result+'</span>';
}

function updateHighlight(){
    highlightLayer.innerHTML=highlightHTML(htmlEditor.value);
    syncScroll();
}

function syncScroll(){
    highlightLayer.scrollTop=htmlEditor.scrollTop;
    highlightLayer.scrollLeft=htmlEditor.scrollLeft;
}

function findDiff(oldStr,newStr){
    var oldLines=oldStr.split('\n');
    var newLines=newStr.split('\n');
    var start=-1,end=-1;
    for(var i=0;i<Math.min(oldLines.length,newLines.length);i++){
        if(oldLines[i]!==newLines[i]){
            if(start===-1)start=i;
            end=i;
        }
    }
    if(start===-1){
        if(newLines.length>oldLines.length){
            start=oldLines.length;
            end=newLines.length-1;
        }
    }else if(newLines.length>oldLines.length){
        end=newLines.length-1;
    }
    if(start!==-1){
        return {start:start,end:end};
    }
    return null;
}

function scrollToLine(lineNum){
    var lineHeight=1.7*13;
    var targetScrollTop=lineNum*lineHeight;
    htmlEditor.scrollTop=targetScrollTop - (htmlEditor.clientHeight/2);
    highlightLayer.scrollTop=htmlEditor.scrollTop;
}

function highlightModifiedRange(range){
    if(!range)return;
    updateHighlight();
    var lines=htmlEditor.value.split('\n');
    var newHtml='';
    for(var i=0;i<lines.length;i++){
        if(i>=range.start&&i<=range.end){
            newHtml+='<span class="highlight-modified">'+highlightHTML(lines[i])+'</span>';
        }else{
            newHtml+=highlightHTML(lines[i]);
        }
        if(i<lines.length-1)newHtml+='\n';
    }
    highlightLayer.innerHTML=newHtml;
}

var currentObserver=null;

function updatePreview(){
    if(isSyncing)return;
    isSyncing=true;
    try{
        if(currentObserver){
            currentObserver.disconnect();
            currentObserver=null;
        }
        var code=htmlEditor.value;
        var doc=previewFrame.contentDocument||previewFrame.contentWindow.document;
        doc.open();
        doc.write(code);
        doc.close();
        protectStructure(doc);
        applyEditMode();
        updateSyncInfo('代码 → 预览');
        runTests();
    }catch(e){}
    setTimeout(function(){isSyncing=false;},150);
}

function toggleEditMode(){
    isEditMode=!isEditMode;
    if(isEditMode){
        editBtn.textContent='🔒 禁用编辑';
        editBtn.classList.remove('inactive');
        modeHint.textContent='编辑模式 - 点击可编辑';
    }else{
        editBtn.textContent='🔓 启用编辑';
        editBtn.classList.add('inactive');
        modeHint.textContent='预览模式 - 无法编辑';
    }
    applyEditMode();
}

function applyEditMode(){
    try{
        var doc=previewFrame.contentDocument||previewFrame.contentWindow.document;
        if(!doc||!doc.body)return;
        if(isEditMode){
            doc.body.contentEditable=true;
            doc.body.style.outline='none';
            doc.body.style.cursor='text';
            doc.body.style.userSelect='text';
            var allEls=doc.body.querySelectorAll('*');
            for(var i=0;i<allEls.length;i++){
                allEls[i].contentEditable='inherit';
            }
            setupBeforeInputGuard(doc);
            if(currentObserver)currentObserver.disconnect();
            currentObserver=setupMutationGuard(doc);
            bindPreviewEvents();
        }else{
            doc.body.contentEditable=false;
            doc.body.style.cursor='default';
            doc.body.style.userSelect='default';
            if(currentObserver){
                currentObserver.disconnect();
                currentObserver=null;
            }
            bindPreviewEvents();
            var allEls=doc.body.querySelectorAll('*');
            for(var i=0;i<allEls.length;i++){
                allEls[i].contentEditable='false';
            }
        }
    }catch(e){}
}

editBtn.addEventListener('click',toggleEditMode);

function updateEditorFromPreview(){
    if(isSyncing||!isEditMode)return;
    isSyncing=true;
    try{
        var doc=previewFrame.contentDocument||previewFrame.contentWindow.document;
        protectStructure(doc);
        var editedHtml=doc.documentElement.outerHTML;
        var cleaned=editedHtml.replace(/\u200B/g,'');
        var currentCleaned=htmlEditor.value.replace(/\u200B/g,'');
        if(cleaned&&cleaned!==currentCleaned){
            var oldHtml=htmlEditor.value;
            var fullHtml='<!DOCTYPE html>\n'+editedHtml;
            htmlEditor.value=fullHtml;
            var diffRange=findDiff(oldHtml,fullHtml);
            if(diffRange){
                scrollToLine(diffRange.start);
                highlightModifiedRange(diffRange);
                setTimeout(function(){
                    if(modifiedRange){
                        updateHighlight();
                        modifiedRange=null;
                    }
                },2000);
                modifiedRange=diffRange;
            }else{
                updateHighlight();
            }
            updateSyncInfo('预览 → 代码');
        }
    }catch(e){}
    setTimeout(function(){isSyncing=false;},150);
}

function bindPreviewEvents(){
    try{
        var doc=previewFrame.contentDocument||previewFrame.contentWindow.document;
        var body=doc.body;
        body.removeEventListener('input',onPreviewInput);
        body.removeEventListener('blur',onPreviewBlur);
        if(isEditMode){
            body.addEventListener('input',onPreviewInput);
            body.addEventListener('blur',onPreviewBlur);
        }
    }catch(e){}
}

function onPreviewInput(e){
    if(!isEditMode)return;
    clearTimeout(previewTimer);
    previewTimer=setTimeout(function(){updateEditorFromPreview();},300);
}

function onPreviewBlur(e){
    if(!isEditMode)return;
    clearTimeout(previewTimer);
    updateEditorFromPreview();
}

htmlEditor.addEventListener('input',function(){
    clearTimeout(editorTimer);
    updateHighlight();
    editorTimer=setTimeout(updatePreview,400);
});

htmlEditor.addEventListener('scroll',syncScroll);


function runTests(){
    try{
        var doc=previewFrame.contentDocument||previewFrame.contentWindow.document;
        var body=doc.body;
        setDot('testText',body&&body.contentEditable==='true'?'pass':'fail');
        setDot('testFormula',doc.querySelector('.fraction,.formula-block,sup,sub')?'pass':'pending');
        setDot('testTable',doc.querySelector('table')?'pass':'pending');
        setDot('testSvg',doc.querySelector('svg')?'pass':'pending');
        setDot('testList',doc.querySelector('ol,ul,dl')?'pass':'pending');
        setDot('testStyle',doc.querySelector('style')?'pass':'pending');
    }catch(e){}
}

function setDot(id,status){
    var el=document.getElementById(id);
    if(el)el.className='test-dot '+status;
}

TEMPLATES.animation='<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n<style>\n*{box-sizing:border-box}\nbody{font-family:"Microsoft YaHei",sans-serif;padding:40px;max-width:900px;margin:0 auto;color:#333;background:#f5f7fa}\nh2{font-size:18px;margin:32px 0 16px}\n.demo-box{width:100px;height:100px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:32px;margin:20px auto}\n.demo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}\n.demo-card{background:#fff;border-radius:12px;padding:24px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.04)}\n.demo-label{font-size:13px;color:#666;margin-top:16px}\n\n@keyframes fadeIn{from{opacity:0}to{opacity:1}}\n@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}\n@keyframes scaleIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}\n@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}\n@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}\n@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}\n\n.box-fade{animation:fadeIn 1s ease}\n.box-slide{animation:slideUp 1s ease}\n.box-scale{animation:scaleIn .8s ease}\n.box-bounce{animation:bounce 1s ease infinite}\n.box-spin{animation:spin 2s linear infinite}\n.box-pulse{animation:pulse 1.5s ease-in-out infinite}\n\n.transition-demo{background:#4a90d9;color:#fff;cursor:pointer;transition:all .3s}\n.transition-demo:hover{background:#52c41a;transform:scale(1.1);box-shadow:0 8px 24px rgba(0,0,0,.2)}\n\n.shadow-demo{background:#fff;transition:all .3s}\n.shadow-demo:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,.15)}\n</style>\n</head>\n<body>\n<h2>CSS 动画效果</h2>\n<div class="demo-grid">\n<div class="demo-card"><div class="demo-box box-fade" style="background:linear-gradient(135deg,#667eea,#764ba2);color:#fff">1</div><div class="demo-label">淡入 Fade In</div></div>\n<div
