<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HTML → PDF 方案对比测试</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/modern-screenshot@4.4.39/dist/index.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        :root{--bg:#0f0f0f;--surface:#1a1a1a;--surface2:#242424;--border:#333;--text:#e6e6e6;--text2:#999;--accent:#4a9eff;--accent2:#3d8bfd;--success:#28a745;--error:#dc3545;--radius:10px;}
        html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;}
        .app{display:flex;flex-direction:column;height:100vh;height:100dvh;}
        .header{padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0;}
        .header h1{font-size:15px;font-weight:600;color:var(--accent);white-space:nowrap;}
        .header .badge{font-size:11px;background:var(--accent);color:#fff;padding:2px 8px;border-radius:10px;white-space:nowrap;}
        .main{flex:1;display:flex;overflow:hidden;min-height:0;}
        .editor-panel{width:50%;display:flex;flex-direction:column;border-right:1px solid var(--border);min-width:0;}
        .preview-panel{width:50%;display:flex;flex-direction:column;min-width:0;}
        .panel-header{padding:6px 12px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:12px;font-weight:500;color:var(--text2);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
        .panel-header .label{color:var(--text);font-weight:600;}
        #htmlEditor{flex:1;width:100%;background:#111;color:#d4d4d4;border:none;padding:12px;font-family:"SF Mono","Fira Code",Menlo,Monaco,monospace;font-size:12px;line-height:1.5;resize:none;outline:none;tab-size:2;}
        #previewFrame{flex:1;width:100%;border:none;}
        .templates-bar{padding:8px 12px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;}
        .templates-bar h3{font-size:11px;color:var(--text2);margin-bottom:6px;}
        .templates-scroll{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
        .templates-scroll::-webkit-scrollbar{height:4px;}
        .templates-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
        .tpl-btn{flex-shrink:0;padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--text);font-size:11px;cursor:pointer;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:4px;}
        .tpl-btn:hover{border-color:var(--accent);background:rgba(74,158,255,.1);}
        .tpl-btn:active{transform:scale(.96);}
        .tpl-btn.active{border-color:var(--accent);background:rgba(74,158,255,.15);color:var(--accent);}
        .tpl-btn .icon{font-size:13px;}
        .methods-bar{padding:8px 12px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;overflow-y:auto;max-height:200px;}
        .methods-bar h3{font-size:11px;color:var(--text2);margin-bottom:6px;position:sticky;top:0;background:var(--surface);z-index:1;}
        .methods-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
        .method-btn{padding:6px 4px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface2);color:var(--text);font-size:10px;font-weight:500;cursor:pointer;transition:all .15s;text-align:center;line-height:1.3;}
        .method-btn:hover{border-color:var(--accent);background:rgba(74,158,255,.1);}
        .method-btn:active{transform:scale(.97);}
        .method-btn .num{display:inline-block;width:16px;height:16px;line-height:16px;border-radius:50%;background:var(--accent);color:#fff;font-size:9px;margin-right:3px;}
        .method-btn .desc{display:block;font-size:8px;color:var(--text2);margin-top:1px;}
        .method-btn.reliable{border-color:#28a745;}
        .method-btn.reliable .num{background:#28a745;}
        .status-bar{padding:5px 12px;background:var(--surface2);border-top:1px solid var(--border);font-size:11px;color:var(--text2);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
        .status-bar .status-dot{width:6px;height:6px;border-radius:50%;background:var(--success);display:inline-block;margin-right:6px;}
        .toast-container{position:fixed;top:16px;right:16px;z-index:10000;display:flex;flex-direction:column;gap:8px;}
        .toast{padding:10px 16px;border-radius:var(--radius);font-size:13px;color:#fff;animation:toastIn .3s ease;max-width:320px;word-break:break-word;}
        .toast.info{background:var(--accent2);}
        .toast.success{background:var(--success);}
        .toast.error{background:var(--error);}
        .toast.warning{background:#e67e22;}
        @keyframes toastIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
        @media(max-width:768px){.main{flex-direction:column;}.editor-panel,.preview-panel{width:100%;height:50%;}.editor-panel{border-right:none;border-bottom:1px solid var(--border);}.methods-grid{grid-template-columns:repeat(2,1fr);}}
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1>HTML → PDF 方案对比测试</h1>
        <span class="badge">10 方案 · 14 模板</span>
    </div>
    <div class="main">
        <div class="editor-panel">
            <div class="panel-header"><span class="label">HTML 编辑器</span><span id="charCount" style="font-size:10px;">0 字符</span></div>
            <textarea id="htmlEditor" spellcheck="false"></textarea>
            <div class="templates-bar">
                <h3>📋 预制文档模板（点击加载）：</h3>
                <div class="templates-scroll" id="templatesScroll"></div>
            </div>
        </div>
        <div class="preview-panel">
            <div class="panel-header"><span class="label">实时预览</span><span id="currentTpl" style="font-size:10px;color:var(--accent);"></span></div>
            <iframe id="previewFrame"></iframe>
            <div class="methods-bar">
                <h3>🔧 导出方案（🟢=可靠 🟡=一般 🔴=有限制）：</h3>
                <div class="methods-grid">
                    <button class="method-btn reliable" onclick="exportMethod1()"><span class="num">1</span>iframe渲染+jsPDF<span class="desc">🟢 所见即所得·最可靠</span></button>
                    <button class="method-btn reliable" onclick="exportMethod2()"><span class="num">2</span>html2pdf.js<span class="desc">🟢 所见即所得·分页</span></button>
                    <button class="method-btn reliable" onclick="exportMethod3()"><span class="num">3</span>pdf-lib+Canvas<span class="desc">🟢 所见即所得·底层</span></button>
                    <button class="method-btn reliable" onclick="exportMethod4()"><span class="num">4</span>modern-screenshot<span class="desc">🟢 所见即所得·高质量</span></button>
                    <button class="method-btn" onclick="exportMethod5()"><span class="num">5</span>iframe打印<span class="desc">🟡 所见即所得·打印</span></button>
                    <button class="method-btn" onclick="exportMethod6()"><span class="num">6</span>新窗口打印<span class="desc">🟡 所见即所得·弹窗</span></button>
                    <button class="method-btn" onclick="exportMethod7()"><span class="num">7</span>图片导出PDF<span class="desc">🟢 所见即所得·高清</span></button>
                    <button class="method-btn" onclick="exportMethod8()"><span class="num">8</span>纯Canvas绘制<span class="desc">🟡 所见即所得·直绘</span></button>
                    <button class="method-btn" onclick="exportMethod9()"><span class="num">9</span>双iframe隔离<span class="desc">🟢 所见即所得·双重隔离</span></button>
                    <button class="method-btn" onclick="exportMethod10()"><span class="num">10</span>srcdoc直出<span class="desc">🟢 所见即所得·直出</span></button>
                </div>
            </div>
        </div>
    </div>
    <div class="status-bar"><span><span class="status-dot"></span>就绪</span><span id="statusText">选择模板 → 预览 → 选择方案导出</span></div>
</div>
<div class="toast-container" id="toastContainer"></div>

<script>
var htmlEditor = document.getElementById('htmlEditor');
var previewFrame = document.getElementById('previewFrame');
var charCount = document.getElementById('charCount');
var statusText = document.getElementById('statusText');
var currentTpl = document.getElementById('currentTpl');
var templatesScroll = document.getElementById('templatesScroll');

var TEMPLATES = [
    {id:'math',icon:'📐',name:'数学练习题'},{id:'chinese',icon:'📝',name:'语文生字词'},
    {id:'poster',icon:'🎨',name:'活动海报'},{id:'legal',icon:'⚖️',name:'法律文书'},
    {id:'resume',icon:'👤',name:'个人简历'},{id:'invoice',icon:'🧾',name:'发票收据'},
    {id:'contract',icon:'📜',name:'合同模板'},{id:'exam',icon:'📋',name:'考试试卷'},
    {id:'recipe',icon:'🍳',name:'美食食谱'},{id:'meeting',icon:'📅',name:'会议纪要'},
    {id:'paper',icon:'🎓',name:'学术论文'},{id:'schedule',icon:'🗓️',name:'课程表'},
    {id:'dark',icon:'🌙',name:'深色背景'},{id:'gradient',icon:'🌈',name:'渐变背景'}
];

var SAMPLES = {};

SAMPLES.math = '<!DOCTYPE html>\n<html><head><meta charset="UTF-8"><title>数学练习题</title>\n<style>\nbody{font-family:"Times New Roman",serif;padding:40px;max-width:800px;margin:0 auto;color:#333;}\n.header{text-align:center;border-bottom:2px solid #333;padding-bottom:15px;margin-bottom:25px;}\n.header h1{font-size:22px;margin-bottom:5px;}\n.header p{font-size:13px;color:#666;}\n.info{display:flex;justify-content:space-between;margin-bottom:20px;font-size:13px;border-bottom:1px dashed #ccc;padding-bottom:10px;}\n.question{margin-bottom:22px;line-height:1.8;}\n.question .q-num{font-weight:bold;margin-right:5px;}\n.question .q-score{float:right;font-size:12px;color:#999;}\n.answer-line{border-bottom:1px solid #999;width:200px;display:inline-block;margin:0 5px;}\n.grid-4{display:grid;grid-template-columns:1fr 1fr;gap:15px;}\n.box{border:1px solid #ccc;padding:10px;border-radius:4px;margin-top:8px;}\n.footer{margin-top:30px;text-align:center;font-size:12px;color:#999;border-top:1px solid #ccc;padding-top:10px;}\n</style></head><body>\n<div class="header">\n<h1>八年级数学期中练习题</h1>\n<p>考试时间：90分钟 | 满分：100分</p>\n</div>\n<div class="info">\n<span>姓名：__________</span>\n<span>班级：__________</span>\n<span>学号：__________</span>\n<span>得分：__________</span>\n</div>\n<div class="question"><span class="q-num">一、选择题</span><span class="q-score">（每题3分，共18分）</span></div>\n<div class="question">\n1. 下列各式中，属于一元二次方程的是（  ）<br>\nA. x² + 2x - 1 &nbsp;&nbsp; B. x² + 2x = 1 &nbsp;&nbsp; C. x² + 1/x = 0 &nbsp;&nbsp; D. x² + y² = 1\n</div>\n<div class="question">\n2. 一元二次方程 x² - 4x + 3 = 0 的两个根为（  ）<br>\nA. x₁=1, x₂=3 &nbsp;&nbsp; B. x₁=-1, x₂=-3 &nbsp;&nbsp; C. x₁=1, x₂=-3 &nbsp;&nbsp; D. x₁=-1, x₂=3\n</div>\n<div class="question"><span class="q-num">二、填空题</span><span class="q-score">（每题3分，共18分）</span></div>\n<div class="question">4. 方程 x² = 9 的解为<span class="answer-line"></span></div>\n<div class="question">5. 若关于 x 的方程 x² + 2x + k = 0 有两个不相等的实数根，则 k 的取值范围是<span class="answer-line"></span></div>\n<div class="question"><span class="q-num">三、解答题</span><span class="q-score">（共64分）</span></div>\n<div class="question">7.（10分）解下列方程：<br><div class="grid-4"><div class="box">(1) x² - 5x + 6 = 0</div><div class="box">(2) 2x² + 3x - 2 = 0</div></div></div>\n<div class="footer">命题人：数学教研组 | 审核人：教务处 | 2026年春季学期</div>\n</body></html>';

SAMPLES.chinese = '<!DOCTYPE html>\n<html><head><meta charset="UTF-8"><title>语文生字词练习</title>\n<style>\nbody{font-family:"KaiTi","STKaiti",serif;padding:40px;max-width:800px;margin:0 auto;color:#333;background:#fff;}\n.header{text-align:center;border-bottom:3px double #8B4513;padding-bottom:15px;margin-bottom:25px;}\n.header h1{font-size:24px;color:#8B4513;letter-spacing:4px;}\n.header p{font-size:13px;color:#999;}\n.section{margin-bottom:25px;}\n.section h2{font-size:16px;color:#8B4513;border-left:4px solid #8B4513;padding-left:10px;margin-bottom:12px;}\n.word-table{width:100%;border-collapse:collapse;margin-bottom:15px;}\n.word-table th{background:#F5DEB3;color:#8B4513;padding:8px 12px;text-align:center;font-size:14px;border:1px solid #D2B48C;}\n.word-table td{padding:8px 12px;border:1px solid #D2B48C;text-align:center;font-size:15px;}\n.word-table tr:nth-child(even){background:#FFF8DC;}\n.pinyin{color:#B22222;font-size:13px;}\n.idiom-box{display:inline-block;border:2px solid #8B4513;border-radius:8px;padding:8px 16px;margin:5px;font-size:18px;color:#8B4513;background:#FFF8DC;}\n.note{background:#FFF8DC;border:1px solid #D2B48C;border-radius:6px;padding:12px;margin:10px 0;font-size:13px;line-height:1.8;}\n</style></head><body>\n<div class="header"><h1>语文生字生词练习</h1><p>五年级下册 · 第三单元</p></div>\n<div class="section"><h2>一、生字认读</h2>\n<table class="word-table"><tr><th>生字</th><th>拼音</th><th>部首</th><th>笔画</th><th>组词</th><th>组词</th></tr>\n<tr><td style="font-size:22px;">澜</td><td class="pinyin">lán</td><td>氵</td><td>15画</td><td>波澜</td><td>巨澜</td></tr>\n<tr><td style="font-size:22px;">瑕</td><td class="pinyin">xiá</td><td>王</td><td>13画</td><td>瑕疵</td><td>无瑕</td></tr>\n<tr><td style="font-size:22px;">翡</td><td class="pinyin">fěi</td><td>羽</td><td>14画</td><td>翡翠</td><td>翡帷</td></tr>\n</table></div>\n<div class="section"><h2>二、成语积累</h2>\n<div style="text-align:center;"><span class="idiom-box">波澜壮阔</span><span class="idiom-box">峰峦雄伟</span><span class="idiom-box">连绵不断</span></div>\n<div class="note"><strong>词语解释：</strong><br>· 波澜壮阔：比喻声势雄壮浩大。<br>· 峰峦雄伟：山峰连绵，气势雄伟。</div></div>\n</body></html>';

function createRenderIframe(html, width, callback) {

function canvasToPdfPages(canvas, jsPDFConstructor) {
    var imgWidthMm = 190;
    var imgHeightMm = (canvas.height * imgWidthMm) / canvas.width;
    var pdf = new jsPDFConstructor('p', 'mm', 'a4');
    var positionMm = 0;
    var pageHeightMm = 277;
    var remainingHeightMm = imgHeightMm;
    while (remainingHeightMm > 0) {
        var sourceY = positionMm * (canvas.width / imgWidthMm);
        var sourceHeight = pageHeightMm * (canvas.width / imgWidthMm);
        var pageCanvas = document.createElement('canvas');
        pageCanvas.width = canvas.width;
        pageCanvas.height = Math.min(Math.round(sourceHeight), canvas.height - Math.round(sourceY));
        if (pageCanvas.height <= 0) break;
        var ctx = pageCanvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, pageCanvas.width, pageCanvas.height);
        ctx.drawImage(canvas, 0, Math.round(sourceY), pageCanvas.width, pageCanvas.height, 0, 0, pageCanvas.width, pageCanvas.height);
        var pageImgData = pageCanvas.toDataURL('image/jpeg', 0.95);
        if (positionMm > 0) pdf.addPage();
        var pageImgHeightMm = (pageCanvas.height * imgWidthMm) / canvas.width;
        pdf.addImage(pageImgData, 'JPEG', 10, 10, imgWidthMm, pageImgHeightMm);
        remainingHeightMm -= pageHeightMm;
        positionMm += pageHeightMm;
    }
    return pdf;
}

function downloadBlob(blob, filename) {
    if (navigator.share && navigator.canShare && navigator.canShare({files: [new File([blob], filename, {type: blob.type})]})) {
        var file = new File([blob], filename, {type: blob.type});
        navigator.share({files: [file], title: filename}).then(function() { showToast('导出成功', 'success'); }).catch(function(err) { if (err.name !== 'AbortError') fallbackDownload(blob, filename); });
    } else { fallbackDownload(blob, filename); }
}

function fallbackDownload(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    showToast('PDF导出成功', 'success');
}

async function exportMethod1() {

async function exportMethod3() {
    setStatus('方案3: pdf-lib+Canvas 生成中...'); showToast('方案3: 开始生成', 'info');
    try {
        var html = getHtmlContent();
        if (!html.trim()) { showToast('内容为空', 'error'); return; }
        if (typeof PDFLib === 'undefined' || typeof html2canvas === 'undefined') { showToast('库未加载', 'error'); return; }
                createRenderIframe(html, 794, async function(iframe) {
            try {
                var iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                var iframeBody = iframeDoc.body;
                var canvas = await html2canvas(iframeBody, {scale: 2, useCORS: true, logging: false, backgroundColor: '#ffffff', width: 794, windowWidth: 794});
                var imgData = canvas.toDataURL('image/png');
                var imgBytes = await fetch(imgData).then(function(r) { return r.arrayBuffer(); });
                var pdfDoc = await PDFLib.PDFDocument.create();
                var pageWidth = 595.28, pageHeight = 841.89, margin = 28.35;
                var contentWidth = pageWidth - margin * 2, contentHeight = pageHeight - margin * 2;
                var imgAspect = canvas.width / canvas.height;
                var renderWidth = contentWidth, renderHeight = renderWidth / imgAspect;
                var yOffset = 0, totalContentHeight = renderHeight, scale = canvas.width / renderWidth;
                while (yOffset < totalContentHeight) {
                    var page = pdfDoc.addPage([pageWidth, pageHeight]);
                    page.drawRectangle({x: 0, y: 0, width: pageWidth, height: pageHeight, color: PDFLib.rgb(1, 1, 1)});
                    var sliceHeight = Math.min(contentHeight, totalContentHeight - yOffset);
                    var sourceY = yOffset * scale, sourceHeight = sliceHeight * scale;
                    var sliceCanvas = document.createElement('canvas');
                    sliceCanvas.width = canvas.width; sliceCanvas.height = Math.round(sourceHeight);
                    var ctx = sliceCanvas.getContext('2d');
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, sliceCanvas.width, sliceCanvas.height);
                    ctx.drawImage(canvas, 0, Math.round(sourceY), canvas.width, Math.round(sourceHeight), 0, 0, canvas.width, Math.round(sourceHeight));
                    var sliceData = sliceCanvas.toDataURL('image/png');
                    var sliceBytes = await fetch(sliceData).then(function(r) { return r.arrayBuffer(); });
                    var sliceImg = await pdfDoc.embedPng(sliceBytes);
                    page.drawImage(sliceImg, {x: margin, y: pageHeight - margin - sliceHeight, width: renderWidth, height: sliceHeight});
                    yOffset += contentHeight;
                }
                var pdfBytes = await pdfDoc.save();
                var blob = new Blob([pdfBytes], {type: 'application/pdf'});
                downloadBlob(blob, getFilename());
                removeIframe(iframe);
                setStatus('方案3: 导出完成');
            } catch(e) { showToast('方案3失败: ' + e.message, 'error'); removeIframe(iframe); setStatus('方案3: 失败'); }
        });
    } catch(e) { showToast('方案3失败: ' + e.message, 'error'); setStatus('方案3: 失败'); }

async function exportMethod7() {

                createRenderIframe(html, 794, async function(iframe) {
            try {

                var canvas = await html2canvas(iframeBody, {scale: 3, useCORS: true, logging: false, backgroundColor: '#ffffff', width: 794, windowWidth: 794});
