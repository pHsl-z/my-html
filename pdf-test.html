<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HTML → PDF 方案对比测试</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --surface2: #242424;
            --border: #333;
            --text: #e6e6e6;
            --text2: #999;
            --accent: #4a9eff;
            --accent2: #3d8bfd;
            --success: #28a745;
            --warning: #ffc107;
            --error: #dc3545;
            --radius: 10px;
        }
        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
        }
        .header {
            padding: 10px 16px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .header h1 { font-size: 15px; font-weight: 600; color: var(--accent); white-space: nowrap; }
        .header .badge { font-size: 11px; background: var(--accent); color: #fff; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
        .main { flex: 1; display: flex; overflow: hidden; min-height: 0; }
        .editor-panel { width: 50%; display: flex; flex-direction: column; border-right: 1px solid var(--border); min-width: 0; }
        .preview-panel { width: 50%; display: flex; flex-direction: column; min-width: 0; }
        .panel-header {
            padding: 6px 12px;
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            font-weight: 500;
            color: var(--text2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .panel-header .label { color: var(--text); font-weight: 600; }
        #htmlEditor {
            flex: 1;
            width: 100%;
            background: #111;
            color: #d4d4d4;
            border: none;
            padding: 12px;
            font-family: "SF Mono", "Fira Code", "Cascadia Code", Menlo, Monaco, monospace;
            font-size: 12px;
            line-height: 1.5;
            resize: none;
            outline: none;
            tab-size: 2;
        }
        #previewFrame { flex: 1; width: 100%; border: none; background: #fff; }
        .templates-bar {
            padding: 8px 12px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }
        .templates-bar h3 { font-size: 11px; color: var(--text2); margin-bottom: 6px; }
        .templates-scroll {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }
        .templates-scroll::-webkit-scrollbar { height: 4px; }
        .templates-scroll::-webkit-scrollbar-track { background: transparent; }
        .templates-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
        .tpl-btn {
            flex-shrink: 0;
            padding: 5px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface2);
            color: var(--text);
            font-size: 11px;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .tpl-btn:hover { border-color: var(--accent); background: rgba(74,158,255,0.1); }
        .tpl-btn:active { transform: scale(0.96); }
        .tpl-btn.active { border-color: var(--accent); background: rgba(74,158,255,0.15); color: var(--accent); }
        .tpl-btn .icon { font-size: 13px; }
        .methods-bar {
            padding: 8px 12px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }
        .methods-bar h3 { font-size: 11px; color: var(--text2); margin-bottom: 6px; }
        .methods-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .method-btn {
            padding: 6px 4px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface2);
            color: var(--text);
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
            line-height: 1.3;
        }
        .method-btn:hover { border-color: var(--accent); background: rgba(74,158,255,0.1); }
        .method-btn:active { transform: scale(0.97); }
        .method-btn .num {
            display: inline-block;
            width: 16px; height: 16px; line-height: 16px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            font-size: 9px;
            margin-right: 3px;
        }
        .method-btn .desc { display: block; font-size: 8px; color: var(--text2); margin-top: 1px; }
        .status-bar {
            padding: 5px 12px;
            background: var(--surface2);
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .status-bar .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); display: inline-block; margin-right: 6px; }
        .toast-container { position: fixed; top: 16px; right: 16px; z-index: 10000; display: flex; flex-direction: column; gap: 8px; }
        .toast { padding: 10px 16px; border-radius: var(--radius); font-size: 13px; color: #fff; animation: toastIn 0.3s ease; max-width: 320px; word-break: break-word; }
        .toast.info { background: var(--accent2); }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--error); }
        @keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) {
            .main { flex-direction: column; }
            .editor-panel, .preview-panel { width: 100%; height: 50%; }
            .editor-panel { border-right: none; border-bottom: 1px solid var(--border); }
            .methods-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1>HTML → PDF 方案对比测试</h1>
        <span class="badge">6 方案 · 14 模板</span>
    </div>
    <div class="main">
        <div class="editor-panel">
            <div class="panel-header">
                <span class="label">HTML 编辑器</span>
                <span id="charCount" style="font-size:10px;">0 字符</span>
            </div>
            <textarea id="htmlEditor" spellcheck="false"></textarea>
            <div class="templates-bar">
                <h3>📋 预制文档模板（点击加载）：</h3>
                <div class="templates-scroll" id="templatesScroll"></div>
            </div>
        </div>
        <div class="preview-panel">
            <div class="panel-header">
                <span class="label">实时预览</span>
                <span id="currentTpl" style="font-size:10px;color:var(--accent);"></span>
            </div>
            <iframe id="previewFrame"></iframe>
            <div class="methods-bar">
                <h3>🔧 选择导出方案：</h3>
                <div class="methods-grid">
                    <button class="method-btn" onclick="exportMethod1()"><span class="num">1</span>jsPDF+html2canvas<span class="desc">截图式·当前方案</span></button>
                    <button class="method-btn" onclick="exportMethod2()"><span class="num">2</span>html2pdf.js<span class="desc">封装库·分页优化</span></button>
                    <button class="method-btn" onclick="exportMethod3()"><span class="num">3</span>pdf-lib+Canvas<span class="desc">底层控制·白底强制</span></button>
                    <button class="method-btn" onclick="exportMethod4()"><span class="num">4</span>window.print()<span class="desc">浏览器原生·打印</span></button>
                    <button class="method-btn" onclick="exportMethod5()"><span class="num">5</span>隔离iframe渲染<span class="desc">iframe隔离·白底注入</span></button>
                    <button class="method-btn" onclick="exportMethod6()"><span class="num">6</span>SVG中转方案<span class="desc">DOM→SVG→Canvas→PDF</span></button>
                </div>
            </div>
        </div>
    </div>
    <div class="status-bar">
        <span><span class="status-dot"></span>就绪</span>
        <span id="statusText">选择模板 → 预览 → 选择方案导出</span>
    </div>
</div>
<div class="toast-container" id="toastContainer"></div>

<div class="paper-title">基于深度学习的自然语言处理技术在智能客服系统中的应用研究</div>
<div class="authors">陈思远¹　王晓明²　李华³</div>
<div class="affiliations">¹ 华南理工大学计算机科学与工程学院　² 中山大学人工智能研究院　³ XX科技有限公司</div>

<div class="abstract">
<strong>摘　要：</strong>随着深度学习技术的快速发展，自然语言处理（NLP）在智能客服领域展现出巨大潜力。本文提出了一种基于预训练语言模型与知识图谱融合的智能客服系统架构，通过引入多轮对话管理机制和意图识别优化算法，显著提升了系统的语义理解能力和响应准确率。在真实业务场景的实验中，该系统的意图识别准确率达到94.7%，用户满意度较基线系统提升23.5%。实验结果表明，所提方法在处理复杂多轮对话和领域知识问答方面具有明显优势。
</div>

<div class="keywords"><strong>关键词：</strong> <span>深度学习</span> <span>自然语言处理</span> <span>智能客服</span> <span>预训练模型</span> <span>知识图谱</span> <span>多轮对话</span></div>

<h2>1 引言</h2>
<p>智能客服系统作为人工智能技术的重要应用场景，近年来在电商、金融、医疗等领域得到广泛应用。传统的基于规则和模板的客服系统存在维护成本高、泛化能力弱等问题，难以应对用户日益增长的多样化需求。</p>
<p>近年来，以BERT、GPT为代表的预训练语言模型在NLP领域取得了突破性进展，为智能客服系统的升级提供了新的技术路径。然而，如何有效融合领域知识、处理多轮对话中的上下文依赖，仍是亟待解决的关键问题。</p>

<h2>2 相关工作</h2>
<p>在意图识别方面，Chen等[1]提出了基于注意力机制的BiLSTM模型，在ATIS数据集上取得了96.2%的准确率。Zhang等[2]引入BERT预训练模型，进一步将准确率提升至97.8%。</p>
<p>在对话管理方面，强化学习方法[3]和端到端生成方法[4]各有优劣。前者可控性强但需要大量标注数据，后者灵活但存在生成不一致的问题。</p>

<h2>3 方法</h2>
<h3>3.1 系统架构</h3>
<p>本文提出的系统架构包含三个核心模块：语义理解模块、对话管理模块和知识检索模块。系统整体流程可表示为：</p>
<div class="formula">P(a|s) = softmax(W·[h<sub>t</sub>; k<sub>t</sub>; c<sub>t</sub>] + b)</div>
<p>其中 h<sub>t</sub> 为当前对话状态的隐层表示，k<sub>t</sub> 为知识图谱检索向量，c<sub>t</sub> 为上下文编码向量。</p>

<h3>3.2 意图识别优化</h3>
<p>本文在BERT模型基础上引入领域自适应预训练策略，使用客服领域语料进行继续预训练，损失函数定义为：</p>
<div class="formula">L = L<sub>MLM</sub> + λ·L<sub>intent</sub> + μ·L<sub>KD</sub></div>

<h2>4 实验</h2>
<div class="table-caption">表1　不同方法在测试集上的性能对比</div>
<table class="data-table">
<tr><th>方法</th><th>意图准确率(%)</th><th>实体F1(%)</th><th>响应准确率(%)</th><th>平均响应时间(ms)</th></tr>
<tr><td>Rule-based</td><td>78.3</td><td>72.1</td><td>75.6</td><td>45</td></tr>
<tr><td>BiLSTM+ATT</td><td>89.5</td><td>85.3</td><td>86.2</td><td>120</td></tr>
<tr><td>BERT-base</td><td>93.1</td><td>90.7</td><td>91.5</td><td>280</td></tr>
<tr><td><strong>Ours</strong></td><td><strong>94.7</strong></td><td><strong>92.4</strong></td><td><strong>93.8</strong></td><td>310</td></tr>
</table>

<h2>5 结论</h2>
<p>本文提出了一种融合预训练语言模型与知识图谱的智能客服系统，通过领域自适应预训练和多轮对话管理机制，有效提升了系统的语义理解和响应能力。未来工作将探索多模态信息融合和低资源场景下的模型适配。</p>

<div class="ref">[1] Chen Q, Zhu X, Ling Z H, et al. Enhanced LSTM for natural language inference[C]. ACL, 2017.</div>
<div class="ref">[2] Zhang J, Li H, Zhou Y, et al. Recent advances in NLP pre-training models[J]. AI Review, 2023, 56(3): 2145-2180.</div>
<div class="ref">[3] Li X, Chen Y N, et al. End-to-end task-completion neural dialogue systems[C]. IJCNLP, 2017.</div>
<div class="ref">[4] Roller S, Dinan E, et al. Recipes for building an open-domain chatbot[C]. EACL, 2021.</div>

let activeTplId = null;

function buildTemplateButtons() {

        btn.className = 'tpl-btn';
        btn.dataset.id = tpl.id;

function loadSample(name) {
    htmlEditor.value = SAMPLES[name] || '';
    activeTplId = name;
    document.querySelectorAll('.tpl-btn').forEach(function(b) {
        b.classList.toggle('active', b.dataset.id === name);
    });
    const tpl = TEMPLATES.find(function(t) { return t.id === name; });

    updatePreview();
}

function updatePreview() {
    const code = htmlEditor.value;
    charCount.textContent = code.length + ' 字符';
    try {
        const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
        if ('srcdoc' in previewFrame) { previewFrame.srcdoc = code; }
        else { doc.open(); doc.write(code); doc.close(); }
    } catch(e) {
        previewFrame.src = 'data:text/html;charset=utf-8,' + encodeURIComponent(code);
    }
}

    setTimeout(function() { t.remove(); }, 3000);
}
function setStatus(text) { statusText.textContent = text; }
function getPreviewDoc() { return previewFrame.contentDocument || previewFrame.contentWindow.document; }

function forceWhiteBackground(container) {
    container.querySelectorAll('*').forEach(function(el) {
        const computed = window.getComputedStyle(el);
        const bg = computed.backgroundColor;
        if (bg && bg !== 'rgba(0, 0, 0, 0)' && bg !== 'transparent') {
            const match = bg.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
            if (match) {
                const r = parseInt(match[1]), g = parseInt(match[2]), b = parseInt(match[3]);
                const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
                if (lum < 0.5) {
                    el.style.setProperty('background', '#ffffff', 'important');
                    el.style.setProperty('background-color', '#ffffff', 'important');
                    el.style.setProperty('background-image', 'none', 'important');
                }
            }
        }
        const bgImage = computed.backgroundImage;
        if (bgImage && bgImage !== 'none') { el.style.setProperty('background-image', 'none', 'important'); }
        const color = computed.color;
        if (color) {
            const cMatch = color.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
            if (cMatch) {
                const cr = parseInt(cMatch[1]), cg = parseInt(cMatch[2]), cb = parseInt(cMatch[3]);
                const cLum = (0.299 * cr + 0.587 * cg + 0.114 * cb) / 255;
                if (cLum > 0.8) { el.style.setProperty('color', '#333333', 'important'); }
            }
        }
    });
}

function createPdfContainer(previewDoc) {
    const container = document.createElement('div');

    const previewStyles = previewDoc.querySelectorAll('style');
    const styleHtml = Array.from(previewStyles).map(function(s) { return s.outerHTML; }).join('');
    container.innerHTML = styleHtml + previewDoc.body.innerHTML;
    document.body.appendChild(container);
    return { container: container, containerWidthPx: containerWidthPx };
}

function downloadBlob(blob, filename) {
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [new File([blob], filename, { type: blob.type })] })) {
        const file = new File([blob], filename, { type: blob.type });
        navigator.share({ files: [file], title: filename }).then(function() { showToast('导出成功', 'success'); }).catch(function(err) { if (err.name !== 'AbortError') fallbackDownload(blob, filename); });
    } else { fallbackDownload(blob, filename); }
}

function fallbackDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    showToast('PDF导出成功', 'success');
}

function getFilename() {
    const content = htmlEditor.value;
    const title = (content.match(/<title[^>]*>([\s\S]*?)<\/title>/i) || [])[1];
    return (title ? title.trim().replace(/[^a-zA-Z0-9\u4e00-\u9fa5_-]/g, '_') : 'export') + '.pdf';
}

async function exportMethod3() {
    setStatus('方案3: pdf-lib + Canvas 渲染中...'); showToast('方案3: 开始生成', 'info');
    try {
        const previewDoc = getPreviewDoc();
        if (!previewDoc || !previewDoc.body || !previewDoc.body.innerHTML.trim()) { showToast('预览内容为空', 'error'); return; }
        if (typeof PDFLib === 'undefined' || typeof html2canvas === 'undefined') { showToast('库未加载', 'error'); return; }
        const { container, containerWidthPx } = createPdfContainer(previewDoc);
        forceWhiteBackground(container);
        const canvas = await html2canvas(container, { scale: 2, useCORS: true, logging: false, backgroundColor: '#ffffff', width: containerWidthPx, windowWidth: containerWidthPx });
        const imgData = canvas.toDataURL('image/png');
        const imgBytes = await fetch(imgData).then(function(r) { return r.arrayBuffer(); });
        const pdfDoc = await PDFLib.PDFDocument.create();
        const pageWidth = 595.28; const pageHeight = 841.89; const margin = 28.35;
        const contentWidth = pageWidth - margin * 2; const contentHeight = pageHeight - margin * 2;
        const imgAspect = canvas.width / canvas.height;
        const renderWidth = contentWidth; const renderHeight = renderWidth / imgAspect;
        let yOffset = 0; const totalContentHeight = renderHeight; const scale = canvas.width / renderWidth;
        while (yOffset < totalContentHeight) {
            const page = pdfDoc.addPage([pageWidth, pageHeight]);
            page.drawRectangle({ x: 0, y: 0, width: pageWidth, height: pageHeight, color: PDFLib.rgb(1, 1, 1) });
            const sliceHeight = Math.min(contentHeight, totalContentHeight - yOffset);
            const sourceY = yOffset * scale; const sourceHeight = sliceHeight * scale;
            const sliceCanvas = document.createElement('canvas');
            sliceCanvas.width = canvas.width; sliceCanvas.height = Math.round(sourceHeight);
            const ctx = sliceCanvas.getContext('2d');
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, sliceCanvas.width, sliceCanvas.height);
            ctx.drawImage(canvas, 0, Math.round(sourceY), canvas.width, Math.round(sourceHeight), 0, 0, canvas.width, Math.round(sourceHeight));
            const sliceData = sliceCanvas.toDataURL('image/png');
            const sliceBytes = await fetch(sliceData).then(function(r) { return r.arrayBuffer(); });
            const sliceImg = await pdfDoc.embedPng(sliceBytes);
            page.drawImage(sliceImg, { x: margin, y: pageHeight - margin - sliceHeight, width: renderWidth, height: sliceHeight });
            yOffset += contentHeight;
        }
        const pdfBytes = await pdfDoc.save();
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        downloadBlob(blob, getFilename());
        try { document.body.removeChild(container); } catch(e) {}
        setStatus('方案3: 导出完成');
    } catch (error) { showToast('方案3失败: ' + error.message, 'error'); setStatus('方案3: 失败'); }
}
