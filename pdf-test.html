<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HTML → PDF 方案对比测试</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        :root{--bg:#0f0f0f;--surface:#1a1a1a;--surface2:#242424;--border:#333;--text:#e6e6e6;--text2:#999;--accent:#4a9eff;--success:#28a745;--error:#dc3545;--warning:#e67e22;--radius:10px;}
        html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;}
        .app{display:flex;flex-direction:column;height:100vh;height:100dvh;}
        .header{padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0;}
        .header h1{font-size:15px;font-weight:600;color:var(--accent);white-space:nowrap;}
        .header .badge{font-size:11px;background:var(--accent);color:#fff;padding:2px 8px;border-radius:10px;white-space:nowrap;}
        .main{flex:1;display:flex;overflow:hidden;min-height:0;}
        .editor-panel{width:50%;display:flex;flex-direction:column;border-right:1px solid var(--border);min-width:0;}
        .preview-panel{width:50%;display:flex;flex-direction:column;min-width:0;}
        .panel-header{padding:6px 12px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:12px;font-weight:500;color:var(--text2);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
        .panel-header .label{color:var(--text);font-weight:600;}
        #htmlEditor{flex:1;width:100%;background:#111;color:#d4d4d4;border:none;padding:12px;font-family:"SF Mono","Fira Code",Menlo,Monaco,monospace;font-size:12px;line-height:1.5;resize:none;outline:none;tab-size:2;}
        #previewFrame{flex:1;width:100%;border:none;background:#fff;}
        .templates-bar{padding:6px 12px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;}
        .templates-bar h3{font-size:10px;color:var(--text2);margin-bottom:4px;}
        .templates-scroll{display:flex;gap:4px;overflow-x:auto;padding-bottom:3px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
        .tpl-btn{flex-shrink:0;padding:4px 8px;border:1px solid var(--border);border-radius:5px;background:var(--surface2);color:var(--text);font-size:10px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:3px;}
        .tpl-btn:hover{border-color:var(--accent);}
        .tpl-btn.active{border-color:var(--accent);background:rgba(74,158,255,.15);color:var(--accent);}
        .methods-bar{padding:6px 12px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;}
        .methods-bar h3{font-size:10px;color:var(--text2);margin-bottom:4px;}
        .methods-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;}
        .method-btn{padding:5px 3px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--text);font-size:9px;font-weight:500;cursor:pointer;text-align:center;line-height:1.3;}
        .method-btn:hover{border-color:var(--accent);}
        .method-btn .num{display:inline-block;width:14px;height:14px;line-height:14px;border-radius:50%;background:var(--accent);color:#fff;font-size:8px;margin-right:2px;}
        .method-btn .desc{display:block;font-size:7px;color:var(--text2);margin-top:1px;}
        .method-btn.ready{border-color:var(--success);}
        .method-btn.ready .num{background:var(--success);}
        .method-btn.missing{border-color:var(--warning);}
        .method-btn.missing .num{background:var(--warning);}
        .method-btn.selected{outline:2px solid var(--accent);outline-offset:-2px;}
        .bottom-panel{background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;max-height:180px;overflow-y:auto;}
        .panel-tabs{display:flex;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1;}
        .panel-tab{padding:6px 14px;font-size:11px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;}
        .panel-tab:hover{color:var(--text);}
        .panel-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
        .panel-content{padding:8px 12px;font-size:11px;line-height:1.6;}
        .lib-card{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:var(--surface2);}
        .lib-card .lib-icon{font-size:20px;}
        .lib-card .lib-info{flex:1;min-width:0;}
        .lib-card .lib-name{font-weight:600;color:var(--text);font-size:12px;}
        .lib-card .lib-desc{font-size:10px;color:var(--text2);margin-top:1px;}
        .lib-card .lib-size{font-size:10px;color:var(--warning);font-weight:500;}
        .lib-card .lib-status{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500;}
        .lib-card .lib-status.loaded{background:rgba(40,167,69,.15);color:var(--success);}
        .lib-card .lib-status.unloaded{background:rgba(231,76,60,.15);color:var(--error);}
        .lib-load-btn{padding:4px 12px;border:1px solid var(--accent);border-radius:5px;background:transparent;color:var(--accent);font-size:10px;cursor:pointer;white-space:nowrap;}
        .lib-load-btn:hover{background:var(--accent);color:#fff;}
        .load-all-btn{padding:6px 16px;border:1px solid var(--accent);border-radius:8px;background:var(--accent);color:#fff;font-size:11px;cursor:pointer;font-weight:500;}
        .load-all-btn:hover{background:#3d8bfd;}
        .status-bar{padding:4px 12px;background:var(--surface2);border-top:1px solid var(--border);font-size:10px;color:var(--text2);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
        .status-bar .status-dot{width:5px;height:5px;border-radius:50%;background:var(--success);display:inline-block;margin-right:5px;}
        .toast-container{position:fixed;top:16px;right:16px;z-index:10000;display:flex;flex-direction:column;gap:8px;}
        .toast{padding:10px 16px;border-radius:var(--radius);font-size:13px;color:#fff;animation:toastIn .3s ease;max-width:320px;word-break:break-word;}
        .toast.info{background:var(--accent);}
        .toast.success{background:var(--success);}
        .toast.error{background:var(--error);}
        .toast.warning{background:var(--warning);}
        @keyframes toastIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
        @media(max-width:768px){.main{flex-direction:column;}.editor-panel,.preview-panel{width:100%;height:50%;}.editor-panel{border-right:none;border-bottom:1px solid var(--border);}.methods-grid{grid-template-columns:repeat(3,1fr);}}
    </style>
</head>
<body>
<div class="app">
    <div class="header"><h1>HTML → PDF 方案对比测试</h1><span class="badge">10方案·14模板</span></div>
    <div class="main">
        <div class="editor-panel">
            <div class="panel-header"><span class="label">HTML 编辑器</span><span id="charCount" style="font-size:10px;">0 字符</span></div>
            <textarea id="htmlEditor" spellcheck="false"></textarea>
            <div class="templates-bar"><h3>📋 预制模板：</h3><div class="templates-scroll" id="templatesScroll"></div></div>
        </div>
        <div class="preview-panel">
            <div class="panel-header"><span class="label">实时预览</span><span id="currentTpl" style="font-size:10px;color:var(--accent);"></span></div>
            <iframe id="previewFrame"></iframe>
            <div class="methods-bar"><h3>🔧 导出方案（🟢=库已加载 🟡=需加载库）：</h3><div class="methods-grid" id="methodsGrid"></div></div>
        </div>
    </div>
    <div class="bottom-panel">
        <div class="panel-tabs">
            <div class="panel-tab active" data-tab="libs" onclick="switchTab('libs')">📦 库管理</div>
            <div class="panel-tab" data-tab="method" onclick="switchTab('method')">ℹ️ 方案详情</div>
        </div>
        <div class="panel-content" id="panelContent"></div>
    </div>
    <div class="status-bar"><span><span class="status-dot"></span>就绪</span><span id="statusText">选择模板 → 预览 → 选择方案导出</span></div>
</div>
<div class="toast-container" id="toastContainer"></div>
<script>
var htmlEditor=document.getElementById('htmlEditor'),previewFrame=document.getElementById('previewFrame'),charCount=document.getElementById('charCount'),statusText=document.getElementById('statusText'),currentTpl=document.getElementById('currentTpl'),templatesScroll=document.getElementById('templatesScroll'),methodsGrid=document.getElementById('methodsGrid'),panelContent=document.getElementById('panelContent');
var activeTab='libs',selectedMethod=null;
var LIBS={jspdf:{name:'jsPDF',icon:'📄',url:'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js',size:'~280KB',desc:'纯JS PDF生成库，支持文本/图片/分页。最流行的浏览器端PDF方案。',check:function(){return typeof window.jspdf!=='undefined';}},html2canvas:{name:'html2canvas',icon:'📸',url:'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',size:'~120KB',desc:'DOM→Canvas截图库。支持CSS渐变/阴影，但backdrop-filter等部分CSS支持有限。',check:function(){return typeof html2canvas!=='undefined';}},html2pdf:{name:'html2pdf.js',icon:'📦',url:'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js',size:'~400KB',desc:'html2canvas+jsPDF封装库，自带分页。内含jsPDF和html2canvas。',check:function(){return typeof html2pdf!=='undefined';}},pdflib:{name:'pdf-lib',icon:'🔧',url:'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js',size:'~250KB',desc:'底层PDF操作库，可创建/修改PDF。不依赖html2canvas。',check:function(){return typeof PDFLib!=='undefined';}},mscreenshot:{name:'modern-screenshot',icon:'🖼️',url:'https://cdn.jsdelivr.net/npm/modern-screenshot@4.4.39/dist/index.min.js',size:'~50KB',desc:'新一代DOM截图库，对CSS渐变/backdrop-filter等现代CSS支持更好。',check:function(){return typeof modernScreenshot!=='undefined';}}};
var libLoading={};
var METHODS=[{id:1,name:'iframe+jsPDF',libs:['jspdf','html2canvas'],desc:'iframe渲染→html2canvas截图→jsPDF分页。最可靠的基础方案。'},{id:2,name:'html2pdf.js',libs:['html2pdf'],desc:'封装库方案，自带分页。加载html2pdf即可（内含jsPDF+html2canvas）。'},{id:3,name:'pdf-lib+Canvas',libs:['pdflib','html2canvas'],desc:'pdf-lib替代jsPDF，更底层PDF控制。PNG嵌入质量更高。'},{id:4,name:'modern-screenshot',libs:['jspdf','mscreenshot'],desc:'modern-screenshot替代html2canvas，对CSS渐变/backdrop-filter支持更好。'},{id:5,name:'iframe打印',libs:[],desc:'隐藏iframe触发浏览器打印。无需任何库！最轻量方案。'},{id:6,name:'新窗口打印',libs:[],desc:'新窗口打开HTML触发打印。无需任何库！可能被弹窗拦截。'},{id:7,name:'高清图片PDF',libs:['jspdf','html2canvas'],desc:'3倍分辨率截图→PDF。文件更大但更清晰。'},{id:8,name:'Canvas直绘',libs:['jspdf','html2canvas'],desc:'预分配Canvas尺寸，html2canvas直接渲染到指定Canvas。'},{id:9,name:'双iframe隔离',libs:['jspdf','html2canvas'],desc:'外层iframe包裹内层iframe，双重隔离环境渲染。'},{id:10,name:'srcdoc直出',libs:['jspdf','html2canvas'],desc:'iframe.srcdoc加载HTML，最简洁的渲染方式。'}];
var TEMPLATES=[{id:'math',icon:'📐',name:'数学练习题'},{id:'chinese',icon:'📝',name:'语文生字词'},{id:'poster',icon:'🎨',name:'活动海报'},{id:'legal',icon:'⚖️',name:'法律文书'},{id:'resume',icon:'👤',name:'个人简历'},{id:'invoice',icon:'🧾',name:'发票收据'},{id:'contract',icon:'📜',name:'合同模板'},{id:'exam',icon:'📋',name:'考试试卷'},{id:'recipe',icon:'🍳',name:'美食食谱'},{id:'meeting',icon:'📅',name:'会议纪要'},{id:'paper',icon:'🎓',name:'学术论文'},{id:'schedule',icon:'🗓️',name:'课程表'},{id:'dark',icon:'🌙',name:'深色背景'},{id:'gradient',icon:'🌈',name:'渐变背景'}];
var SAMPLES={};
SAMPLES.math='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>数学练习题</title><style>body{font-family:"Times New Roman",serif;padding:40px;max-width:800px;margin:0 auto;color:#333;}.header{text-align:center;border-bottom:2px solid #333;padding-bottom:15px;margin-bottom:25px;}.header h1{font-size:22px;}.question{margin-bottom:22px;line-height:1.8;}.answer-line{border-bottom:1px solid #999;width:200px;display:inline-block;margin:0 5px;}.box{border:1px solid #ccc;padding:10px;border-radius:4px;margin-top:8px;}.footer{margin-top:30px;text-align:center;font-size:12px;color:#999;border-top:1px solid #ccc;padding-top:10px;}</style></head><body><div class="header"><h1>八年级数学期中练习题</h1><p>考试时间：90分钟 | 满分：100分</p></div><div class="question"><strong>一、选择题</strong>（每题3分）</div><div class="question">1. 一元二次方程 x²-4x+3=0 的根为（  ）<br>A. x₁=1,x₂=3  B. x₁=-1,x₂=-3</div><div class="question"><strong>二、填空题</strong></div><div class="question">4. 方程 x²=9 的解为<span class="answer-line"></span></div><div class="question"><strong>三、解答题</strong></div><div class="question">7. 解方程：x²-5x+6=0</div><div class="footer">命题人：数学教研组 | 2026年</div></body></html>';
SAMPLES.chinese='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>语文生字词</title><style>body{font-family:"KaiTi",serif;padding:40px;max-width:800px;margin:0 auto;color:#333;background:#fff;}.header{text-align:center;border-bottom:3px double #8B4513;padding-bottom:15px;margin-bottom:25px;}.header h1{font-size:24px;color:#8B4513;letter-spacing:4px;}.word-table{width:100%;border-collapse:collapse;}.word-table th{background:#F5DEB3;color:#8B4513;padding:8px;border:1px solid #D2B48C;}.word-table td{padding:8px;border:1px solid #D2B48C;text-align:center;}.pinyin{color:#B22222;font-size:13px;}.idiom-box{display:inline-block;border:2px solid #8B4513;border-radius:8px;padding:8px 16px;margin:5px;font-size:18px;color:#8B4513;background:#FFF8DC;}</style></head><body><div class="header"><h1>语文生字生词练习</h1></div><table class="word-table"><tr><th>生字</th><th>拼音</th><th>部首</th><th>组词</th></tr><tr><td style="font-size:22px;">澜</td><td class="pinyin">lán</td><td>氵</td><td>波澜</td></tr></table><span class="idiom-box">波澜壮阔</span><span class="idiom-box">峰峦雄伟</span></body></html>';
SAMPLES.poster='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>校园音乐节海报</title><style>body{margin:0;padding:0;font-family:-apple-system,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#f093fb 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;}.poster{width:600px;background:rgba(255,255,255,0.1);backdrop-filter:blur(20px);border-radius:24px;padding:50px 40px;text-align:center;color:#fff;border:1px solid rgba(255,255,255,0.3);box-shadow:0 25px 50px rgba(0,0,0,0.3);}.poster h1{font-size:48px;font-weight:900;margin-bottom:8px;text-shadow:0 4px 20px rgba(0,0,0,0.3);}.poster .subtitle{font-size:20px;opacity:0.9;margin-bottom:30px;letter-spacing:3px;}.poster .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:25px 0;text-align:left;}.poster .info-item{background:rgba(255,255,255,0.1);border-radius:12px;padding:15px;}.poster .info-item .label{font-size:11px;opacity:0.7;}.poster .info-item .value{font-size:16px;font-weight:700;}.poster .artist{background:rgba(255,255,255,0.15);border-radius:20px;padding:6px 18px;font-size:14px;display:inline-block;margin:4px;border:1px solid rgba(255,255,255,0.2);}</style></head><body><div class="poster"><h1>星河音乐节</h1><div class="subtitle">GALAXY MUSIC FESTIVAL</div><div class="info-grid"><div class="info-item"><div class="label">日期</div><div class="value">5月17-18日</div></div><div class="info-item"><div class="label">时间</div><div class="value">18:00-23:00</div></div><div class="info-item"><div class="label">地点</div><div class="value">星光体育场</div></div><div class="info-item"><div class="label">舞台</div><div class="value">3大主题舞台</div></div></div><div><span class="artist">星际乐队</span><span class="artist">月光组合</span><span class="artist">银河之声</span></div></div></body></html>';
SAMPLES.legal='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>律师函</title><style>body{font-family:"SimSun",serif;padding:50px 60px;max-width:800px;margin:0 auto;color:#000;line-height:2;}.header{text-align:center;margin-bottom:40px;}.header h1{font-size:26px;letter-spacing:6px;}.header .firm{font-size:14px;border-top:2px solid #000;border-bottom:1px solid #000;padding:8px 0;margin-top:10px;}.title{text-align:center;font-size:20px;font-weight:bold;margin-bottom:30px;letter-spacing:4px;}.content{text-indent:2em;margin-bottom:15px;font-size:15px;}.highlight{font-weight:bold;text-decoration:underline;}.stamp{display:inline-block;border:3px solid #c00;color:#c00;padding:5px 15px;border-radius:50%;font-size:14px;font-weight:bold;transform:rotate(-15deg);margin-left:10px;opacity:0.7;}</style></head><body><div class="header"><h1>律 师 函</h1><div class="firm">XX律师事务所</div></div><div class="title">关于要求支付工程款的律师函</div><div class="content">合同编号：<span class="highlight">GZ-2025-0315</span>，合同总价人民币<span class="highlight">叁佰伍拾万元整</span>。</div><div class="content">请于收到本函之日起<span class="highlight">十五个工作日</span>内支付剩余工程款。</div><div style="text-align:right;margin-top:40px;"><div>XX律师事务所<span class="stamp">律师函</span></div><div>2026年4月28日</div></div></body></html>';

function isLibLoaded(id){return LIBS[id]&&LIBS[id].check();}
function isMethodReady(method){return method.libs.every(function(lid){return isLibLoaded(lid);});}
function loadLib(id){if(isLibLoaded(id)){showToast(LIBS[id].name+' 已加载','success');return Promise.resolve();}if(libLoading[id]){showToast(LIBS[id].name+' 正在加载中...','warning');return libLoading[id];}showToast('正在加载 '+LIBS[id].name+'...','info');libLoading[id]=new Promise(function(resolve,reject){var s=document.createElement('script');s.src=LIBS[id].url;s.onload=function(){libLoading[id]=null;showToast(LIBS[id].name+' 加载成功','success');refreshUI();resolve();};s.onerror=function(){libLoading[id]=null;showToast(LIBS[id].name+' 加载失败','error');refreshUI();reject();};document.head.appendChild(s);});return libLoading[id];}

function selectMethod(id){selectedMethod=id;document.querySelectorAll('.method-btn').forEach(function(b){b.classList.remove('selected');});var btn=document.getElementById('methodBtn'+id);if(btn)btn.classList.add('selected');switchTab('method');renderPanel();var method=METHODS.find(function(m){return m.id===id;});if(method&&!isMethodReady(method)){loadLibsForMethod(method).then(function(){showToast('方案'+id+'所需库已全部加载','success');doExport(id);}).catch(function(){showToast('部分库加载失败','error');});}else if(method&&isMethodReady(method)){doExport(id);}}
function switchTab(tab){activeTab=tab;document.querySelectorAll('.panel-tab').forEach(function(t){t.classList.toggle('active',t.dataset.tab===tab);});renderPanel();}
function renderPanel(){if(activeTab==='libs')renderLibsPanel();else renderMethodPanel();}
function renderLibsPanel(){var html='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><span style="font-size:12px;font-weight:600;color:var(--text);">📦 库文件管理</span><button class="load-all-btn" onclick="loadAllLibs().then(function(){refreshUI();})">一键加载全部</button></div>';Object.keys(LIBS).forEach(function(id){var lib=LIBS[id];var loaded=isLibLoaded(id);html+='<div class="lib-card"><div class="lib-icon">'+lib.icon+'</div><div class="lib-info"><div class="lib-name">'+lib.name+'</div><div class="lib-desc">'+lib.desc+'</div><div class="lib-size">'+lib.size+'</div></div><span class="lib-status '+(loaded?'loaded':'unloaded')+'">'+(loaded?'✅ 已加载':'❌ 未加载')+'</span>';if(!loaded)html+='<button class="lib-load-btn" onclick="loadLib(\''+id+'\').then(function(){refreshUI();})">加载</button>';html+='</div>';});panelContent.innerHTML=html;}
function renderMethodPanel(){if(!selectedMethod){panelContent.innerHTML='<div style="text-align:center;padding:20px;color:var(--text2);">点击上方方案按钮查看详情并导出</div>';return;}var m=METHODS.find(function(m){return m.id===selectedMethod;});var ready=isMethodReady(m);var html='<div style="margin-bottom:8px;"><strong style="color:var(--accent);">方案'+m.id+'：'+m.name+'</strong></div><div style="font-size:11px;color:var(--text2);margin-bottom:8px;">'+m.desc+'</div>';if(m.libs.length>0){html+='<div style="margin-bottom:8px;font-size:11px;"><strong>依赖库：</strong>';m.libs.forEach(function(lid){var loaded=isLibLoaded(lid);html+='<span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;margin:2px;'+(loaded?'background:rgba(40,167,69,.15);color:#28a745;border:1px solid rgba(40,167,69,.3);':'background:rgba(231,76,60,.15);color:#dc3545;border:1px solid rgba(231,76,60,.3);')+'">'+LIBS[lid].icon+' '+LIBS[lid].name+(loaded?' ✅':' ❌')+'</span>';});html+='</div>';}else{html+='<div style="margin-bottom:8px;font-size:11px;"><strong>依赖库：</strong><span style="background:rgba(40,167,69,.15);color:#28a745;padding:2px 8px;border-radius:4px;font-size:10px;">无需任何库 🎉</span></div>';}html+='<div>';if(ready){html+='<button class="load-all-btn" onclick="doExport('+m.id+')">🚀 立即导出</button>';}else{html+='<button class="load-all-btn" onclick="loadLibsForMethod(METHODS.find(function(x){return x.id==='+m.id+';})).then(function(){refreshUI();doExport('+m.id+');})">📥 先加载库再导出</button>';}html+='</div>';panelContent.innerHTML=html;}
function createRenderIframe(html,width,callback){var iframe=document.createElement('iframe');iframe.style.cssText='position:fixed;left:0;top:0;width:'+width+'px;height:10000px;z-index:9999;opacity:0.01;pointer-events:none;border:none;';document.body.appendChild(iframe);var iframeDoc=iframe.contentDocument||iframe.contentWindow.document;iframeDoc.open();iframeDoc.write(html);iframeDoc.close();setTimeout(function(){callback(iframe);},800);}
function removeIframe(iframe){try{document.body.removeChild(iframe);}catch(e){}}
function canvasToPdfPages(canvas,jsPDFConstructor){var imgWidthMm=190;var imgHeightMm=(canvas.height*imgWidthMm)/canvas.width;var pdf=new jsPDFConstructor('p','mm','a4');var positionMm=0,pageHeightMm=277,remainingHeightMm=imgHeightMm;while(remainingHeightMm>0){var sourceY=positionMm*(canvas.width/imgWidthMm);var sourceHeight=pageHeightMm*(canvas.width/imgWidthMm);var pageCanvas=document.createElement('canvas');pageCanvas.width=canvas.width;pageCanvas.height=Math.min(Math.round(sourceHeight),canvas.height-Math.round(sourceY));if(pageCanvas.height<=0)break;var ctx=pageCanvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,pageCanvas.width,pageCanvas.height);ctx.drawImage(canvas,0,Math.round(sourceY),canvas.width,pageCanvas.height,0,0,canvas.width,pageCanvas.height);var pageImgData=pageCanvas.toDataURL('image/jpeg',0.95);if(positionMm>0)pdf.addPage();var pageImgHeightMm=(pageCanvas.height*imgWidthMm)/canvas.width;pdf.addImage(pageImgData,'JPEG',10,10,imgWidthMm,pageImgHeightMm);remainingHeightMm-=pageHeightMm;positionMm+=pageHeightMm;}return pdf;}
function downloadBlob(blob,filename){if(navigator.share&&navigator.canShare&&navigator.canShare({files:[new File([blob],filename,{type:blob.type})]})){var file=new File([blob],filename,{type:blob.type});navigator.share({files:[file],title:filename}).then(function(){showToast('导出成功','success');}).catch(function(err){if(err.name!=='AbortError')fallbackDownload(blob,filename);});}else{fallbackDownload(blob,filename);}}
function fallbackDownload(blob,filename){var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(function(){URL.revokeObjectURL(url);},1000);showToast('PDF导出成功','success');}
async function doExport(id){var method=METHODS.find(function(m){return m.id===id;});if(!method)return;if(!isMethodReady(method)){showToast('请先加载所需库','error');return;}var html=getHtmlContent();if(!html.trim()){showToast('内容为空','error');return;}setStatus('方案'+id+': '+method.name+' 生成中...');showToast('方案'+id+': 开始生成','info');try{switch(id){case 1:await exportIframeJsPDF(html);break;case 2:await exportHtml2Pdf(html);break;case 3:await exportPdfLibCanvas(html);break;case 4:await exportModernScreenshot(html);break;case 5:exportIframePrint(html);break;case 6:exportNewWindowPrint(html);break;case 7:await exportHighResImagePdf(html);break;case 8:await exportCanvasDirect(html);break;case 9:await exportDoubleIframe(html);break;case 10:await exportSrcdoc(html);break;}setStatus('方案'+id+': 导出完成');}catch(e){showToast('方案'+id+'失败: '+e.message,'error');setStatus('方案'+id+': 失败');}}
async function exportIframeJsPDF(html){createRenderIframe(html,794,async function(iframe){try{var iframeBody=iframe.contentDocument.body;var canvas=await html2canvas(iframeBody,{scale:2,useCORS:true,logging:false,backgroundColor:null,width:794,windowWidth:794});var pdf=canvasToPdfPages(canvas,window.jspdf.jsPDF);downloadBlob(pdf.output('blob'),getFilename());removeIframe(iframe);}catch(e){showToast('导出失败: '+e.message,'error');removeIframe(iframe);}});}
async function exportHtml2Pdf(html){createRenderIframe(html,794,async function(iframe){try{var iframeBody=iframe.contentDocument.body;var opt={margin:10,filename:getFilename(),image:{type:'jpeg',quality:0.95},html2canvas:{scale:2,useCORS:true,logging:false,backgroundColor:null,width:794,windowWidth:794},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['avoid-all','css','legacy']}};await html2pdf().set(opt).from(iframeBody).save();showToast('导出成功','success');removeIframe(iframe);}catch(e){showToast('导出失败: '+e.message,'error');removeIframe(iframe);}});}
async function exportPdfLibCanvas(html){createRenderIframe(html,794,async function(iframe){try{var iframeBody=iframe.contentDocument.body;var canvas=await html2canvas(iframeBody,{scale:2,useCORS:true,logging:false,backgroundColor:null,width:794,windowWidth:794});var imgData=canvas.toDataURL('image/png');var imgBytes=await fetch(imgData).then(function(r){return r.arrayBuffer();});var pdfDoc=await PDFLib.PDFDocument.create();var pageWidth=595.28,pageHeight=841.89,margin=28.35;var contentWidth=pageWidth-margin*2,contentHeight=pageHeight-margin*2;var imgAspect=canvas.width/canvas.height;var renderWidth=contentWidth,renderHeight=renderWidth/imgAspect;var yOffset=0,totalContentHeight=renderHeight,scale=canvas.width/renderWidth;while(yOffset<totalContentHeight){var page=pdfDoc.addPage([pageWidth,pageHeight]);var sliceHeight=Math.min(contentHeight,totalContentHeight-yOffset);var sourceY=yOffset*scale,sourceHeight=sliceHeight*scale;var sliceCanvas=document.createElement('canvas');sliceCanvas.width=canvas.width;sliceCanvas.height=Math.round(sourceHeight);var ctx=sliceCanvas.getContext('2d');ctx.drawImage(canvas,0,Math.round(sourceY),canvas.width,Math.round(sourceHeight),0,0,canvas.width,Math.round(sourceHeight));var sliceData=sliceCanvas.toDataURL('image/png');var sliceBytes=await fetch(sliceData).then(function(r){return r.arrayBuffer();});var sliceImg=await pdfDoc.embedPng(sliceBytes);page.drawImage(sliceImg,{x:margin,y:pageHeight-margin-sliceHeight,width:renderWidth,height:sliceHeight});yOffset+=contentHeight;}var pdfBytes=await pdfDoc.save();downloadBlob(new Blob([pdfBytes],{type:'application/pdf'}),getFilename());removeIframe(iframe);}catch(e){showToast('导出失败: '+e.message,'error');removeIframe(iframe);}});}
async function exportModernScreenshot(html){createRenderIframe(html,794,async function(iframe){try{var iframeBody=iframe.contentDocument.body;var canvas=await modernScreenshot.domToCanvas(iframeBody,{scale:2,width:794});var pdf=canvasToPdfPages(canvas,window.jspdf.jsPDF);downloadBlob(pdf.output('blob'),getFilename());removeIframe(iframe);}catch(e){showToast('导出失败: '+e.message,'error');removeIframe(iframe);}});}
function exportIframePrint(html){createRenderIframe(html,794,function(iframe){try{iframe.contentWindow.focus();iframe.contentWindow.print();setTimeout(function(){removeIframe(iframe);},2000);}catch(e){showToast('打印失败: '+e.message,'error');removeIframe(iframe);}});}
function exportNewWindowPrint(html){var printWin=window.open('','_blank');if(!printWin){showToast('弹窗被拦截','error');return;}printWin.document.write(html);printWin.document.close();printWin.onload=function(){printWin.print();setTimeout(function(){printWin.close();},500);};}
async function exportHighResImagePdf(html){createRenderIframe(html,794,async function(iframe){try{var iframeBody=iframe.contentDocument.body;var canvas=await html2canvas(iframeBody,{scale:3,useCORS:true,logging:false,backgroundColor:null,width:794,windowWidth:794});var pdf=canvasToPdfPages(canvas,window.jspdf.jsPDF);downloadBlob(pdf.output('blob'),getFilename());removeIframe(iframe);}catch(e){showToast('导出失败: '+e.message,'error');removeIframe(iframe);}});}
async function exportCanvasDirect(html){createRenderIframe(html,794,async function(iframe){try{var iframeBody=iframe.contentDocument.body;var scrollHeight=iframeBody.scrollHeight||iframeBody.offsetHeight||1000;var canvas=document.createElement('canvas');canvas.width=794*2;canvas.height=scrollHeight*2;var ctx=canvas.getContext('2d');var rendered=await html2canvas(iframeBody,{scale:2,useCORS:true,logging:false,backgroundColor:null,width:794,windowWidth:794,canvas:canvas});var pdf=canvasToPdfPages(rendered,window.jspdf.jsPDF);downloadBlob(pdf.output('blob'),getFilename());removeIframe(iframe);}catch(e){showToast('导出失败: '+e.message,'error');removeIframe(iframe);}});}
async function exportDoubleIframe(html){var outerIframe=document.createElement('iframe');outerIframe.style.cssText='position:fixed;left:0;top:0;width:794px;height:10000px;z-index:9999;opacity:0.01;pointer-events:none;border:none;';document.body.appendChild(outerIframe);var outerDoc=outerIframe.contentDocument||outerIframe.contentWindow.document;outerDoc.open();outerDoc.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><style>html,body{margin:0;padding:0;}</style></head><body></body></html>');outerDoc.close();await new Promise(function(r){setTimeout(r,100);});var innerIframe=outerDoc.createElement('iframe');innerIframe.style.cssText='width:794px;border:none;';outerDoc.body.appendChild(innerIframe);var innerDoc=innerIframe.contentDocument||innerIframe.contentWindow.document;innerDoc.open();innerDoc.write(html);innerDoc.close();await new Promise(function(r){setTimeout(r,800);});try{var innerBody=innerDoc.body;var canvas=await html2canvas(innerBody,{scale:2,useCORS:true,logging:false,backgroundColor:null,width:794,windowWidth:794});var pdf=canvasToPdfPages(canvas,window.jspdf.jsPDF);downloadBlob(pdf.output('blob'),getFilename());}catch(e){showToast('导出失败: '+e.message,'error');}removeIframe(outerIframe);}
async function exportSrcdoc(html){var renderFrame=document.createElement('iframe');renderFrame.style.cssText='position:fixed;left:0;top:0;width:794px;height:10000px;z-index:9999;opacity:0.01;pointer-events:none;border:none;';document.body.appendChild(renderFrame);renderFrame.srcdoc=html;renderFrame.onload=async function(){try{var doc=renderFrame.contentDocument;await new Promise(function(r){setTimeout(r,300);});var body=doc.body;var canvas=await html2canvas(body,{scale:2,useCORS:true,logging:false,backgroundColor:null,width:794,windowWidth:794});var pdf=canvasToPdfPages(canvas,window.jspdf.jsPDF);downloadBlob(pdf.output('blob'),getFilename());removeIframe(renderFrame);}catch(e){showToast('导出失败: '+e.message,'error');removeIframe(renderFrame);}};}
buildTemplateButtons();loadSample('math');refreshUI();
